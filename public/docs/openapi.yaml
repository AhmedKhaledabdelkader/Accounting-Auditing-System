          $ref: '#/components/schemas/DetectedStructure'

    Field:
      type: string
      description: A column role the AI can map. Labels in `confirmation.fields`.
      enum:
        - account_number
        - account_name
        - opening_debit
        - opening_credit
        - opening_net
        - opening_side
        - period_debit
        - period_credit
        - period_net
        - period_side
        - adjustment_debit
        - adjustment_credit
        - adjustment_net
        - adjustment_side
        - closing_debit
        - closing_credit
        - closing_net
        - closing_side
        - notes
        - audit_request
        - existing_classification
        - existing_note_classification
        - note_reference

    ColumnLetter:
      type: [string, 'null']
      pattern: '^[A-Z]{1,3}$'
      description: Excel column letter (`A`–`ZZZ`), or `null` when the field is not in the file.
      example: B

    ColumnMapping:
      type: object
      description: |
        Field → column letter. Per amount group use a debit + credit pair, **or** one signed `_net` column,
        **or** a `_net` column with a `_side` (debit/credit indicator) column. Number and name in one cell: give both the same letter.
      propertyNames: { $ref: '#/components/schemas/Field' }
      additionalProperties: { $ref: '#/components/schemas/ColumnLetter' }
      example: { account_number: A, account_name: B, opening_debit: C, opening_credit: D, closing_debit: G, closing_credit: H, notes: null }

    ConfirmStructureRequest:
      type: object
      required: [header_rows, first_data_row, columns]
      properties:
        header_rows:
          type: array
          description: Excel rows of the header (may be empty, must be present).
          items: { type: integer, minimum: 1 }
          example: [1]
        first_data_row:
          type: integer
          minimum: 1
          example: 2
        columns:
          $ref: '#/components/schemas/ColumnMapping'
        acknowledge_doubts:
          type: boolean
          default: false
          description: Accept pausing doubts raised by this mapping that weren't shown before.

    DetectedStructure:
      type: object
      required: [sheet, header_rows, first_data_row, columns]
      properties:
        sheet: { type: integer, description: 1-based sheet index., example: 1 }
        header_rows: { type: array, items: { type: integer }, example: [1] }
        first_data_row: { type: integer, example: 2 }
        columns: { $ref: '#/components/schemas/ColumnMapping' }
        other_sheets:
          type: array
          items: { $ref: '#/components/schemas/OtherSheet' }

    StructureIssue:
      type: object
      description: |
        A structure-check finding. `error` = the mapping is certainly wrong; `doubt` = plausible but suspicious.
        A run pauses on any error, or a doubt whose `check` is in `structure_checks.pause_on`
        (default: `group_contradiction`, `row_reconciliation`, `rows_skipped`, `amount_numeric`, `side_values`,
        `group_fill`, `name_fill`, `header_rows`).
      properties:
        check:
          type: string
          enum:
            - sheet_exists
            - required_fields
            - column_exists
            - duplicate_mapping
            - first_data_row
            - first_row_is_header
            - first_rows
            - header_rows
            - header_contradiction
            - groups_swapped
            - sides_swapped
            - debit_credit_swap
            - group_contradiction
            - group_fill
            - name_fill
            - name_text
            - number_code
            - number_distinct
            - amount_numeric
            - text_numeric
            - side_values
            - row_reconciliation
            - rows_skipped
            - total_as_account
            - other_sheets
        severity: { type: string, enum: [error, doubt] }
        field: { oneOf: [{ $ref: '#/components/schemas/Field' }, { type: 'null' }] }
        column: { $ref: '#/components/schemas/ColumnLetter' }
        value: { description: 'Measured value, when the check has one.' }
        threshold: { description: 'Configured threshold, when the check has one.' }
        ai: { type: string, description: English message sent back to the AI on retry. }
        user: { type: string, description: Egyptian-Arabic message shown to the user. }

    Confirmation:
      type: object
      description: |
        Everything needed to confirm the mapping without the file. Client data — cleared with the file as soon as the
        run is confirmed, ends, is cancelled or expires.
      required: [structure, issues, sheet, columns, rows, fields, fields_text, expires_at, confirm_url]
      properties:
        structure:
          type: object
          required: [sheet, header_rows, first_data_row, columns]
          properties:
            sheet: { type: integer }
            header_rows: { type: array, items: { type: integer } }
            first_data_row: { type: integer }
            columns: { $ref: '#/components/schemas/ColumnMapping' }
        issues:
          type: array
          description: 'The structure-check findings as shown to the user: `StructureIssue` reduced to `check`, `severity`, `field`, `column`, `user` (no `ai` message, no measurements).'
          items:
            type: object
            required: [check, severity, field, column, user, user_text]
            properties:
              check: { type: string, description: 'A `StructureIssue.check` value.' }
              severity: { type: string, enum: [error, doubt] }
              field: { oneOf: [{ $ref: '#/components/schemas/Field' }, { type: 'null' }] }
              column: { $ref: '#/components/schemas/ColumnLetter' }
              user: { type: string, description: Egyptian-Arabic message shown to the user. }
              user_text: { type: string, description: "`user` in the request's language." }
        sheet: { type: [string, 'null'], description: Sheet name. }
        columns:
          type: array
          description: Every column of the sheet (up to 60), with up to 3 sample values.
          items:
            type: object
            required: [letter, header, samples, fields]
            properties:
              letter: { type: string, example: B }
              header: { type: [string, 'null'], example: اسم الحساب }
              samples: { type: array, items: { type: string }, example: [الصندوق, البنك, عملاء] }
              fields:
                type: array
                description: Fields currently mapped to this column.
                items: { $ref: '#/components/schemas/Field' }
        rows:
          type: array
          description: The first 12 rows of the sheet.
          items:
            type: object
            required: [row, cells]
            properties:
              row: { type: integer }
              cells:
                type: object
                description: Column letter → cell text.
                additionalProperties: { type: string }
        fields:
          type: object
          description: Field → Arabic label, for building the mapping UI.
          propertyNames: { $ref: '#/components/schemas/Field' }
          additionalProperties: { type: string }
        fields_text:
          type: object
          description: "Field → label in the request's language."
          propertyNames: { $ref: '#/components/schemas/Field' }
          additionalProperties: { type: string }
        expires_at:
          type: [string, 'null']
          format: date-time
          description: After this the run expires and the file is deleted.
        confirm_url:
          type: string
          example: /api/v1/classify/jobs/9d3c7a1e-5b2f-4c8e-a0d1-2f6b8e4c1a90/structure

    JobStatus:
      type: object
      required: [id, status, stage, progress, error, error_text, provider, model, status_url, cancel_url, result, cache, cost, confirmation]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [queued, running, needs_confirmation, done, failed, cancelled, expired]
        company_id: { type: [string, 'null'], format: uuid, description: 'The company chosen at upload (null: none).' }
        stage:
          type: [string, 'null']
          enum: [reading, structure, classifying, checks, null]
          description: |
            Current step while `running`. `needs_confirmation` keeps `structure`; `failed` keeps the step it failed in when
            the job itself failed it, and is `null` when the queue (timeout, crash) or the stalled-run sweep failed it;
            `queued`, `done`, `cancelled`, `expired` → `null`.
        progress:
          type: object
          description: AI batches during `classifying` (kept afterwards, also when `done`); `0/0` before it.
          required: [done, total]
          properties:
            done: { type: integer, example: 3 }
            total: { type: integer, example: 8 }
        error:
          type: [string, 'null']
          description: Failure message when `failed` or `expired`.
          example: No account rows found in the file.
        error_text:
          type: [string, 'null']
          description: "`error` in the request's language; a run that failed before this field, or a provider's own message: as stored."
          example: No account rows found in the file.
        provider:
          type: [string, 'null']
          description: |
            AI provider the run started with (`anthropic` | `gemini`); a run resumed after its confirmation shows the one it
            resumed with. `null` while `queued` before its first start, and for runs from before this field.
          example: anthropic
        model: { type: [string, 'null'], description: AI model the run started with; `null` like `provider`., example: claude-haiku-4-5 }
        status_url: { type: string, example: /api/v1/classify/jobs/9d3c7a1e-5b2f-4c8e-a0d1-2f6b8e4c1a90 }
        cancel_url:
          type: [string, 'null']
          description: Set only while cancellable (`queued`, `needs_confirmation`).
        result:
          oneOf:
            - $ref: '#/components/schemas/ClassificationResult'
            - type: 'null'
          description: Set only when `done`; identical to the synchronous endpoint's body.
        cache:
          type: [object, 'null']
          description: Set when `done` — rows answered by the classification cache vs sent to the AI.
          required: [rows_from_cache, rows_sent_to_llm, estimated_savings_usd, savings_is_estimate, savings_basis]
          properties:
            rows_from_cache: { type: integer }
            rows_sent_to_llm: { type: integer }
            estimated_savings_usd: { type: [number, 'null'], description: 'Estimate (cost per row sent × rows from cache), never billed.' }
            savings_is_estimate: { type: boolean, const: true }
            savings_basis: { type: [string, 'null'], enum: [this_run, recent_runs, none, unknown, null], description: '`none`: nothing came from the cache (savings 0); `unknown`: no cost per row known.' }
        cost:
          type: [object, 'null']
          description: |
            Set when `done` or `failed` by the job itself; null for older runs and for runs failed by the queue (timeout,
            crash) or the stalled-run sweep — what this run's AI calls actually cost, from the provider's
            token usage and config `classification.prices`. A run that paused for confirmation includes its detection calls.
          required: [cost_usd, input_tokens, output_tokens, cache_read_tokens, cache_write_tokens, llm_requests]
          properties:
            cost_usd: { type: [number, 'null'], description: '`null` when config has no price for the model (never guessed).' }
            input_tokens: { type: integer, description: Uncached input. }
            output_tokens: { type: integer }
            cache_read_tokens: { type: integer }
            cache_write_tokens: { type: integer }
            llm_requests: { type: integer, description: 'Requests sent to the provider, retries and failed attempts included.' }
        confirmation:
          oneOf:
            - $ref: '#/components/schemas/Confirmation'
            - type: 'null'
          description: Set only when `needs_confirmation`.

    DataFlag:
      type: object
      required: [type, difference, message, message_text]
      properties:
        type:
          type: string
          enum:
            - reconciliation
            - abnormal_opening
            - abnormal_closing
            - invalid_number
            - possible_parent
            - classification_mismatch
            - existing_classification_conflict
            - duplicate_account_number
            - inconsistent_classification
            - statement_mismatch
            - side_flip
            - side_contradiction
            - prefix_mismatch
            - parent_level
            - probable_parent
            - rule_review
            - missing_account_number
            - cash_credit
            - unused_movement
          description: |
            - `reconciliation`: opening + period (+ adjustments) ≠ closing.
            - `abnormal_opening` / `abnormal_closing`: balance on the opposite side of the sub class's normal side.
            - `invalid_number`: a cell that could not be parsed as an amount.
            - `possible_parent`: looks like a parent/group account (its number prefixes others' and its closing net equals theirs). Left out of the totals and the statements.
            - `parent_level` (`severity: info`): the file marks its levels (a level column, the cell's indentation, leading spaces or leading
              marks such as «. . .») and a deeper row follows this one: a parent, whatever its code. Left out of the totals and the
              statements; `rows` are the rows under it.
            - `probable_parent`: no level is known for the row, and its net in every real column group equals the sum of the account rows
              right below it (`rows`). Counted until the user decides: the report proposes excluding it (`mapping.parent_proposals`).
            - `classification_mismatch`: AI main class differs from the file's own classification. Not raised when both are
              expenses (a function label such as `تكلفة إيرادات` against a nature class such as rent).
            - `existing_classification_conflict`: the same account number has different classifications in the file
              (its own classification / notes column) on different rows.
            - `duplicate_account_number`: the account number repeats with different names (`severity: info`).
            - `statement_mismatch` (`severity: high`): the account moved between the income statement and the balance
              sheet against the file's own classification or its expense name. Changes profit; leads the note.
            - `inconsistent_classification`: rows of the same account (number + name) got different sub classes and were
              unified on the majority (tie: higher confidence). Label differences that follow the balance side are kept.
            - `side_flip`: a cached sub class was re-decided by the row's balance side within a side pair (config
              `side_pairs`, e.g. «موردون» ← «دفعات مقدمة للموردين»). Needs review for a pair with `flag: true`
              (customers, suppliers); `severity: info` for the others.
            - `side_contradiction`: the balance side contradicts a class the pair may not flip (the name is not one that
              flips, e.g. a non-VAT government receivable); kept, needs review.
            - `rule_review`: a classification rule matched the account and flags its balance side for review.
            - `missing_account_number`: no account number, in a file whose other accounts have one.
            - `cash_credit`: cash (box or bank) with a credit closing balance; replaces its `abnormal_closing`.
            - `unused_movement`: an account whose name marks it not to be used («لا تستخدمه») has movement.
            - `prefix_mismatch`: the account number contradicts the file's own numbering scheme, inferred from the file
              without the account itself (leave-one-out). Needs review. Not raised in the family form on an account a rule or a
              side pair put on the other side on purpose. Two forms:
              - `severity: high`: the first digits split the file into a balance-sheet range and an income-statement range
                (≥ `prefix_check.statement_min_share` (95%) of accounts agree, ≥ `min_accounts` (5) on each side; codes only
                need to start with a digit), and the account is classified on the other statement. Changes profit; leads the
                note.
              - no severity: ≥ `min_accounts` (5) other classified accounts under the same first digit (numeric codes),
                ≥ `min_share` (80%) of them one family (cost counts as expenses), and the account is in another family.
                E.g. `رقم الحساب بيبدأ بـ 1، وفي الملف ده 5 من 5 حساب تاني بيبدأوا بيه «أصول»، لكن التصنيف المقترح «مصروفات»`.

            `abnormal_opening` / `abnormal_closing` cap `classification_confidence` at 60 and `prefix_mismatch` at 50
            (config `confidence_caps`), except on rows answered by a manual correction or an exact-key imported entry.
        severity:
          type: string
          enum: [info, high]
          description: 'Absent on most flags. `info`: low priority, shown in `note`, never sets `needs_review` on its own (`duplicate_account_number`, unflagged `side_flip`). `high`: leads `note` (`statement_mismatch`, statement-level `prefix_mismatch`).'
        difference:
          type: [number, 'null']
          description: Signed difference (rounded to 2 decimals) for amount checks; `null` otherwise.
        message: { type: string, description: Egyptian-Arabic explanation. }
        message_text: { type: string, description: "`message` in the request's language; a run classified before this field: the Arabic." }
        rows: { type: array, items: { type: integer }, description: '`parent_level` / `probable_parent`: the Excel rows under the parent.' }
        matched_adjustment:
          type: object
          description: Only on a `reconciliation` flag explained by an adjusting entry.
          required: [sheet, amount]
          properties:
            sheet: { type: string }
            amount: { type: number }

    RowValues:
      type: object
      description: A row's number, name and amounts by group (`opening`, `period`, `adjustment`, `closing`; debit and credit, not negative).
      properties:
        account_number: { type: [string, 'null'], maxLength: 100 }
        account_name: { type: string, maxLength: 255, description: Required when adding. }
        opening_debit: { type: [number, 'null'], minimum: 0 }
        opening_credit: { type: [number, 'null'], minimum: 0 }
        period_debit: { type: [number, 'null'], minimum: 0 }
        period_credit: { type: [number, 'null'], minimum: 0 }
        adjustment_debit: { type: [number, 'null'], minimum: 0 }
        adjustment_credit: { type: [number, 'null'], minimum: 0 }
        closing_debit: { type: [number, 'null'], minimum: 0 }
        closing_credit: { type: [number, 'null'], minimum: 0 }
        sub_class: { type: [string, 'null'], description: 'Adding only: a sub-class from the taxonomy.' }
    RowChange:
      type: object
      required: [row, meta]
      properties:
        row: { $ref: '#/components/schemas/ClassifiedAccount' }
        meta:
          type: object
          required: [total, needs_review, avg_confidence, balance]
          properties:
            total: { type: integer }
            needs_review: { type: integer }
            avg_confidence: { type: number }
            balance: { type: object, additionalProperties: { type: number }, description: 'debit − credit per group after the change; non-zero: off.' }
    ClassifiedAccount:
      type: object
      required: [row, account_number, account_name, financial_statement, main_class, sub_class, opening_debit, opening_credit, period_debit, period_credit, adjustment_debit, adjustment_credit, closing_debit, closing_credit, classification_confidence, classification_reason, classification_reason_text, data_flags, source_note, existing_classification, existing_note_classification, existing_main_classes, audit_request, note_reference, needs_review, confidence, confidence_label, note, note_text]
      properties:
        row: { type: integer, description: Excel row in the source sheet. Rows are keyed by this — account numbers can repeat. }
        account_number: { type: string, description: 'As uploaded; `""` when the file has none.' }
        account_name: { type: string }
        financial_statement: { type: [string, 'null'], description: From the mapping table; `null` when unclassified., example: قائمة المركز المالي }
        heading: { type: [string, 'null'], description: 'The heading above the account in the file: the last section, parent or named zero row with no number before it (until a total row), or the parent the file''s levels put it under. Null: none, or a result stored before it was added.' }
        classification_source: { type: [string, 'null'], enum: [ai, cache, rule, manual_correction, imported, imported_code, imported_name, null], description: 'Who gave the class: `ai` (this run), `cache` (an earlier AI answer), `rule` (a classification rule), or a cache source. Null: unclassified, or a result stored before it was added.' }
        classification_rule: { type: [string, 'null'], description: 'The classification rule the account matched (its name), whether or not it changed the class. Null: none.' }
        added: { type: boolean, description: 'Added by hand after the classification (`POST …/rows`): not in the file. Absent: from the file.' }
        edited: { type: boolean, description: 'Its number, name or amounts were edited by hand (`PUT …/rows/{row}/values`). Absent: as in the file.' }
        main_class: { type: [string, 'null'], example: النقد ومافي حكمه }
        sub_class: { type: [string, 'null'], example: نقدية بالصندوق }
        opening_debit: { type: number }
        opening_credit: { type: number }
        period_debit: { type: number }
        period_credit: { type: number }
        adjustment_debit: { type: number, description: '`0` when the file has no adjustment columns.' }
        adjustment_credit: { type: number }
        closing_debit: { type: number }
        closing_credit: { type: number }
        classification_confidence:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            AI confidence, or the cache entry's (manual correction 100). `0` when unclassified or when the AI gave no score
            (the note says so). Capped by flags (config `confidence_caps`): ≤ 60 with `abnormal_opening` / `abnormal_closing`,
            ≤ 50 with `prefix_mismatch` — except rows answered by a `manual_correction` or exact-key `imported` entry, which
            keep theirs (the flag still sets `needs_review`). A capped row below 70 shows its reason in `note`.
        classification_reason: { type: [string, 'null'], description: 'Short Egyptian-Arabic reason; `null` when unclassified. A cache answer is prefixed by its source (e.g. `من بيانات مصنفة يدويًا تم استيرادها (نفس الكود والاسم، دون بند الميزانية): ` for a code + name match).' }
        classification_reason_text: { type: [string, 'null'], description: "`classification_reason` in the request's language: the system's wording translated (a cache source, the fallback), the AI's own reason as it is. A run classified before this field: as stored." }
        data_flags:
          type: array
          items: { $ref: '#/components/schemas/DataFlag' }
        source_note: { type: [string, 'null'], description: Text of the file's remarks column. }
        existing_classification: { type: [string, 'null'], description: 'The file''s own classification column (e.g. `بنود الميزانية`).' }
        existing_note_classification: { type: [string, 'null'], description: 'The file''s notes classification column (e.g. `إيضاحات`).' }
        existing_main_classes:
          type: [array, 'null']
          items: { type: string }
          description: Main classes the AI mapped the file's own value to (basis for `classification_mismatch`).
        audit_request: { type: [string, 'null'], description: Auditor request / PBC item. Never affects `needs_review`. }
        note_reference: { type: [string, 'null'], description: 'The file''s note number for the account (a `إيضاح` / `رقم الإيضاح` column, e.g. `5`, `15/أ`). A reference, not a remark: never sets `source_note` or `needs_review`.' }
        cache_key: { type: [string, 'null'], description: "The classification cache key of this row, normalized (`code:…|name:…|budget:…`, or `name:…|parent:…` for a generic name); null when the row can't be cached." }
        needs_review: { type: boolean, description: '`classification_confidence < 70` OR a `data_flags` entry without `severity: info` OR `source_note` set.' }
        confidence: { type: integer, deprecated: true, description: Same as `classification_confidence` (kept for existing consumers). }
        confidence_label: { type: string, deprecated: true, example: 98% }
        note: { type: string, description: 'Display text: reason (if confidence < 70) or `لم يتم تصنيف الحساب`, flag messages, `ملاحظة في الملف: …`, joined by ` | `.' }
        note_text: { type: string, description: "`note` in the request's language (flag messages and the system's parts translated; the AI's reason and the file's remark as they are). A run classified before this field: the Arabic." }

    OtherSheet:
      type: object
      required: [sheet, name, type, description]
      properties:
        sheet: { type: integer }
        name: { type: string }
        type: { type: string, enum: [adjustments, subsidiary_ledger, notes, other] }
        description: { type: string }

    Adjustment:
      type: object
      description: One line of an adjustments sheet.
      required: [sheet, row, account_name, debit, credit, account_number, account_row]
      properties:
        sheet: { type: string, description: Sheet name. }
        row: { type: integer }
        account_name: { type: string }
        debit: { type: number }
        credit: { type: number }
        account_number: { type: [string, 'null'], description: As written on the line. }
        account_row: { type: [integer, 'null'], description: Trial-balance row it maps to; `null` = not in the trial balance. }

    ClassificationResult:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          description: Account rows only (parent, total, section and empty rows are excluded).
          items: { $ref: '#/components/schemas/ClassifiedAccount' }
        meta:
          type: object
          description: 'Results stored by older versions may lack `partial`, `unclassified`, `side_flips`, `provider`, `model`, `usage` (and rows lack `cache_key`).'
          required: [total, needs_review, avg_confidence, skipped_rows, groups, warnings, warnings_text, info, info_text, other_sheets, adjustments]
          properties:
            total: { type: integer, description: Rows in `data`. }
            needs_review: { type: integer }
            avg_confidence: { type: number, description: 'Average `classification_confidence`, 1 decimal.' }
            skipped_rows: { type: integer, description: 'Data rows not returned (parent, total, section, other, empty unlabelled).' }
            partial: { type: boolean, description: '`true` when some account rows came back unclassified — not a complete result.' }
            unclassified:
              type: object
              required: [rows, ranges, failed_batches, missed_by_ai]
              properties:
                rows: { type: integer }
                ranges: { type: array, items: { type: string }, example: ['R104–R153'] }
                failed_batches: { type: integer, description: Rows whose batch still failed after retries. }
                missed_by_ai: { type: integer, description: Rows the AI left out even after the missing-only retry. }
            groups:
              type: array
              description: Amount groups present in the file.
              items: { type: string, enum: [opening, period, adjustment, closing] }
            warnings:
              type: array
              description: Imbalance on a full trial balance, total-row mismatch, unmatched differences, remarks on skipped rows, remaining structure doubts.
              items: { type: string }
            info:
              type: array
              description: E.g. partial trial balance, where the imbalance is expected.
              items: { type: string }
            warnings_text:
              type: array
              description: "`warnings` in the request's language, same order (a run classified before this field: the Arabic)."
              items: { type: string }
            info_text:
              type: array
              description: "`info` in the request's language, same order."
              items: { type: string }
            edited: { type: boolean, description: 'Rows were added, edited or removed by hand after the classification. Absent: never.' }
            balance:
              type: object
              description: 'Debit − credit of the accounts per group (`opening`, `period`, `adjustment`, `closing`, the groups the file has; parents left out), redone after a row is added, edited or removed. All zero: the trial balance balances. Absent from a run classified before it was added.'
              additionalProperties: { type: number }
            removed_rows:
              type: array
              description: Rows removed by hand, as they were.
              items: { type: object, required: [row, account_number, account_name], properties: { row: { type: integer }, account_number: { type: string }, account_name: { type: string } } }
            code_group_proposals:
              type: array
              description: 'Code groups worth marking as one kind of account (the classification rules page): at least 3 balance-sheet accounts no rule catches, sharing their number less its last two digits, most of them in one rule''s AI classes. Proposed only; the user marks the group for the run''s company.'
              items:
                type: object
                required: [prefix, rule_id, rule, rows, share]
                properties:
                  prefix: { type: string }
                  rule_id: { type: integer }
                  rule: { type: string }
                  rows: { type: array, items: { type: integer } }
                  share: { type: number }
            side_flips:
              type: array
              description: Per side pair (config `side_pairs`), rows whose cached sub-class was re-decided by the balance side.
              items:
                type: object
                required: [pair, label, rows, flagged, contradictions]
                properties:
                  pair: { type: string }
                  label: { type: string }
                  rows: { type: integer, description: Rows flipped. }
                  flagged: { type: boolean, description: Flipped rows are flagged for review. }
                  contradictions: { type: integer, description: 'Rows whose side contradicts a class the pair may not flip (kept, flagged).' }
            other_sheets:
              type: array
              items: { $ref: '#/components/schemas/OtherSheet' }
            adjustments:
              type: array
              items: { $ref: '#/components/schemas/Adjustment' }
            provider: { type: [string, 'null'], description: AI provider that produced the result., example: anthropic }
            model: { type: [string, 'null'], description: AI model that produced the result., example: claude-haiku-4-5 }
            usage:
              type: [object, 'null']
              description: Tokens of every successful AI response for this file. A run that paused for confirmation includes its detection calls.
              required: [requests, input, cache_write, cached, output]
              properties:
                requests: { type: integer }
                input: { type: integer, description: Uncached input (cache writes and reads excluded). }
                cache_write: { type: integer, description: Input written to the prompt cache (Anthropic only). }
                cached: { type: integer, description: Input read from the prompt cache. }
                output: { type: integer, description: 'Output tokens, thinking/reasoning included.' }

