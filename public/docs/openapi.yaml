openapi: 3.1.0
info:
  title: Trial Balance Classifier API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: |
    Classifies every account in an uploaded trial balance (any layout: `.xlsx`, `.xls`, `.csv`) into
    **financial statement → main class → sub class**, using an AI provider for structure detection and classification
    (Anthropic, Gemini or OpenAI — config `classification.provider`, env `CLASSIFIER_PROVIDER`), and PHP for all amounts
    and data checks.

    All endpoints are under **`/api/v1`** (old `/api/...` paths return 404). The Swagger UI page stays at `/api/docs`.

    Validation messages (422) are English by default; with `Accept-Language: ar` they are Arabic, each naming its field.
    Messages are not part of the contract: match on the `errors` keys.

    ## How to classify a trial balance

    **1. Upload the file**
    ```bash
    curl -X POST http://127.0.0.1:8001/api/v1/classify/jobs \
      -H "Accept: application/json" -H "Authorization: Bearer $API_KEY" -F "file=@trial-balance.xlsx"
    ```
    → **202** with `id` and `status_url`. (Needs `php artisan queue:work` running.)

    **Errors, for every endpoint:** validation errors are `422 {message, errors: {field: [..]}}` and run *before* the record
    lookup (an invalid body on an unknown id gives 422, not 404). A path that matches no route — including a non-numeric
    id on `/entries/{id}`, `/imports/{id}…`, `/imports/mappings/{mappingId}`, `/jobs/{id}/rows/{row}` — gives
    `404 {"status": "error", "message": "Route not found"}` (`RouteNotFound`), not the endpoint's own 404 body.
    Unexpected errors: `500 {"status": "error", "message": …}`. Request fields not listed here are ignored.
    Responses are checked against this spec by `tests/Feature/ApiContractTest.php` (every endpoint, every documented status).
    A response field listed in its schema's `required` is always present (a nullable one as `null`); any other field may be absent.

    **2. Poll `GET /api/v1/classify/jobs/{id}` every 2 s** (as the upload page does) and act on `status`:

    | `status` | Do |
    |---|---|
    | `queued`, `running` | Keep polling. Show `stage` and `progress.done / progress.total`. |
    | `done` | Read `result` — finished (step 4). |
    | `needs_confirmation` | The AI isn't sure which column holds what — go to step 3. |
    | `failed`, `expired` | Show `error`; upload again. |
    | `cancelled` | Stop. |

    **3. Confirm the columns (only if `needs_confirmation`)**
    Show the user `confirmation.issues[].user`, the sheet preview (`confirmation.columns`, `confirmation.rows`) and
    the detected mapping (`confirmation.structure`), labelled with `confirmation.fields`. Send back the approved or
    corrected mapping:
    ```bash
    curl -X POST http://127.0.0.1:8001/api/v1/classify/jobs/{id}/structure \
      -H "Content-Type: application/json" -H "Accept: application/json" -H "Authorization: Bearer $API_KEY" \
      -d '{"header_rows":[1],"first_data_row":2,"columns":{"account_number":"A","account_name":"B","closing_debit":"G","closing_credit":"H"}}'
    ```
    - **202** → back to `queued`; return to step 2.
    - **422** with `needs_acknowledgement: true` → show `doubts`; if the user accepts, resend with `"acknowledge_doubts": true`.
    - **422** with `problems` → the mapping is still wrong; show `problems` and let the user fix it.
    - The user gives up → `POST /api/v1/classify/jobs/{id}/cancel`.

    **4. Use the result**
    - `result.data[]`: one row per account — `financial_statement`, `main_class`, `sub_class`, the amounts,
      `classification_confidence` and `classification_reason`.
    - Review first the rows with `needs_review: true`; `note` explains why (low confidence, `data_flags`, file remark).
    - `result.meta`: totals, `warnings` / `info` to show, and `partial: true` if some rows could not be classified
      (`meta.unclassified.ranges` says which).

    **Small file, one call:** `POST /api/v1/classify/trial-balance` with the same `file` returns the `result`
    body directly (no polling, no confirmation step; may time out on large files).

    ## Two ways to classify
    | Flow | Endpoint | When |
    |---|---|---|
    | **Synchronous** | `POST /api/v1/classify/trial-balance` | Small files. Request may hit the 300 s limit on large ones. |
    | **Background job** | `POST /api/v1/classify/jobs` → poll `GET /api/v1/classify/jobs/{id}` | Any size. Requires `php artisan queue:work`. |

    ## Job lifecycle
    ```
    queued → running → done | failed
    queued → running → needs_confirmation → (confirm) queued → running → done
    any waiting run → cancelled | expired
    ```
    - `stage` while running: `reading` → `structure` → `classifying` → `checks`. During `classifying`, `progress` counts AI batches
      (the counts are kept after it). `needs_confirmation` keeps `structure`; `failed` keeps the last stage (null when the queue or the stalled-run sweep failed it); `done`,
      `cancelled`, `expired` and a confirmed (re-`queued`) run have `null`.
    - A run pauses at `needs_confirmation` when the detected column mapping still has an error after the AI retry,
      or a doubt listed in `classification.structure_checks.pause_on`. Confirm or correct it with
      `POST /api/v1/classify/jobs/{id}/structure` within `classification.confirmation_hours` (24 h), or it expires.
    - The uploaded file and the column preview are deleted as soon as the run ends, is confirmed, cancelled or expires.

    ## Conventions
    - **Sign-in required.** Every endpoint needs an active account and its permission (`config/permissions.php`; the
      role a user has, set by the administrator). The app's pages use their session cookie (with the `X-XSRF-TOKEN`
      header on changes). Any other client sends an API key made on the account page (`/account`, needs the
      `api_tokens.manage` permission): `Authorization: Bearer <key>`; it has its account's permissions.
      No or a wrong key: `401 {"message": "Unauthenticated."}`. A permission the role lacks, or a pending or disabled
      account: `403 {"message": …}`. These two apply to every endpoint and are not repeated under each one.
    - Errors on `/api/*` (so `/api/v1/*`) are always JSON, even without an `Accept` header.
    - Arabic text in raw responses is `\uXXXX`-escaped (Laravel default JSON encoding).
    - Amounts are read from the file cells, never from AI output.
security:
  - apiKey: []
  - session: []
servers:
  - url: /
    description: The host serving this page (Swagger UI at `/api/docs`). Paths include the `/api/v1` prefix.
  - url: http://127.0.0.1:8001
    description: Local (`SERVER_PORT` in `.env`).
tags:
  - name: Jobs
    description: Background classification — submit, poll, confirm the column mapping, cancel.
  - name: Synchronous
    description: Classify in the request itself (small files).
  - name: Classification cache
    description: Rows seen before are classified from the DB instead of the AI. Read-only explanation, entries, removal, manual corrections. No auth yet.
  - name: Classification imports
    description: Accountant-labelled trial balances into the cache — upload (queued read + mapping), review the mappings, apply the approved ones. No auth yet — must be protected before deployment.
  - name: Cache transfer
    description: Export the cache (Excel, JSON) and import a JSON export on another instance. No auth yet — must be protected before deployment.
  - name: Companies
    description: Company profiles for the financial statements, reused across years. Saudi LLC under IFRS for SMEs, in SAR, only for now. No auth yet — must be protected before deployment.
  - name: Client follow-up
    description: A client's missing documents followed up by email. The AI finds what is missing and writes the email; the accountant reads and sends it from their own mailbox; the reply (by email, read from the mailbox, or entered here) is read by the AI, its files filed in the requests. Needs `clients.view` / `clients.manage`.
  - name: Working papers
    description: The working papers and recalculations the AI prepares from a client's documents and trial balance (neither the accountant nor the client fills them). Needs `clients.view` / `clients.manage`.
  - name: Audit findings
    description: The audit findings of a client's year (ملاحظات المراجعة) - the client's documents and the recalculations matched with the trial balance, the suggested entries, and the accountant's word on each. Needs `clients.view` / `clients.manage`.
  - name: Mailbox
    description: The signed-in accountant's own mailbox (SMTP + an app password; IMAP for the replies). The password is written, never read back. Needs `clients.manage`.
  - name: Financial reports
    description: Financial statements built from a finished classification run. All amounts come from the run, the user or a computation in PHP; no AI. No auth yet — must be protected before deployment.

paths:
  /api/v1/classify/jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: List runs, newest first
      description: |
        Runs without their results (PR 13a): to pick a finished trial balance for a report or for its prior year
        (`?status=done`). No auth yet — must be protected before deployment.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [queued, running, needs_confirmation, done, failed, cancelled, expired] } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
      responses:
        '200':
          description: Laravel paginator; page with `?page=` until `next_page_url` is null.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          required: [id, status, original_name, rows, created_at, updated_at, status_url]
                          properties:
                            id: { type: string, format: uuid }
                            status: { type: string, enum: [queued, running, needs_confirmation, done, failed, cancelled, expired] }
                            original_name: { type: string }
                            company_id: { type: [string, 'null'], format: uuid, description: 'The company chosen at upload.' }
                            rows: { type: integer, description: 'Rows to classify (the run''s progress total).' }
                            created_at: { type: [string, 'null'], format: date-time }
                            updated_at: { type: [string, 'null'], format: date-time }
                            status_url: { type: string }
        '422': { description: 'Invalid filter.', content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }
    post:
      tags: [Jobs]
      operationId: submitJob
      summary: Submit a trial balance for background classification
      description: |
        Stores the file, queues a `ClassifyTrialBalance` job and returns **202** with the run status.
        Poll `status_url` until `status` is `done`, `failed`, `needs_confirmation`, `cancelled` or `expired`.
      requestBody:
        $ref: '#/components/requestBodies/TrialBalanceFile'
      responses:
        '402': { $ref: '#/components/responses/AiLimitReached' }
        '202':
          description: Accepted; the run is queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobStatus' }
              examples:
                queued: { $ref: '#/components/examples/JobQueued' }
        '422': { $ref: '#/components/responses/FileValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/classify/jobs/{id}:
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Get a run's status (poll)
      description: |
        Same shape at every stage. `result` is set only when `status` is `done`; `confirmation` only when
        `needs_confirmation`; `error` when `failed` or `expired`.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Current run status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobStatus' }
              examples:
                running: { $ref: '#/components/examples/JobRunning' }
                needs_confirmation: { $ref: '#/components/examples/JobNeedsConfirmation' }
                done: { $ref: '#/components/examples/JobDone' }
                failed: { $ref: '#/components/examples/JobFailed' }
        '404': { $ref: '#/components/responses/JobNotFound' }

  /api/v1/classify/jobs/{id}/structure:
    post:
      tags: [Jobs]
      operationId: confirmStructure
      summary: Confirm or correct the column mapping of a waiting run
      description: |
        Only for a run in `needs_confirmation`. The sheet and the other sheets stay as detected; send the header rows,
        first data row and field → column mapping (the detected one, or a corrected one).

        On success the run goes back to `queued` and continues from classification with this mapping; its remaining
        doubts become warnings in the result.

        **Two-step confirm:** if the mapping raises *pausing doubts the user wasn't shown*, or *measurement errors*
        (`amount_numeric`, `name_fill`, `name_text`, `side_values`, `header_contradiction`, `groups_swapped`,
        `sides_swapped`, `first_row_is_header`, `other_sheets`), the API answers **422** with
        `needs_acknowledgement: true`. Show `doubts` to the user and resend the same body with
        `"acknowledge_doubts": true`. Doubts already shown never ask again; measurement errors ask every time.
        Overridden errors come back in `result.meta.warnings` (a swap first, prefixed ⛔); an overridden
        `other_sheets` error leaves that extra sheet out.
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmStructureRequest' }
            examples:
              confirm:
                summary: Confirm a mapping
                value:
                  header_rows: [1]
                  first_data_row: 2
                  columns: { account_number: A, account_name: B, closing_debit: G, closing_credit: H }
              acknowledge:
                summary: Resend accepting new doubts
                value:
                  header_rows: [1]
                  first_data_row: 4
                  columns: { account_number: A, account_name: B, closing_debit: G, closing_credit: H }
                  acknowledge_doubts: true
              sharedCell:
                summary: Number and name in one cell ("1101 - الصندوق")
                value:
                  header_rows: [2]
                  first_data_row: 3
                  columns: { account_number: A, account_name: A, closing_net: D }
      responses:
        '402': { $ref: '#/components/responses/AiLimitReached' }
        '202':
          description: Accepted; `status` is `queued` again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobStatus' }
              examples:
                queued: { $ref: '#/components/examples/JobQueued' }
        '404': { $ref: '#/components/responses/JobNotFound' }
        '409':
          description: The run is not waiting for confirmation (already confirmed, cancelled, expired, file gone…).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
              example: { message: 'This run is not waiting for confirmation.' }
        '422':
          description: |
            One of three bodies; in the first two the run keeps waiting.
            - `problems`: an error the user must fix in the panel (missing field or column, one column for two fields,
              rows outside the sheet). `acknowledge_doubts` doesn't override it.
            - `needs_acknowledgement`: new pausing doubts or measurement errors — resend with `acknowledge_doubts: true`.
            - `errors`: invalid request body.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/MappingProblems'
                  - $ref: '#/components/schemas/DoubtsNeedAcknowledgement'
                  - $ref: '#/components/schemas/ValidationError'
              examples:
                problems:
                  summary: Mapping still has errors
                  value:
                    message: The mapping still has problems.
                    problems: ["العمود Z مش موجود في الشيت."]
                    problems_text: ["Column Z is not in the sheet."]
                doubts:
                  summary: New doubts need acknowledgement
                  value:
                    message: The mapping raises doubts or errors the user must accept. Send it again with acknowledge_doubts to accept them.
                    doubts: ["الصفوف R2، R3 قبل أول صف بيانات شكلها حسابات وهتتشال."]
                    doubts_text: ["Rows 2, 3 before the first data row look like accounts and will be dropped."]
                    needs_acknowledgement: true
                validation:
                  summary: Invalid body
                  value:
                    message: 'Unknown fields: foo.'
                    errors: { columns: ["Unknown fields: foo."] }

  /api/v1/classify/jobs/{id}/cancel:
    post:
      tags: [Jobs]
      operationId: cancelJob
      summary: Cancel a queued or waiting run
      description: |
        Cancels a run in `queued` or `needs_confirmation`. The file and the column preview are deleted at once.
        A run already processing or finished cannot be cancelled.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobStatus' }
              examples:
                cancelled: { $ref: '#/components/examples/JobCancelled' }
        '404': { $ref: '#/components/responses/JobNotFound' }
        '409':
          description: Already processing or finished.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
              example: { message: 'This run is already processing or finished and cannot be cancelled.' }

  /api/v1/classify/jobs/{id}/rows/{row}:
    patch:
      tags: [Classification cache]
      operationId: correctRow
      summary: Manually correct one row of a finished run
      description: |
        Sets the row's sub-class (main class and statement come from the taxonomy), confidence 100, and saves it to the
        classification cache as `manual_correction`, which overrides any AI answer for that key from then on.
        The entry also stores the row's balance side (closing, else opening, else period); choosing the side-pair member
        opposite to that side (config `side_pairs`) locks it (`side_locked`), so later rows never flip it by their own side.
        An unlocked correction of a side-pair class is stored as the pair's base class (`side_pairs.*.base`); the lookup
        re-decides it by each row's side.
        The row's `data_flags` are not recomputed (they are on the next upload).
      parameters:
        - $ref: '#/components/parameters/JobId'
        - { name: row, in: path, required: true, schema: { type: integer }, description: "The row's `row` (Excel row)." }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sub_class]
              properties:
                sub_class: { type: string, description: 'A sub-class from the taxonomy.' }
      responses:
        '200':
          description: Corrected. `cache_entry` is null (with a `message`) when the row has no cache key.
          content:
            application/json:
              schema:
                type: object
                required: [row, cache_entry, message]
                properties:
                  row: { $ref: '#/components/schemas/ClassifiedAccount' }
                  cache_entry: { oneOf: [{ $ref: '#/components/schemas/CacheEntry' }, { type: 'null' }] }
                  message: { type: [string, 'null'] }
        '404':
          description: 'Run not found (`{message}`), or the row is not in the run (`{message, rows: [row]}`).'
          content:
            application/json:
              schema: { type: object, required: [message], properties: { message: { type: string }, rows: { type: array, items: { type: integer } } } }
              example: { message: 'Row not found in this run.', rows: [99] }
        '409': { description: 'The run is not `done`.', content: { application/json: { schema: { $ref: '#/components/schemas/Message' }, example: { message: 'Only a finished run can be corrected.' } } } }
        '422': { description: 'Missing or unknown `sub_class`.', content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }
    delete:
      tags: [Jobs]
      operationId: removeRunRow
      summary: Remove a row from a finished run
      description: The row leaves the result (kept in `meta.removed_rows`); the run's totals are redone. A report built on the run sees it changed.
      parameters:
        - $ref: '#/components/parameters/JobId'
        - { name: row, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: The removed row and the run's totals., content: { application/json: { schema: { $ref: '#/components/schemas/RowChange' } } } }
        '404': { description: Run or row not found., content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '409': { description: 'The run is not `done`.', content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }

  /api/v1/classify/jobs/{id}/rows:
    post:
      tags: [Jobs]
      operationId: addRunRow
      summary: Add an account to a finished run by hand
      description: The new row comes after the last one (`added`). Amounts per group (missing = 0); a `sub_class` given is kept as a manual correction (not sent to the memory; a class saved later through the corrections is). The run's totals are redone; `meta.balance` says how far the trial balance is off after the change.
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RowValues' }
            example: { account_number: '1199', account_name: 'عهدة جديدة', closing_debit: 500, period_debit: 500, sub_class: 'عُهد وسُلف العاملين' }
      responses:
        '201': { description: The row and the run's totals., content: { application/json: { schema: { $ref: '#/components/schemas/RowChange' } } } }
        '404': { description: Run not found., content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '409': { description: 'The run is not `done`.', content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '422': { description: 'Missing name, a negative amount or an unknown `sub_class`.', content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }

  /api/v1/classify/jobs/{id}/rows/{row}/values:
    put:
      tags: [Jobs]
      operationId: editRunRow
      summary: Edit a row's number, name or amounts by hand
      description: Only the fields sent change (`edited`). A new number or name gives the row a new memory key, so a class saved later is remembered under it. The run's totals are redone.
      parameters:
        - $ref: '#/components/parameters/JobId'
        - { name: row, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RowValues' }
      responses:
        '200': { description: The row and the run's totals., content: { application/json: { schema: { $ref: '#/components/schemas/RowChange' } } } }
        '404': { description: Run or row not found., content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '409': { description: 'The run is not `done`.', content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '422': { description: A negative or non-numeric amount., content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }

  /api/v1/classify/jobs/{id}/corrections:
    post:
      tags: [Classification cache]
      operationId: correctRows
      summary: Manually correct several rows of a finished run at once (all or nothing)
      description: |
        The classifier page's «حفظ التعديلات». Each row is corrected exactly like `PATCH …/rows/{row}` (sub-class from the
        taxonomy, confidence 100, `manual_correction` saved to the cache, side lock and base class rules), in one transaction:
        if one row is not in the run, nothing is saved. Rows without a cache key (no name, or a generic name whose parent
        is unknown) are corrected in this run only and listed in `not_remembered`.
        Edits the page has not saved are not sent: they exist only on the page and in its CSV download.
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [corrections]
              properties:
                corrections:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items:
                    type: object
                    required: [row, sub_class]
                    properties:
                      row: { type: integer, description: "The row's `row` (Excel row); each row at most once." }
                      sub_class: { type: string, description: 'A sub-class from the taxonomy.' }
            example: { corrections: [{ row: 4, sub_class: 'نقدية لدى البنوك' }, { row: 3, sub_class: 'إيجارات' }] }   # «إيجارات» is a sub class of «المصروفات الإدارية والعمومية»
      responses:
        '200':
          description: Corrected.
          content:
            application/json:
              schema:
                type: object
                required: [rows, corrected, remembered, not_remembered]
                properties:
                  rows: { type: array, items: { $ref: '#/components/schemas/ClassifiedAccount' }, description: 'The corrected rows, in request order.' }
                  corrected: { type: integer }
                  remembered: { type: integer, description: 'Rows saved to the cache (come back with this class in later files).' }
                  not_remembered: { type: array, items: { type: integer }, description: 'Rows with no cache key: corrected in this run only.' }
        '404': { description: 'Run not found, or rows not in the run (`rows` lists them; nothing saved).', content: { application/json: { schema: { type: object, required: [message], properties: { message: { type: string }, rows: { type: array, items: { type: integer } } } }, example: { message: 'Row not found in this run.', rows: [99] } } } }
        '409': { description: 'The run is not `done`.', content: { application/json: { schema: { $ref: '#/components/schemas/Message' }, example: { message: 'Only a finished run can be corrected.' } } } }
        '422': { description: 'Missing / empty `corrections`, a repeated `row`, or an unknown `sub_class`.', content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }

  /api/v1/classification-cache/explain:
    get:
      tags: [Classification cache]
      operationId: explainCache
      summary: How the cache works, in Arabic for the accountant
      description: |
        Built from the code and config — lookup steps, normalization rules with examples, key fields, stored fields, thresholds, what is never cached.
        `steps[].source`, in lookup order: `manual_correction`, `ai`, `imported`, `imported_code` (an `imported` entry found by
        code + name alone, without the budget item, only when all usable ones with that `base_hash` agree on one sub-class),
        `imported_name` (name layer), `llm`. `stored_fields` lists every column of the cache table (incl. `base_hash`, `side`,
        `side_locked`) with its Arabic description.
      responses:
        '200':
          description: Explanation.
          content:
            application/json:
              schema:
                type: object
                required: [enabled, steps, after_lookup, normalization_rules, normalization_example, key, stored_fields, thresholds, not_cached]
                properties:
                  enabled: { type: boolean }
                  steps: { type: array, items: { type: object, required: [order, source, title, description], properties: { order: { type: integer }, source: { type: string, enum: [manual_correction, ai, imported, imported_code, imported_name, llm] }, title: { type: string }, description: { type: string } } } }
                  after_lookup: { type: string }
                  normalization_rules: { type: array, items: { type: object, required: [rule, description, before, after], properties: { rule: { type: string }, description: { type: string }, before: { type: string }, after: { type: string } } } }
                  normalization_example: { type: object, required: [before, after], properties: { before: { type: string }, after: { type: string } } }
                  key: { type: object, required: [fields, why, examples], properties: { fields: { type: array, items: { type: object } }, why: { type: string }, examples: { type: array, items: { type: object } } } }
                  stored_fields: { type: array, items: { type: object, required: [field, description], properties: { field: { type: string, example: base_hash }, description: { type: [string, 'null'] } } } }
                  thresholds: { type: object, required: [cache_min_confidence, review_threshold, taxonomy_version, description], properties: { cache_min_confidence: { type: integer }, review_threshold: { type: integer }, taxonomy_version: { type: string }, description: { type: string } } }
                  not_cached: { type: array, items: { type: string } }

  /api/v1/classification-cache/entries:
    get:
      tags: [Classification cache]
      operationId: listCacheEntries
      summary: Paginated cache entries, most recently changed first
      parameters:
        - { name: source, in: query, schema: { type: string, enum: [ai, manual_correction, imported] } }
        - { name: q, in: query, schema: { type: string, maxLength: 200 }, description: 'Search in name, key and account code.' }
        - { name: sub_class, in: query, schema: { type: string, maxLength: 100 }, description: 'Only entries stored with this sub-class.' }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
      responses:
        '200':
          description: Laravel paginator; page with `?page=` until `next_page_url` is null.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    required: [data]
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/CacheEntry' } }
        '422': { description: 'Invalid filter.', content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }
    post:
      tags: [Classification cache]
      operationId: addCacheEntry
      summary: Add an account by hand (a manual correction)
      description: Later files with the same code, name and budget item get its class. With neither code nor budget item the name is generic and `parent` (the parent account's name; none = no parent) is part of the key. An account already stored is replaced. Needs `cache.review`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_name, sub_class]
              properties:
                account_code: { type: [string, 'null'], maxLength: 100 }
                account_name: { type: string, maxLength: 255 }
                budget_item: { type: [string, 'null'], maxLength: 255 }
                parent: { type: [string, 'null'], maxLength: 255 }
                sub_class: { type: string, description: 'A sub-class of the taxonomy.' }
      responses:
        '201':
          description: The entry as stored.
          content:
            application/json:
              schema:
                type: object
                required: [data, replaced]
                properties:
                  data: { $ref: '#/components/schemas/CacheEntry' }
                  replaced: { type: boolean, description: 'The account was stored already and is replaced.' }
        '422': { description: 'Missing name or unknown sub-class.', content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }

  /api/v1/classification-cache/entries/{id}:
    delete:
      tags: [Classification cache]
      operationId: deleteCacheEntry
      summary: Remove a wrong entry (AI answer or manual correction)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: 'Removed; the row goes back to the AI next time.' }
        '404': { description: 'Entry not found.', content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }

  /api/v1/classification-cache/entries/reclassify:
    post:
      tags: [Classification cache]
      operationId: reclassifyCacheEntries
      summary: Give entries one sub-class by hand (manual corrections from now on)
      description: Each entry becomes a manual correction (confidence 100) that wins over the AI. A side-pair member is stored as the account's kind; each run's balance decides the side. Needs `cache.review`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, sub_class]
              properties:
                ids: { type: array, minItems: 1, maxItems: 500, items: { type: integer } }
                sub_class: { type: string, description: 'A sub-class of the taxonomy.' }
      responses:
        '200':
          description: The entries as stored.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/CacheEntry' } } } }
        '404':
          description: Entries not found (`ids` lists them); nothing changed.
          content:
            application/json:
              schema: { type: object, required: [message, ids], properties: { message: { type: string }, ids: { type: array, items: { type: integer } } } }
        '422': { description: 'Invalid ids or sub-class.', content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }

  /api/v1/classification-cache/entries/delete:
    post:
      tags: [Classification cache]
      operationId: deleteCacheEntries
      summary: Remove several wrong entries at once
      description: Their rows go back to the AI next time. Ids not found are ignored. Needs `cache.delete`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties: { ids: { type: array, minItems: 1, maxItems: 500, items: { type: integer } } }
      responses:
        '200':
          description: How many were removed.
          content:
            application/json:
              schema: { type: object, required: [deleted], properties: { deleted: { type: integer } } }
        '422': { description: 'Invalid ids.', content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }

  /api/v1/classification-cache/imports:
    get:
      tags: [Classification imports]
      operationId: listImports
      summary: Previous uploads of accountant-labelled trial balances, newest first
      description: The last 100 file imports (JSON-export imports are not listed). No auth yet — must be protected before deployment.
      responses:
        '200':
          description: Import summaries.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ImportSummary' } }

  /api/v1/classification-cache/import:
    post:
      tags: [Classification imports]
      operationId: submitImport
      summary: Upload an accountant-labelled trial balance (queued read + mapping)
      description: |
        Checks the header of the first sheet at once (needs «اسم الحساب» and «الميزانية» in the first 60 rows), then queues
        the read and the mapping of every distinct الميزانية / الإيضاحات value: **202** with `status_url` to poll.
        Nothing is written to the cache until `apply`. Needs `php artisan queue:work`.
        No auth yet — must be protected before deployment.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: '`xlsx`, `xls` or `csv`, ≤ 20 MB.' }
                force: { type: boolean, description: 'Upload again a file already imported (same SHA-256, import not failed).' }
      responses:
        '402': { $ref: '#/components/responses/AiLimitReached' }
        '202':
          description: Queued. `warnings` lists recommended columns that are missing (Arabic); `warnings_text` the same in the request's language.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ImportSummary'
                  - type: object
                    required: [warnings, warnings_text]
                    properties:
                      warnings: { type: array, items: { type: string } }
                      warnings_text: { type: array, items: { type: string }, description: "`warnings` in the request's language." }
        '409':
          description: The same file was uploaded before; resend with `force=1` to import it again.
          content:
            application/json:
              schema:
                type: object
                required: [message, duplicate_of]
                properties:
                  message: { type: string }
                  duplicate_of: { $ref: '#/components/schemas/ImportSummary' }
        '422':
          description: Invalid upload, unreadable file, or required columns missing (Arabic messages in `errors.file`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }

  /api/v1/classification-cache/imports/{id}:
    get:
      tags: [Classification imports]
      operationId: getImport
      summary: An import's status (poll) and report
      description: No auth yet — must be protected before deployment.
      parameters:
        - $ref: '#/components/parameters/ImportId'
      responses:
        '200':
          description: Summary plus `report` (null until read and mapped).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ImportSummary'
                  - type: object
                    required: [report]
                    properties:
                      report:
                        description: '`ImportReport` for an uploaded file (kind `file`); the transfer report for the import created by `POST …/import-export` (kind `export`: mappings only, no rows, `rows` null); null until read and mapped.'
                        oneOf:
                          - $ref: '#/components/schemas/ImportReport'
                          - $ref: '#/components/schemas/ExportImportReport'
                          - { type: 'null' }
        '404': { $ref: '#/components/responses/ImportNotFound' }

  /api/v1/classification-cache/imports/{id}/mappings:
    get:
      tags: [Classification imports]
      operationId: listImportMappings
      summary: The import's mappings to review, most rows first
      description: Only mappings with rows. No auth yet — must be protected before deployment.
      parameters:
        - $ref: '#/components/parameters/ImportId'
        - { name: kind, in: query, schema: { type: string, enum: [budget, note] } }
        - { name: decision, in: query, schema: { type: string, enum: [map, route, skip] } }
        - { name: flagged, in: query, schema: { type: boolean }, description: 'Only mappings with a `flag`.' }
        - { name: unreviewed, in: query, schema: { type: boolean } }
        - { name: low, in: query, schema: { type: boolean }, description: 'Only confidence below the cache cutoff.' }
        - { name: q, in: query, schema: { type: string, maxLength: 200 }, description: 'Search in `value`.' }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
      responses:
        '200':
          description: Laravel paginator; page with `?page=` until `next_page_url` is null.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    required: [data]
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/ImportMapping' } }
        '404': { $ref: '#/components/responses/ImportNotFound' }
        '422': { description: 'Invalid filter.', content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }

  /api/v1/classification-cache/imports/mappings/{mappingId}:
    patch:
      tags: [Classification imports]
      operationId: reviewImportMapping
      summary: The accountant's decision on one mapping
      description: |
        Marks the mapping reviewed (confidence 100); with `decision` also changes it (`method` becomes `manual`). The import's
        rows and report are rebuilt. Budget: `map` needs `main_class` (`sub_class` optional, within it). Note: `map` needs
        `sub_class` (under a `function` policy: a sub-class of the policy's main class, stored as `function_sub_class`).
        `{}` approves it as is. No auth yet — must be protected before deployment.
      parameters:
        - { name: mappingId, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                decision: { type: string, enum: [map, route, skip], description: '`route` for budget mappings only.' }
                main_class: { type: string, description: 'Budget only: a main class from the taxonomy.' }
                sub_class: { type: string }
      responses:
        '200':
          description: Updated mapping and the rebuilt report.
          content:
            application/json:
              schema:
                type: object
                required: [mapping, report]
                properties:
                  mapping: { $ref: '#/components/schemas/ImportMappingFields' }
                  report: { $ref: '#/components/schemas/ImportReport' }
        '404': { description: 'Mapping not found.', content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '409': { $ref: '#/components/responses/ImportNotReviewable' }
        '422': { description: 'Invalid decision or class.', content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }

  /api/v1/classification-cache/imports/{id}/mappings/approve:
    post:
      tags: [Classification imports]
      operationId: approveImportMappings
      summary: Approve several mappings as they are (picked ids, or all matching the filters)
      description: |
        Either `ids` (the ones picked on the page; ids not in this import are ignored), or `all: true` to approve every
        **not-yet-reviewed** mapping (with rows) matching the same filters as `GET …/mappings` (`kind`, `decision`, `q`,
        `flagged`, `low`), on every page — the review page's «اعتماد الكل». Approving as is sets confidence 100.
        No auth yet — must be protected before deployment.
      parameters:
        - $ref: '#/components/parameters/ImportId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: '`ids` (at least one) is required unless `all` is true.'
              properties:
                ids: { type: array, minItems: 1, maxItems: 1000, items: { type: integer } }
                all: { type: boolean, default: false, description: 'true = every unreviewed mapping matching the filters below (ids ignored); false or absent = use ids.' }
                kind: { type: string, enum: [budget, note], description: 'With all: the tab.' }
                decision: { type: string, enum: [map, route, skip], description: 'With all.' }
                q: { type: string, maxLength: 200, description: 'With all: search in the value.' }
                flagged: { type: boolean, description: 'With all: only mappings with a flag.' }
                low: { type: boolean, description: 'With all: only confidence below the cache minimum.' }
              example: { all: true, kind: budget, q: 'ذمم' }
      responses:
        '200':
          description: Approved count and the rebuilt report.
          content:
            application/json:
              schema:
                type: object
                required: [approved, report]
                properties:
                  approved: { type: integer, description: 'Mappings approved by this call (0 when none matched).' }
                  report: { $ref: '#/components/schemas/ImportReport' }
        '404': { $ref: '#/components/responses/ImportNotFound' }
        '409': { $ref: '#/components/responses/ImportNotReviewable' }
        '422': { description: 'Neither `ids` nor `all`, or an invalid `ids` / filter value.', content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }

  /api/v1/classification-cache/imports/{id}/apply:
    post:
      tags: [Classification imports]
      operationId: applyImport
      summary: Write the approved rows to the cache («تطبيق»)
      description: |
        Writes the rows whose mappings are all approved as `imported` entries (confidence 100, with `base_hash`), never over
        a manual correction or an AI answer, and rebuilds the name layer. A side-pair class is stored as the pair's base class
        (config `side_pairs.*.base`), so rows of one key on both sides of a pair are not a key conflict. Can run again as
        more get approved; this import's entries no approved row produces any more are removed. Status becomes `applied`.
        No auth yet — must be protected before deployment.
      parameters:
        - $ref: '#/components/parameters/ImportId'
      responses:
        '200':
          description: What was written, and the rebuilt report.
          content:
            application/json:
              schema:
                type: object
                required: [applied, report]
                properties:
                  applied:
                    type: object
                    required: [cache_entries, key_conflicts, kept_existing, pending_review, name_layer]
                    properties:
                      cache_entries: { type: integer, description: Entries written. }
                      key_conflicts: { type: integer, description: 'Rows whose key got two sub-classes (compared as base classes) in the import (not written).' }
                      kept_existing: { type: integer, description: 'Rows whose key the cache holds from a manual correction or the AI.' }
                      pending_review: { type: integer, description: 'Mapped rows not approved yet.' }
                      name_layer: { type: integer, description: 'Name-layer entries rebuilt from rows.' }
                  report: { $ref: '#/components/schemas/ImportReport' }
        '404': { $ref: '#/components/responses/ImportNotFound' }
        '409':
          description: Still reading / mapping, or failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }

  /api/v1/classification-cache/export.xlsx:
    get:
      tags: [Cache transfer]
      operationId: exportCacheXlsx
      summary: Excel export of the cache for the accountant
      description: |
        Sheet «ذاكرة التصنيف» (account entries) and sheet «طبقة الأسماء» (the name layer, not filtered).
        No auth yet — must be protected before deployment (reads the whole cache).
      parameters:
        - $ref: '#/components/parameters/ExportSource'
        - $ref: '#/components/parameters/ExportFrom'
        - $ref: '#/components/parameters/ExportTo'
      responses:
        '200':
          description: '`classification-cache-YYYY-MM-DD.xlsx` download.'
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '422': { description: 'Invalid filter.', content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }

  /api/v1/classification-cache/export.json:
    get:
      tags: [Cache transfer]
      operationId: exportCacheJson
      summary: JSON export of everything, to move the cache to another instance
      description: |
        Entries (filtered), the الميزانية / الإيضاحات mappings (one per value across imports, approved first) and the name layer.
        No auth yet — must be protected before deployment (reads the whole cache).
      parameters:
        - $ref: '#/components/parameters/ExportSource'
        - $ref: '#/components/parameters/ExportFrom'
        - $ref: '#/components/parameters/ExportTo'
      responses:
        '200':
          description: '`classification-cache-YYYY-MM-DD.json` download.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CacheExport' }
        '422': { description: 'Invalid filter.', content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }

  /api/v1/classification-cache/import-export:
    post:
      tags: [Cache transfer]
      operationId: importCacheJson
      summary: Import a JSON export (no AI)
      description: |
        In one transaction. Entries: an existing manual correction is never replaced; otherwise the higher source wins
        (`manual_correction` > `ai` > `imported`), same source → the newer one. Entries with a sub-class unknown here are
        skipped. A `side_locked` entry is kept as is; an unlocked one (or one from an older export without `side_locked`)
        is stored as the side pair's base class. `base_hash` and `main_class` are recomputed here. Mappings are stored as an `export` import (reused by later uploads). Name-layer entries are added only where
        this instance has none for the name and side.
        No auth yet — must be protected before deployment (writes the whole cache).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 'A `GET /api/v1/classification-cache/export.json` file, ≤ 50 MB.' }
      responses:
        '200':
          description: Import report.
          content:
            application/json:
              schema:
                type: object
                required: [entries, budget_mappings, note_mappings, import_id, name_layer, taxonomy_version]
                properties:
                  entries:
                    type: object
                    required: [added, updated, kept_manual, kept_existing, skipped_unknown_sub_class, skipped_unknown_sub_class_count, skipped_invalid, ai_other_taxonomy_version]
                    properties:
                      added: { type: integer }
                      updated: { type: integer }
                      kept_manual: { type: integer }
                      kept_existing: { type: integer }
                      skipped_unknown_sub_class: { type: array, items: { type: object, required: [name, sub_class, source], properties: { name: { type: string }, sub_class: { type: string }, source: { type: string } } } }
                      skipped_unknown_sub_class_count: { type: integer }
                      skipped_invalid: { type: integer, description: 'Missing key, key hash mismatch, or unknown source.' }
                      ai_other_taxonomy_version: { type: integer, description: 'AI entries stored but ignored by the lookup until the taxonomy versions match.' }
                  budget_mappings: { $ref: '#/components/schemas/TransferMappingsReport' }
                  note_mappings: { $ref: '#/components/schemas/TransferMappingsReport' }
                  import_id: { type: integer, description: 'The `export` import holding the mappings.' }
                  name_layer:
                    type: object
                    required: [added, kept_existing, skipped_unknown_sub_class]
                    properties:
                      added: { type: integer }
                      kept_existing: { type: integer }
                      skipped_unknown_sub_class: { type: integer }
                  taxonomy_version:
                    type: object
                    required: [export, here]
                    properties:
                      export: { type: string }
                      here: { type: string }
        '422':
          description: 'Missing or > 50 MB file (`errors`), not valid JSON, not a cache export, or a newer `format_version` (`message`, Arabic).'
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Message'

  /api/v1/classify/trial-balance:
    post:
      tags: [Synchronous]
      operationId: classifyTrialBalance
      summary: Classify a trial balance in the request
      description: |
        Runs the whole pipeline in the request (time limit 300 s). Use the jobs endpoints for large files.
        Never pauses for confirmation: a mapping that still has errors after the AI retry returns **422** with `problems`.
      requestBody:
        $ref: '#/components/requestBodies/TrialBalanceFile'
      responses:
        '402': { $ref: '#/components/responses/AiLimitReached' }
        '200':
          description: Classified accounts and summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassificationResult' }
              examples:
                result: { $ref: '#/components/examples/ClassificationResult' }
        '422':
          description: |
            - `errors`: file validation (missing, wrong type, > 10 MB).
            - `problems` + `structure`: account columns could not be detected (AI answer failed the checks twice).
            - `message` only: no account rows found, or another unreadable-file error.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/StructureNotDetected'
                  - $ref: '#/components/schemas/Message'
              examples:
                validation:
                  summary: File validation
                  value: { message: 'The file field must be a file of type: xlsx, xls, csv.', errors: { file: ['The file field must be a file of type: xlsx, xls, csv.'] } }
                noRows:
                  summary: No account rows
                  value: { message: 'No account rows found in the file.' }
                structure:
                  summary: Columns not detected
                  value:
                    message: "ما قدرناش نقرا أعمدة الميزان صح:\n- مفيش عمود لاسم الحساب."
                    problems: ["مفيش عمود لاسم الحساب."]
                    problems_text: ["There is no account name column."]
                    structure: { sheet: 1, header_rows: [1], first_data_row: 2, columns: { account_name: null, closing_debit: G }, other_sheets: [] }
        '502': { $ref: '#/components/responses/ProviderError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/companies:
    get:
      tags: [Companies]
      operationId: listCompanies
      summary: Company profiles, most recently changed first
      description: No auth yet — must be protected before deployment.
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 }, description: 'Search in `name_ar`, `name_en`, `cr_number` and `unified_number`.' }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
      responses:
        '200':
          description: Laravel paginator; page with `?page=` until `next_page_url` is null.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    required: [data]
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Company' } }
        '422': { description: 'Invalid filter.', content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }
    post:
      tags: [Companies]
      operationId: createCompany
      summary: Create a company profile
      description: Fields left out take their defaults. No auth yet — must be protected before deployment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CompanyInput'
                - { type: object, required: [name_ar] }
            example: { name_ar: 'شركة المثال للتجارة', cr_number: '1010000000', cr_date_hijri: '1440/05/12هـ', city: 'الرياض', branches: ['جدة'] }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '422':
          description: 'Missing `name_ar`, a value out of scope (`legal_form`, `country`, `framework`, `currency`), a bad date, or a year-end day the month lacks.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }

  /api/v1/companies/{id}:
    get:
      tags: [Companies]
      operationId: getCompany
      summary: A company profile
      description: No auth yet — must be protected before deployment.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: The company.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '404': { $ref: '#/components/responses/CompanyNotFound' }
    patch:
      tags: [Companies]
      operationId: updateCompany
      summary: Change some fields of a company profile
      description: |
        Only the fields sent change. A changed `fiscal_year_end_month` is checked against the stored `fiscal_year_end_day`
        (and the reverse). No auth yet — must be protected before deployment.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyInput' }
            example: { name_en: 'Example Trading Co.', fiscal_year_end_month: 6, fiscal_year_end_day: 30 }
      responses:
        '200':
          description: The updated company.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '404': { $ref: '#/components/responses/CompanyNotFound' }
        '422':
          description: 'A value out of scope, `name_ar` null, a bad date, or a year-end day the month lacks.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }

  /api/v1/companies/{id}/registration:
    post:
      tags: [Companies]
      operationId: uploadCompanyRegistration
      summary: Upload the company's commercial registration (PDF or image) and read it
      description: |
        Read by the AI, which only copies: the number, name, activity, city, dates, the legal form as printed, and a sole
        proprietorship's owner. PHP places the legal form: a company (`llc`) or a sole proprietorship becomes the
        company's (`profile.legal_form_source: registration`); another form leaves it unknown. Empty facts are filled; a sole
        proprietorship's pending requests for the articles of association become not applicable. Also `client_file_id`: a file the
        client uploaded in the portal.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 'A PDF, JPG or PNG, up to 10 MB.' }
      responses:
        '402': { $ref: '#/components/responses/AiLimitReached' }
        '200':
          description: The company, plus `warning` (the registration's name differs from the company's, or null).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Company'
                  - type: object
                    required: [warning]
                    properties:
                      warning: { type: [string, 'null'], description: 'The registration names another company than this one (said, never refused).' }
        '404': { $ref: '#/components/responses/CompanyNotFound' }
        '422':
          description: Not a PDF or picture, too large (on `file`); not readable, not a registration, no ten-digit number, or another client's number (on `registration_file`).
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }
  /api/v1/companies/{id}/articles:
    post:
      tags: [Companies]
      operationId: uploadCompanyArticles
      summary: Upload the company's articles of association (PDF) and read its partners
      description: |
        The PDF is kept on the private disk and read by the AI, which only copies: the partners as listed, each with the
        nationality as printed, shares, share value and percentage. PHP then groups each nationality (`saudi`, `gulf`,
        `foreign`, `unknown`), works out each partner's ownership by shares and the Saudi and Gulf share of the capital
        (`zakat_share`, null when a nationality or a share is unclear). A second upload replaces the first; a provider failure answers 502 and keeps nothing. The capital note's
        partners and the zakat dialog's ownership share default to it where last year's statements and the accountant give none.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 'A PDF.' }
      responses:
        '402': { $ref: '#/components/responses/AiLimitReached' }
        '200':
          description: The company, with `articles`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '404': { $ref: '#/components/responses/CompanyNotFound' }
        '422':
          description: Not a PDF, or too large.
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }
    delete:
      tags: [Companies]
      operationId: deleteCompanyArticles
      summary: Forget the articles of association and what was read from them
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: The company, with `articles` null.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '404': { $ref: '#/components/responses/CompanyNotFound' }

  /api/v1/financial-reports:
    get:
      tags: [Financial reports]
      operationId: listFinancialReports
      summary: Reports, newest first
      description: Summaries only; read one report for its state. No auth yet — must be protected before deployment.
      parameters:
        - { name: company_id, in: query, schema: { type: string, format: uuid } }
        - { name: classification_run_id, in: query, schema: { type: string, format: uuid } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
      responses:
        '200':
          description: Laravel paginator; page with `?page=` until `next_page_url` is null.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    required: [data]
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/FinancialReportSummary' } }
        '422': { description: 'Invalid filter.', content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }
    post:
      tags: [Financial reports]
      operationId: createFinancialReport
      summary: Start a report from a finished classification run
      description: |
        Creates a draft report and returns its state, read from the run: the layout of the trial balance and how its rows
        map to statement lines. Drafts are always allowed, even with unclassified or unmapped rows; those block only a
        final version (a later step). `template_version` is the server's current one (`FS_TEMPLATE_VERSION`).
        The comparative period is set by the prior-year step (a later step). No auth yet — must be protected before deployment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classification_run_id, period_start, period_end]
              properties:
                classification_run_id: { type: string, format: uuid, description: 'A run of `POST /api/v1/classify/jobs`.' }
                company_id: { type: [string, 'null'], format: uuid }
                period_start: { type: string, format: date }
                period_end: { type: string, format: date, description: 'After `period_start`.' }
            example: { classification_run_id: 9d3c7a1e-5b2f-4c8e-a0d1-2f6b8e4c1a90, period_start: '2025-01-01', period_end: '2025-12-31' }
      responses:
        '201':
          description: Created; the report's state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinancialReportState' }
        '409':
          description: 'The run is not `done` (still queued or running, waiting for confirmation, failed, cancelled or expired). Arabic `message`.'
          content:
            application/json:
              schema:
                type: object
                required: [message, run_status]
                properties:
                  message: { type: string }
                  run_status: { type: string, enum: [queued, running, needs_confirmation, failed, cancelled, expired] }
              example: { message: 'التصنيف لسه مستني تأكيد أعمدة الملف؛ أكده الأول.', run_status: needs_confirmation }
        '422':
          description: 'Missing field, unknown run or company, a date not `YYYY-MM-DD`, or `period_end` not after `period_start`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }

  /api/v1/financial-reports/{id}:
    get:
      tags: [Financial reports]
      operationId: getFinancialReport
      summary: A report's state
      description: |
        Read from the run as it is now. `run_changed` is true when the run's result changed (a row corrected) after the report
        last computed. No auth yet — must be protected before deployment.
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: The report's state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinancialReportState' }
        '404': { $ref: '#/components/responses/ReportNotFound' }
    patch:
      tags: [Financial reports]
      operationId: updateFinancialReport
      summary: Change the report's company or period
      description: |
        Partial (PR 13a): only the fields sent change; `company_id: null` detaches the company. The period still ends after
        it starts, and starts after the comparative period when one is set; a prior report must stay the same company's.
        Change the prior year first when it no longer fits. Returns the state. No auth yet — must be protected before
        deployment.
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company_id: { type: [string, 'null'], format: uuid }
                period_start: { type: string, format: date }
                period_end: { type: string, format: date }
            example: { period_start: '2025-01-01', period_end: '2025-12-31' }
      responses:
        '200':
          description: The report's state.
          content: { application/json: { schema: { $ref: '#/components/schemas/FinancialReportState' } } }
        '404': { $ref: '#/components/responses/ReportNotFound' }
        '422':
          description: 'An unknown company, a bad date, an end not after the start, a start not after the comparative period, a company other than the prior report''s.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }

  /api/v1/financial-reports/{id}/intake:
    get:
      tags: [Financial reports]
      operationId: getFinancialReportIntake
      summary: The fields this report asks the user
      description: |
        Driven by the run's layout and balances, so only relevant fields appear: the partners' current account presentation
        (when the file has one), the zakat charge or a reason it is zero (when the trial balance has no zakat charge; required
        when there is a profit), whether there is OCI and its items. No auth yet — must be protected before deployment.
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: The fields, with their current values.
          content:
            application/json:
              schema:
                type: object
                required: [fields]
                properties:
                  fields: { type: array, items: { $ref: '#/components/schemas/IntakeField' } }
        '404': { $ref: '#/components/responses/ReportNotFound' }

  /api/v1/financial-reports/{id}/inputs:
    patch:
      tags: [Financial reports]
      operationId: updateFinancialReportInputs
      summary: Enter or change some inputs
      description: |
        Partial: only the keys sent change; `null` removes a value. Every key must be a field of the report's intake once the
        update is applied (`oci.has_items: true` and OCI amounts can go in one request). Values of fields no longer asked are
        dropped. Returns the recomputed state. No auth yet — must be protected before deployment.
        Deprecated keys, accepted and ignored (no longer questions, 2026-10-23): `dividends.proposed` (no proposed-dividends
        note) and `capital.shares_in_words` (the number of shares is written in words by the app).
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs: { type: object, additionalProperties: true, description: 'key → value (number, boolean, text, choice or `YYYY-MM-DD` date, per the field), or null to remove.' }
            example: { inputs: { zakat.charge: 45000, oci.has_items: false } }
      responses:
        '200':
          description: The report's state.
          content: { application/json: { schema: { $ref: '#/components/schemas/FinancialReportState' } } }
        '404': { $ref: '#/components/responses/ReportNotFound' }
        '422':
          description: '`inputs` missing or not an object, a key the report does not ask, a value of the wrong type, a zakat charge ≤ 0, or both a zakat charge and a zero reason. Errors keyed `inputs.<key>`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }

  /api/v1/financial-reports/{id}/account-overrides:
    put:
      tags: [Financial reports]
      operationId: replaceFinancialReportOverrides
      summary: Replace the per-report account overrides
      description: |
        Puts an account on a line of the user's choice, or splits it across lines by shares that add up to 1. An override is
        the user's decision: it wins over every rule and settles a pending row (a periodic stock proposal, a confirm rule, a
        doubted classification). The list replaces the previous one; `[]` clears it. No auth yet — must be protected before deployment.
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [overrides]
              properties:
                overrides: { type: array, maxItems: 2000, items: { $ref: '#/components/schemas/AccountOverride' } }
            example: { overrides: [{ row: 189, line_key: is.cost_of_revenue }, { row: 40, shares: { is.cost_of_revenue: 0.6, is.general_admin: 0.4 } }] }
      responses:
        '200':
          description: The report's state.
          content: { application/json: { schema: { $ref: '#/components/schemas/FinancialReportState' } } }
        '404': { $ref: '#/components/responses/ReportNotFound' }
        '422':
          description: 'Missing `overrides`, a repeated row, both `line_key` and `shares` or none of line, category and tags, a row not in the trial balance, an unknown line, shares not adding up to 1, an unknown tag, or a category not of the note of the row''s line.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }

  /api/v1/financial-reports/{id}/adjustments:
    put:
      tags: [Financial reports]
      operationId: replaceFinancialReportAdjustments
      summary: Replace the report's adjusting entries
      description: |
        Figures the trial balance doesn't hold (a warranty true-up, a reclassification): balanced entries, each with a reason.
        A line is an account (`row`: it follows that account's line) or a statement line (`line_key`), with a debit or a credit.
        Entries are numbered in the order sent and carried with origin `user_adjustment`; none is ever made by the system.
        The list replaces the previous one; `[]` clears it. No auth yet — must be protected before deployment.
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [reason, lines]
                    properties:
                      reason: { type: string, minLength: 3, maxLength: 500 }
                      lines:
                        type: array
                        minItems: 2
                        maxItems: 50
                        items:
                          type: object
                          required: [debit, credit]
                          description: 'Exactly one of `row` and `line_key`; exactly one of `debit` and `credit` above 0.'
                          properties:
                            row: { type: [integer, 'null'], minimum: 1 }
                            line_key: { type: [string, 'null'] }
                            debit: { type: number, minimum: 0 }
                            credit: { type: number, minimum: 0 }
            example: { entries: [{ reason: 'تسوية مخصص الضمان حسب تقدير الإدارة', lines: [{ line_key: is.other_expenses, debit: 12000, credit: 0 }, { line_key: sofp.other_provisions, debit: 0, credit: 12000 }] }] }
      responses:
        '200':
          description: The report's state.
          content: { application/json: { schema: { $ref: '#/components/schemas/FinancialReportState' } } }
        '404': { $ref: '#/components/responses/ReportNotFound' }
        '422':
          description: 'An entry that does not balance, without a reason or with fewer than two lines; a line with both or neither of `row` and `line_key`, or with both or neither of debit and credit; a row not in the trial balance; an unknown line.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }

  /api/v1/financial-reports/{id}/suggestions:
    post:
      tags: [Financial reports]
      operationId: decideFinancialReportSuggestions
      summary: Decide movement suggestions and enter movements
      description: |
        The notes' movement tables (PR 9). With movement columns, each movement is a suggestion (`suggestions`), pending
        until confirmed: `confirm` keeps the suggested amount (pending again if the trial balance later suggests another),
        `edit` enters an amount, `reject` leaves the cell missing until an amount is entered, `reset` drops the decision.
        Without movement columns, the movements the trial balance can't give are entered with `edit` (their keys are in
        `missing`). Decisions apply in order. Returns the state. No auth yet — must be protected before deployment.

        The PPE note's accumulated depreciation: the opening of each category is last year's closing as last year's issued
        statements print it (origin `prior_year_statements`), and the year's depreciation is the trial balance's depreciation
        expense (per category where the expense accounts name it, else the total); the disposals' accumulated depreciation is
        then derived (opening + the year's charge − the closing). The year's charge stays a fact the accountant may `edit`.
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decisions]
              properties:
                decisions:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [key, action]
                    properties:
                      key: { type: string, example: ppe.additions.vehicles }
                      action: { type: string, enum: [confirm, edit, reject, reset] }
                      amount: { type: number, description: '`edit` only (required).' }
            example: { decisions: [{ key: ppe.additions.vehicles, action: confirm }, { key: employee_benefits.paid, action: edit, amount: 0 }] }
      responses:
        '200':
          description: The report's state.
          content: { application/json: { schema: { $ref: '#/components/schemas/FinancialReportState' } } }
        '404': { $ref: '#/components/responses/ReportNotFound' }
        '422':
          description: 'No decisions, an unknown action, `edit` without an amount or another action with one, a key that is not a movement of this report, or `confirm` / `reject` on a movement with no suggestion.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }

  /api/v1/financial-reports/{id}/prior-year:
    put:
      tags: [Financial reports]
      operationId: setFinancialReportPriorYear
      summary: Set where the comparatives come from
      description: |
        `first_year`: no comparatives (one column). `report`: a previous report in this system (same company, ending before
        this period starts), with its own overrides, inputs and entries. `run`: a classified prior-year trial balance (a
        finished run); OCI is never in a trial balance, so its items may be given in `figures` (`is.oci_*` only), or stay
        missing. `manual`: the prior year's figures per line, as displayed (balance-sheet lines positive on their side;
        income +, expenses −); a line not given is 0. `statements` (PR 17): the file of last year's issued statements uploaded
        with `POST …/prior-year/statements-file`, confirmed: each row the file couldn't place exactly needs its line (or a
        total to check against, or `ignore`) in `rows`, the year column where the file doesn't name it in `columns`, and,
        when the file shows expenses positive, `expenses_shown_positive` (true: turned negative). The figures are the file's,
        as shown (origin `prior_year_statements`); a row the file couldn't read makes its line missing; a line of a statement
        in the file with no row is 0, of a statement not in the file missing (then typed `cash_flows` count). Each total of the
        file is checked against the lines read (`prior_file_total`, an error, scope `comparative`). Confirming takes the file
        waiting for review; saving again without a new file keeps the one in use. `none`: no source yet: the balance sheet from the trial balance's
        opening columns when it has them, the income statement missing. The comparative period is the prior report's, or
        the year before this period (or the dates given, for `run` / `manual`). When the opening columns differ from the
        prior closing, check `opening_vs_prior_closing` is an error per line until the prior figures are fixed or the
        comparatives are marked `restated` with a note (then a warning). Nothing is adjusted. Returns the state.
        No auth yet — must be protected before deployment.
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source: { type: string, enum: [none, first_year, report, run, manual, statements] }
                prior_report_id: { type: string, format: uuid, description: '`report` only (required).' }
                prior_run_id: { type: string, format: uuid, description: '`run` only (required).' }
                figures: { type: object, additionalProperties: { type: number }, description: '`manual` (required): line key → amount; a line not given is 0. `run`: OCI items only; `{}` for none; an item not given is then 0.' }
                comparative_start: { type: string, format: date, description: '`run` / `manual` / `statements` only; default: a year before `period_start`.' }
                comparative_end: { type: string, format: date, description: '`run` / `manual` / `statements` only; default: the day before `period_start`.' }
                restated: { type: boolean, description: '`report` / `run` / `manual` / `statements`: the comparatives are restated (معدلة).' }
                rows: { type: object, additionalProperties: { type: string }, description: '`statements` only: `<block>:<row id>` (from `comparative.upload`) → a line or total key of that statement, or `ignore`. Required for every row with an amount that isn''t an `exact` match; may change an exact one.' }
                columns: { type: object, additionalProperties: { type: string }, description: '`statements` only: block index → the column letter of the prior year. Required where `column_certain` is false.' }
                expenses_shown_positive: { type: boolean, description: '`statements` only, required when the file shows every expense positive: true turns them negative (as the income statement shows them), false keeps them.' }
                restatement_note: { type: string, minLength: 3, maxLength: 2000, description: 'Required when `restated`; becomes the restatement note.' }
                skip_opening: { type: boolean, description: '`first_year` only: a first year although the trial balance has opening balances (the user''s override; without it, opening balances give a comparative year).' }
                changes_in_equity: { type: object, additionalProperties: { type: object, additionalProperties: { type: number } }, description: '`run` / `manual` / `statements`: the comparative changes in equity from last year''s issued statements, row (`opening`, `net_profit`, `oci`, `capital_increase`, `transfer_to_reserve`, `dividends`, `prior_year_adjustments`, `other_retained_movements`, `transfer_to_partners_current`, `partners_current_movements`) → column → amount as displayed (a decrease −). A cell not given is 0; totals and closing are computed and checked against the comparative balance sheet.' }
                cash_flows: { type: object, additionalProperties: { type: number }, description: '`run` / `manual` / `statements` (when the file has no cash flow): the comparative cash flow from last year''s issued statements, `cf.*` line → amount as displayed (outflows −). A line not given is 0; totals are computed, and the closing cash is checked against the comparative balance sheet.' }
                notes: { type: object, additionalProperties: { type: object, additionalProperties: { type: number } }, description: '`manual` / `statements`: the notes'' item tables from last year''s issued notes (PR 11), note (`inventory`, `receivables` → `trade_receivables`, `other_receivables`, `cash`, `trade_payables`, `other_payables`, `revenue`, `cost_of_revenue`, `selling`, `general_admin`, `other_income`, `finance_cost`; and `cost_of_revenue_build_up`: `opening`, `purchases`, `purchase_costs`, `closing`) → class name (as the note lists it) → amount, positive on the line''s side. A class not given is 0 once its note is given; checked against the comparative line (check 14). A prior report or prior trial balance gives these itself.' }
                schedules: { type: object, additionalProperties: { type: number }, description: '`run` / `manual` / `statements`: the notes'' movement tables from last year''s issued notes (PR 11), by the cell keys of this year''s tables: `<schedule>.<row>` (provisions) or `<schedule>.<row>.<column>` (asset notes), every row but the closing ones (the closing is this year''s opening). A cell not given is 0 once any is given; the roll is checked (provisions: `provision_rollforward`, scope `comparative`).' }
            examples:
              report: { value: { source: report, prior_report_id: 5a1c9e2f-3b4d-4e6f-8a7b-9c0d1e2f3a4b } }
              manual: { value: { source: manual, figures: { sofp.cash: 120000, sofp.share_capital: 100000, sofp.retained_earnings: 20000, is.revenue: 500000, is.general_admin: -480000 } } }
              firstYear: { value: { source: first_year } }
      responses:
        '200':
          description: The report's state.
          content: { application/json: { schema: { $ref: '#/components/schemas/FinancialReportState' } } }
        '404': { $ref: '#/components/responses/ReportNotFound' }
        '422':
          description: 'Unknown source; a field the source does not take, or a required one missing; `statements` without a file uploaded, a row with an amount not placed, an unknown row, line or column, a year column not chosen, expenses shown positive not confirmed; an unknown changes-in-equity row or column, or cash-flow line; a note without an item table, or a movement-table cell that is not typed for the prior year; a prior report of another company, not ending before this period, or this report; a prior run not finished, or this report''s run; an unknown line; a comparative period not ending before this period; `restated` without a note.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }

  /api/v1/financial-reports/{id}/prior-year/statements-file:
    post:
      tags: [Financial reports]
      operationId: uploadFinancialReportPriorStatements
      summary: Upload last year's issued statements (Excel or PDF) for review
      description: |
        **Excel** (PR 17, Q7): read by PHP at once (200). **PDF** (scanned or not): kept, and the AI looks for the statements'
        pages in the background (202; `comparative.upload.status` `locating` → `pages`, or `failed`). The user confirms or
        corrects the pages with `PUT …/statements-file/pages`, then each statement's table is copied by the AI from its own
        pages, as printed, and read by PHP exactly like an Excel file's (below). Poll `GET /financial-reports/{id}` for the
        status. A PDF with more pages than `PRIOR_PDF_MAX_PAGES` (150) or that needs a password: 422, nothing sent.

        The file of last year's issued statements, read by PHP: each statement under a title row «قائمة …»
        (financial position, comprehensive income, cash flows; changes in equity ends the one before it), the column headed by
        the comparative year, and each row's label and amount (numbers, «(1,234)», «-», Western or Arabic-Indic digits; anything
        else `unread`, which becomes a missing figure, never 0). Each row gets a proposed line or total by its wording:
        `exact`, `synonym` (a wording in `/statement-synonyms`), `probable` or `none`. Kept in `comparative.upload` for review in step 2; the comparatives don't change until
        `PUT …/prior-year` with source `statements`. A new file replaces one waiting. Returns the state.
        No auth yet — must be protected before deployment.
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: '`.xlsx` or `.xls` (≤ 10 MB), or `.pdf` (≤ `PRIOR_PDF_MAX_KB`, 20 MB).' }
      responses:
        '402': { $ref: '#/components/responses/AiLimitReached' }
        '200':
          description: An Excel file, read. The report's state.
          content: { application/json: { schema: { $ref: '#/components/schemas/FinancialReportState' } } }
        '202':
          description: A PDF, kept; its statements' pages are being looked for. The report's state.
          content: { application/json: { schema: { $ref: '#/components/schemas/FinancialReportState' } } }
        '413':
          description: 'Larger than the server''s request limit (PHP `post_max_size`): nothing read. The message names the limit.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } }
        '404': { $ref: '#/components/responses/ReportNotFound' }
        '422':
          description: 'No file, not Excel or PDF, too large, unreadable, a PDF with too many pages or a password, or no statement found in an Excel file.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }
    get:
      tags: [Financial reports]
      operationId: getFinancialReportPriorStatementsPdf
      summary: The PDF of last year's statements
      description: 'The PDF waiting for review, else the one the `statements` source uses: to look at the pages found (`#page=N`).'
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: The PDF.
          content: { application/pdf: { schema: { type: string, format: binary } } }
        '404': { $ref: '#/components/responses/ReportNotFound' }

  /api/v1/financial-reports/{id}/prior-year/statements-file/pages:
    put:
      tags: [Financial reports]
      operationId: readFinancialReportPriorStatementsPages
      summary: Confirm the statements' pages in the PDF and read them
      description: |
        The pages of each statement in the PDF waiting, as the user confirms or corrects them (what the AI found is only
        proposed, in `comparative.upload.found`). Then each statement read (financial position, comprehensive income, cash
        flows; changes in equity is not read) is cut out and copied by the AI in the background: 202, upload status
        `reading` → `ready` (its `blocks` to review, as an Excel file's) or `failed` (with `error`; the pages stay, to correct
        and send again). Allowed once the pages are found, after a failure, and again on a file read (to read other pages).
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: '`pages`, or `page_kinds` (then `pages` follows from them).'
              properties:
                page_kinds:
                  type: array
                  description: 'What each page of the file is, every page once (as `comparative.upload.page_kinds`, corrected): its kind and how far it is turned clockwise to read upright. Each statement''s pages are then its pages of that kind; `auditor_report` pages are never read.'
                  items:
                    type: object
                    required: [page, kind]
                    properties:
                      page: { type: integer, minimum: 1 }
                      kind: { type: string, enum: [cover, contents, auditor_report, financial_position, comprehensive_income, changes_in_equity, cash_flows, notes, other] }
                      rotation: { type: integer, enum: [0, 90, 180, 270] }
                pages:
                  type: object
                  description: 'Statement → its pages in the file (1-based, inclusive). At least one statement that is read. Required without `page_kinds`.'
                  propertyNames: { enum: [financial_position, comprehensive_income, changes_in_equity, cash_flows] }
                  additionalProperties: { type: object, required: [from, to], properties: { from: { type: integer, minimum: 1 }, to: { type: integer, minimum: 1 } } }
      responses:
        '202':
          description: The pages are being read. The report's state.
          content: { application/json: { schema: { $ref: '#/components/schemas/FinancialReportState' } } }
        '404': { $ref: '#/components/responses/ReportNotFound' }
        '409':
          description: 'No PDF is waiting, or it is still being worked on (`locating` or `reading`).'
          content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } }
        '422':
          description: 'Pages outside the file, a last page before the first, an unknown statement, or none of the statements read.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }

  /api/v1/financial-reports/{id}/prior-year/statements-file/wording:
    put:
      tags: [Financial reports]
      operationId: settleFinancialReportPriorStatementsWording
      summary: Mark words of the PDF as right, or keep a corrected word as printed
      description: |
        The wording read from the PDF of last year's statements (R11, R16), as the accountant settles it. `known_words`:
        words marked as right (a partner's name, a rare word): never flagged again, in any file (the known words).
        `keep_original`: by a correction's id (`comparative.upload.issues[].correction.id`), true keeps the word as printed
        (it is then known too), false takes the correction again. The file waiting for review, else the one in use.
        Returns the state.
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: '`known_words`, `keep_original`, or both.'
              properties:
                known_words: { type: array, maxItems: 50, items: { type: string, maxLength: 100 } }
                keep_original: { type: object, additionalProperties: { type: boolean } }
      responses:
        '200':
          description: The report's state.
          content: { application/json: { schema: { $ref: '#/components/schemas/FinancialReportState' } } }
        '404': { $ref: '#/components/responses/ReportNotFound' }
        '409':
          description: 'No PDF of last year''s statements, or not read yet.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } }
        '422':
          description: 'Neither field, a word without an Arabic letter, or a correction the file doesn''t have.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }

  /api/v1/financial-reports/{id}/prior-year/approved-opening:
    put:
      tags: [Financial reports]
      operationId: setFinancialReportApprovedOpening
      summary: This year's openings from last year's approved statements, or the trial balance's
      description: |
        The report's setting (on by default; `comparative.approved_opening.enabled`). On, with last year's statements in
        use from a file: each line's closing this year = last year's approved closing + this year's movement in the trial
        balance (closing − opening per account), in the statements, the notes, the PPE table, the changes in equity, the
        cash flow, the zakat base and the going-concern figures; the trial balance's differing openings are reconciled
        line by line (`comparative.approved_opening`). Off: this year's figures are the trial balance's own. The
        comparative column is last year's approved statements either way. Returns the state.
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: The report's state.
          content: { application/json: { schema: { $ref: '#/components/schemas/FinancialReportState' } } }
        '404': { $ref: '#/components/responses/ReportNotFound' }
        '422':
          description: '`enabled` missing or not a boolean.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }

  /api/v1/financial-reports/{id}/zakat-tax:
    put:
      tags: [Financial reports]
      operationId: setFinancialReportZakatTax
      summary: The zakat and income tax dialog - the calculation's answers and the charges
      description: |
        The year's zakat and income tax are calculated from the statements (`zakat_tax` in the state): the accountants'
        zakat sheet under the Zakat Collection Regulation of 1445 H (base = equity and what is treated as equity +
        non-current liabilities within the assets deducted + the profit difference + current liabilities beyond the current
        assets - the assets deducted, between a minimum (the adjusted profit) and a maximum (equity), x 2.5% x the year's
        days / 354 on the Saudi and GCC owners' share; income tax 20% of the foreign share of the adjusted profit after the
        carried-forward losses, at most a quarter of the profit). The figures are the statements' before the year's own zakat
        and tax, so charging the result changes nothing in the calculation.

        `inputs`: the accountant's answers (`saudi_share` 0-100, default 100; `profit_additions`, `profit_deductions`,
        `loss_carryforward`, `deducted_current_assets`, `noncurrent_as_current`, `extra_additions`, `extra_deductions`, each
        0 or more; `related_as_liability` boolean; `deduct_lines`, the non-current asset lines deducted); a key set to null
        goes back to its default. `apply`: `zakat` and `income_tax`, true to charge the amount calculated now (Dr the
        expense, Cr its provision) and false to take the charge out. A charge is taken only where nothing else charges it: 422
        when the trial balance or an entry has it, the intake's `zakat.charge` is typed, or the amount is nil. Returns the state.

        The calculation is the accountant's to correct: `inputs.overrides` maps a line of the sheet (any row's `line` in the
        groups, or `is.profit_before_zakat`) to the amount to use instead of the statements' (the whole map is replaced; null
        or {} drops every correction). Each row then says `edited` and keeps the statements' figure as `computed`.

        `adopt`: for `zakat` and `income_tax`, which amount the statements carry: `calculated` (the calculation, whatever the
        books book), `booked` (what the trial balance and the entries book, no charge added), `manual` (the accountant's own
        amount, `manual.<charge>`, required with it; 422 `zakat_manual_required` without one); null goes back to automatic
        (the calculation where nothing books it). The difference between the adopted amount and the books' is posted (Dr the
        expense, Cr its provision). The state's `zakat_tax` shows `adopt`, each choice's amount (`candidates`) and what the
        statements carry now (`in_statements`).
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                inputs:
                  type: object
                  additionalProperties: true
                  properties:
                    overrides:
                      type: [object, 'null']
                      additionalProperties: { type: [number, 'null'] }
                      description: 'Line key → the amount the calculation uses instead of the statements''.'
                apply:
                  type: object
                  properties:
                    zakat: { type: boolean }
                    income_tax: { type: boolean }
                adopt:
                  type: object
                  properties:
                    zakat: { type: [string, 'null'], enum: [calculated, booked, manual, null] }
                    income_tax: { type: [string, 'null'], enum: [calculated, booked, manual, null] }
                manual:
                  type: object
                  properties:
                    zakat: { type: [number, 'null'], minimum: 0 }
                    income_tax: { type: [number, 'null'], minimum: 0 }
            example:
              adopt: { zakat: manual, income_tax: calculated }
              manual: { zakat: 15250.5 }
              inputs: { overrides: { sofp.statutory_reserve: 12000, is.profit_before_zakat: 480000 } }
      responses:
        '200':
          description: The report's state.
          content: { application/json: { schema: { $ref: '#/components/schemas/FinancialReportState' } } }
        '404': { $ref: '#/components/responses/ReportNotFound' }
        '422':
          description: An answer out of range or not one of the calculation's, or a charge that can't be taken.
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }

  /api/v1/financial-reports/{id}/prior-year/statements-file/totals:
    put:
      tags: [Financial reports]
      operationId: settleFinancialReportPriorStatementsTotals
      summary: Choose the printed total or the columns' sum where they differ
      description: |
        A table total of the PDF of last year's statements that differs from its columns' sum
        (`comparative.upload.issues[].total`). By default the one that ties to the statement line is used, else the sum.
        `use`: by the total's id, `printed` or `sum`; by a year end's balances' id (`issues[].total_group.id`), the index
        of one of its options (the combinations of printed totals and columns' sums that agree: cost − accumulated
        depreciation = net book value); null goes back to the default. The file waiting for review, else the one in use.
        Returns the state.
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [use]
              properties:
                use: { type: object, additionalProperties: { type: string, nullable: true, maxLength: 10, description: '`printed`, `sum`, or an option''s index' } }
      responses:
        '200':
          description: The report's state.
          content: { application/json: { schema: { $ref: '#/components/schemas/FinancialReportState' } } }
        '404': { $ref: '#/components/responses/ReportNotFound' }
        '409':
          description: 'No PDF of last year''s statements, or not read yet.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } }
        '422':
          description: 'No choice, a value other than printed or sum, or a total the file doesn''t have.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }

  /api/v1/financial-reports/{id}/notes:
    patch:
      tags: [Financial reports]
      operationId: updateFinancialReportNotes
      summary: Show or hide notes and policies, reword paragraphs
      description: |
        The user's choices on the notes (PR 11, Q11, Q13). `visibility`: a note with a condition (`ppe`, `inventory`,
        `going_concern`, …) or a policy (`policy_ppe`, `policy_subsidiaries`, …) forced `on` or `off`; `auto` drops the
        choice (the note shows when one of its lines is ≠ 0 in either year, or for its own reason). Notes without a condition
        (incorporation, basis, policies, capital, financial risk, subsequent events, approval) always show. `texts`: a shown
        paragraph's wording replaced (`<note>.<n>`: the paragraph's key in `notes[].blocks`); null goes back to the template's
        text. The replaced wording is kept: when the template's text later changes (an amount moved), check
        `edited_text_outdated` says so. Partial: only the keys sent change. Notes are renumbered at every compute; the
        statements' note column follows. Returns the state. No auth yet — must be protected before deployment.
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                visibility: { type: object, additionalProperties: { type: string, enum: [on, off, auto] } }
                texts: { type: object, additionalProperties: { type: [string, 'null'], maxLength: 5000 } }
                items: { type: object, description: 'Last year''s note lines (R12): note → account (row number, or `adjustments`) → the key of one of `note_items.<note>.items`, `new` (a new item, «-» last year), or null (back to the line proposed).', additionalProperties: { type: object, additionalProperties: { type: [string, 'null'], maxLength: 300 } } }
                ppe: { type: object, description: 'Last year''s PPE categories (R13): account row → the key of one of `ppe_prior.categories`, `none`, or null (back to the proposal).', additionalProperties: { type: [string, 'null'], maxLength: 20 } }
            example: { visibility: { investment_property: on, policy_subsidiaries: off }, texts: { incorporation.2: 'يتمثل نشاط الشركة في تجارة الجملة والتجزئة.' } }
      responses:
        '200':
          description: The report's state.
          content: { application/json: { schema: { $ref: '#/components/schemas/FinancialReportState' } } }
        '404': { $ref: '#/components/responses/ReportNotFound' }
        '422':
          description: 'Neither `visibility` nor `texts`; a note or policy that is always shown or unknown; a choice other than on, off, auto; an unknown paragraph, one not shown now, or a text under 3 characters.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }

  /api/v1/financial-reports/{id}/acknowledgements:
    put:
      tags: [Financial reports]
      operationId: updateFinancialReportAcknowledgements
      summary: Acknowledge warnings
      description: |
        Replaces the acknowledged warnings (PR 12, Q20): each `key` a warning's `key` in the report's `checks` now. A final
        version needs every warning acknowledged. The key covers the warning's amounts: when they change, the warning gets a
        new key and needs a new acknowledgement. Acknowledging `run_changed` takes the run as it is now (the warning goes)
        instead of being stored. An acknowledgement kept from before keeps its time. Send `[]` to withdraw them all. Returns
        the state. No auth yet — must be protected before deployment.
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acknowledgements]
              properties:
                acknowledgements:
                  type: array
                  items:
                    type: object
                    required: [key]
                    properties:
                      key: { type: string, maxLength: 100 }
                      note: { type: [string, 'null'], maxLength: 500 }
            example: { acknowledgements: [{ key: 'going_concern_indicator:3f9a0c1b2d4e5f60', note: 'الشركاء قرروا الاستمرار.' }] }
      responses:
        '200':
          description: The report's state.
          content: { application/json: { schema: { $ref: '#/components/schemas/FinancialReportState' } } }
        '404': { $ref: '#/components/responses/ReportNotFound' }
        '422':
          description: 'No `acknowledgements` list; a key that is not a warning of the report now (an error, info, or a warning whose amounts changed); a note over 500 characters.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }

  /api/v1/financial-reports/{id}/versions:
    post:
      tags: [Financial reports]
      operationId: createFinancialReportVersion
      summary: Freeze the report as a draft or final version
      description: |
        Saves the report's state as a new, immutable version (PR 12, Q19). A draft can always be made. A final only when
        `can_finalize` (Q20): no error checks, every warning acknowledged, nothing in `missing`, no pending movement
        suggestion or account mapping; otherwise 422 with what blocks it. A final sets the report's `status` to `final`
        and `finalized_at`; a later final supersedes it. The report stays editable; `changed_since_final` says when it no
        longer matches the final. No auth yet — must be protected before deployment.
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [draft, final] }
            example: { kind: draft }
      responses:
        '201':
          description: The version made.
          content: { application/json: { schema: { $ref: '#/components/schemas/ReportVersion' } } }
        '404': { $ref: '#/components/responses/ReportNotFound' }
        '422':
          description: 'Final blocked (`FinalBlocked`), or `kind` missing or not draft / final (`ValidationError`).'
          content:
            application/json:
              schema: { oneOf: [{ $ref: '#/components/schemas/FinalBlocked' }, { $ref: '#/components/schemas/ValidationError' }] }
    get:
      tags: [Financial reports]
      operationId: listFinancialReportVersions
      summary: List the report's versions
      description: Newest first, without payloads. No auth yet — must be protected before deployment.
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: The versions.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ReportVersionSummary' } }
        '404': { $ref: '#/components/responses/ReportNotFound' }

  /api/v1/financial-reports/{id}/versions/{version}:
    get:
      tags: [Financial reports]
      operationId: showFinancialReportVersion
      summary: One version with its payload
      description: The version exactly as made. No auth yet — must be protected before deployment.
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/VersionNumber'
      responses:
        '200':
          description: The version.
          content: { application/json: { schema: { $ref: '#/components/schemas/ReportVersion' } } }
        '404':
          description: Unknown report or version.
          content: { application/json: { schema: { $ref: '#/components/schemas/Message' }, example: { message: 'هذا الإصدار غير موجود.' } } }

  /api/v1/financial-reports/{id}/versions/{version}/export.xlsx:
    get:
      tags: [Financial reports]
      operationId: exportFinancialReportVersionXlsx
      summary: The version's statements as an Excel file (PR 14)
      description: |
        Made on demand from the version's stored payload, so the same version always gives the same file, byte for byte (Q16).
        The template `resources/templates/<template_version>/statements.xlsx` filled: whole riyals, negatives in parentheses, zero «-»,
        Western digits, right to left; «[ناقص]» for a missing figure; lines, rows and columns zero in both years hidden.
        A draft is marked «مسودة» (cover, every page's header) and opens on a sheet «ملاحظات المسودة» with what blocks a final, the
        missing figures and the failing checks. Every version has a sheet «قيود التسوية»: the adjusting entries as journal entries
        (entry number, account «number — name», debit, credit, reason) with a check that each balances (Q39).
        No auth yet — must be protected before deployment.
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/VersionNumber'
      responses:
        '200':
          description: 'Download, named «القوائم المالية - <company> - <period end> - نسخة <n> (<kind>).xlsx» (`filename*`), with an ASCII `filename` fallback.'
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '404':
          description: Unknown report or version.
          content: { application/json: { schema: { $ref: '#/components/schemas/Message' }, example: { message: 'هذا الإصدار غير موجود.' } } }

  /api/v1/financial-reports/{id}/versions/{version}/export.docx:
    get:
      tags: [Financial reports]
      operationId: exportFinancialReportVersionDocx
      summary: The version's notes as a Word file (PR 15)
      description: |
        Made on demand from the version's stored payload, so the same version always gives the same file, byte for byte (Q16).
        The template `resources/templates/<template_version>/notes.docx` filled to show what the version shows: the same notes,
        numbered 1…N by Word's own numbering, each shown paragraph (the user's wording where they replaced it), each table laid
        out by the same rules (items repeated, rows and category columns zero in both years hidden, a first year's prior-year
        columns gone); whole riyals, negatives in parentheses, zero «-», Western digits, right to left; «[ناقص]» for a missing
        figure. No placeholder and no «[review]» comment is left; the landscape PPE section goes when the PPE note is hidden.
        A draft says «مسودة» in every page's header and starts with a page of what blocks a final, the missing figures and the
        failing checks.
        No auth yet — must be protected before deployment.
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/VersionNumber'
      responses:
        '200':
          description: 'Download, named «الإيضاحات المتممة للقوائم المالية - <company> - <period end> - نسخة <n> (<kind>).docx» (`filename*`), with an ASCII `filename` fallback.'
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: { type: string, format: binary }
        '404':
          description: Unknown report or version.
          content: { application/json: { schema: { $ref: '#/components/schemas/Message' }, example: { message: 'هذا الإصدار غير موجود.' } } }

  /api/v1/financial-reports/{id}/versions/{version}/export.pdf:
    get:
      tags: [Financial reports]
      operationId: exportFinancialReportVersionPdf
      summary: The version's statements and notes as a PDF (PR 16)
      description: |
        Made on demand from the version's stored payload, so the same version always gives the same file, byte for byte (Q16).
        Rendered by mPDF from a print view, with the open Arabic font XB Riyaz embedded. It shows what the wizard shows: a cover,
        the four statements with the same rows as the Excel file and the wizard (a line or total zero in both years and a heading
        with nothing showing under it hidden; a missing figure isn't zero) and the «إيضاح» column,
        the changes in equity for both years (landscape), then the shown notes numbered 1…N with the version's paragraphs and
        tables (a note with a wide table on a landscape page). Whole riyals, negatives in parentheses, zero «-», Western digits,
        right to left; «[ناقص]» for a missing figure. A draft says «مسودة» on its cover, in every page's header and as a
        watermark, and its second page lists what blocks a final, the missing figures and the failing checks.
        No auth yet — must be protected before deployment.
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/VersionNumber'
      responses:
        '200':
          description: 'Download, named «القوائم المالية والإيضاحات المتممة لها - <company> - <period end> - نسخة <n> (<kind>).pdf» (`filename*`), with an ASCII `filename` fallback.'
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404':
          description: Unknown report or version.
          content: { application/json: { schema: { $ref: '#/components/schemas/Message' }, example: { message: 'هذا الإصدار غير موجود.' } } }

  /api/v1/statement-synonyms:
    get:
      tags: [Financial reports]
      operationId: listStatementSynonyms
      summary: The synonyms of the statements' lines
      description: |
        PR 17. Other wordings of a line or total that a file of last year's issued statements may use (started with common
        wordings; the user edits the list). A row of an uploaded file whose label has a synonym's wording (normalised:
        spelling, «ال», «و» and word order don't matter) is placed on its line (`certainty: synonym`). Exact, no AI.
        `lines`: what a synonym may point to, per statement. No auth yet — must be protected before deployment.
      responses:
        '200':
          description: The list, by statement and line.
          content:
            application/json:
              schema:
                type: object
                required: [data, lines]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/StatementSynonym' } }
                  lines:
                    type: object
                    additionalProperties:
                      type: array
                      items: { type: object, required: [key, type, label_ar], properties: { key: { type: string }, type: { type: string, enum: [line, total] }, label_ar: { type: string } } }
    post:
      tags: [Financial reports]
      operationId: createStatementSynonym
      summary: Add a synonym
      description: 'One wording per statement; never a line''s own label. No auth yet — must be protected before deployment.'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StatementSynonymInput' } } }
      responses:
        '201':
          description: The synonym.
          content: { application/json: { schema: { $ref: '#/components/schemas/StatementSynonym' } } }
        '422':
          description: 'An unknown line or total, a label with no Arabic, a line''s own label, or a wording the statement already has.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }

  /api/v1/statement-synonyms/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      tags: [Financial reports]
      operationId: updateStatementSynonym
      summary: Change a synonym's wording or line
      description: 'As adding. A file already confirmed keeps its matches. No auth yet — must be protected before deployment.'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StatementSynonymInput' } } }
      responses:
        '200':
          description: The synonym.
          content: { application/json: { schema: { $ref: '#/components/schemas/StatementSynonym' } } }
        '404':
          description: Unknown synonym.
          content: { application/json: { schema: { $ref: '#/components/schemas/Message' }, example: { message: 'هذا المرادف غير موجود.' } } }
        '422':
          description: As adding.
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }
    delete:
      tags: [Financial reports]
      operationId: deleteStatementSynonym
      summary: Delete a synonym
      description: 'A file already confirmed keeps its matches. No auth yet — must be protected before deployment.'
      responses:
        '204': { description: Deleted. }
        '404':
          description: Unknown synonym.
          content: { application/json: { schema: { $ref: '#/components/schemas/Message' }, example: { message: 'هذا المرادف غير موجود.' } } }

  /api/v1/clients/{id}/follow-up:
    get:
      tags: [Client follow-up]
      operationId: getClientFollowUp
      summary: What is missing for a year, and the emails sent and received
      description: |
        `missing`: the client's open requests (not sent, or sent back) for the year; working papers are not asked of the client. `can_send`: the client
        has an email address and the signed-in user can send (their own mailbox, or a system mailbox that is not `log`). The emails newest first.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - { name: year, in: query, schema: { type: integer, minimum: 2000, maximum: 2100 }, description: 'Default: the year the client''s period ends in.' }
      responses:
        '200':
          description: The follow-up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FollowUpState' }
        '404': { $ref: '#/components/responses/CompanyNotFound' }
        '422':
          description: An invalid year.
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }
  /api/v1/clients/{id}/follow-up/draft:
    post:
      tags: [Client follow-up]
      operationId: draftClientFollowUp
      summary: The AI's email for the missing documents (nothing is sent)
      description: |
        The AI sees the missing documents and the latest trial balance and writes the subject, a short intro, a reason for a document only where the
        books show one (a loan balance → the loan agreement) or it was sent back, and at most three questions. The list itself is the requests' own (the
        AI cannot add, drop or rename one). `body`: the email as it would go, to edit and send with `…/follow-up/send`. Nothing missing: `draft` null
        and `message`.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [year], properties: { year: { type: integer, minimum: 2000, maximum: 2100 } } }
            example: { year: 2025 }
      responses:
        '402': { $ref: '#/components/responses/AiLimitReached' }
        '200':
          description: The draft, or nothing missing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FollowUpDraft' }
        '404': { $ref: '#/components/responses/CompanyNotFound' }
        '422':
          description: The year missing or invalid.
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }
        '502': { $ref: '#/components/responses/ProviderError' }
  /api/v1/clients/{id}/follow-up/send:
    post:
      tags: [Client follow-up]
      operationId: sendClientFollowUp
      summary: Send the email from the signed-in accountant's mailbox
      description: |
        To the client's email, from the sender's own mailbox (Reply-To: their address), else from the system mailbox. A reference `[XXXXXXXX]` is added
        to the subject, so the reply finds its way back; the email is kept with the requests it asked about and said in the client's chat. An unanswered
        email is sent again after `PORTAL_MAIL_REMIND_AFTER_DAYS` days, up to `PORTAL_MAIL_MAX_REMINDERS`, when `PORTAL_MAIL_AUTO_REMIND` is on.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year, subject, body, requests]
              properties:
                year: { type: integer, minimum: 2000, maximum: 2100 }
                subject: { type: string, maxLength: 200 }
                body: { type: string, maxLength: 20000 }
                requests: { type: array, minItems: 1, items: { type: integer }, description: 'The requests the email asks for (their ids, from the draft''s items).' }
            example: { year: 2025, subject: 'المستندات المطلوبة لمراجعة القوائم المالية 2025', body: 'السادة / أحمد السالم المحترمين، …', requests: [184, 185] }
      responses:
        '201':
          description: Sent.
          content: { application/json: { schema: { $ref: '#/components/schemas/ClientEmail' } } }
        '404': { $ref: '#/components/responses/CompanyNotFound' }
        '422':
          description: Invalid fields; or (on `follow_up`) the client has no email address, or the sender has no mailbox and the system has none.
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }
        '502':
          description: The mail server refused it, said in words (a wrong app password, the server out of reach, TLS). The email is kept as `failed`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
              example: { message: 'تعذّر إرسال الرسالة: رفض خادم البريد اسم المستخدم أو كلمة المرور. …' }
  /api/v1/clients/{id}/follow-up/replies:
    post:
      tags: [Client follow-up]
      operationId: enterClientReply
      summary: A reply that came another way, read by the AI and acted on
      description: |
        A forwarded email or a call's note, with its files. As for a reply read from the mailbox: the AI says what it means for each document (attached,
        will send later, does not apply, a question); the text goes into the client's chat; each file goes to the request it answers (one the AI is not
        sure of to «غير مصنّف», where the content review files it); nothing is declared for the client (`needs_accountant`). Without the AI the reply
        still reaches the chat, `analysis.unavailable: true`.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [year, text]
              properties:
                year: { type: integer, minimum: 2000, maximum: 2100 }
                text: { type: string, maxLength: 20000 }
                'files[]': { type: array, maxItems: 10, items: { type: string, format: binary }, description: 'Up to 10 files, 20 MB each.' }
      responses:
        '402': { $ref: '#/components/responses/AiLimitReached' }
        '201':
          description: The reply, as read.
          content: { application/json: { schema: { $ref: '#/components/schemas/ClientEmail' } } }
        '404': { $ref: '#/components/responses/CompanyNotFound' }
        '422':
          description: Invalid fields.
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }
  /api/v1/clients/{id}/prepared-papers:
    get:
      tags: [Working papers]
      operationId: listPreparedPapers
      summary: Every working paper and recalculation, and where its preparation is
      description: |
        The catalogue (5 recalculations, 16 working papers) with, for the year: `documents` the client's uploads it is prepared from
        (config/paper_sources.php), `status` (`none` not asked yet, `queued`, `working`, `done`, `blocked`: no document from the client yet, `failed`),
        `progress` the documents read so far, `summary` what the paper shows (the recalculation against the books), the AI's `notes`, `download_url`.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - { name: year, in: query, schema: { type: integer, minimum: 2000, maximum: 2100 } }
        - { name: kind, in: query, schema: { type: string, enum: [paper, recalc] } }
      responses:
        '200':
          description: The papers.
          content: { application/json: { schema: { $ref: '#/components/schemas/PreparedPapers' } } }
        '404': { $ref: '#/components/responses/CompanyNotFound' }
        '422':
          description: An invalid year or kind.
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }
    post:
      tags: [Working papers]
      operationId: preparePapers
      summary: Start the AI on one paper or on all of a kind
      description: |
        Queued (a queue worker prepares them); follow with the GET. The AI reads each document of the paper and copies the rows it asks for (never
        computes, never invents); PHP writes them into the firm's form and recalculates against the books. A paper with no document from the client is
        `blocked` and the AI is not asked.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year, kind, key]
              properties:
                year: { type: integer, minimum: 2000, maximum: 2100 }
                kind: { type: string, enum: [paper, recalc] }
                key: { type: string, description: 'A paper''s key (`eosb`, `depreciation`, `customer-confirmations`…), or `all`.' }
            example: { year: 2025, kind: recalc, key: all }
      responses:
        '402': { $ref: '#/components/responses/AiLimitReached' }
        '202':
          description: Queued.
          content:
            application/json:
              schema:
                type: object
                required: [queued, papers]
                properties:
                  queued: { type: integer }
                  papers: { type: array, items: { $ref: '#/components/schemas/PreparedPaper' } }
        '404': { $ref: '#/components/responses/CompanyNotFound' }
        '422':
          description: Invalid fields, an unknown key, or a key of the other kind.
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }
  /api/v1/clients/{id}/prepared-papers/{paper}/download:
    get:
      tags: [Working papers]
      operationId: downloadPreparedPaper
      summary: The prepared workbook
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - { name: paper, in: path, required: true, schema: { type: string }, description: 'The paper''s `id` from the list.' }
      responses:
        '200':
          description: The workbook (the firm's form filled, the recalculation's formulas kept).
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '404':
          description: Unknown company or paper, or not prepared yet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
  /api/v1/clients/{id}/findings:
    get:
      tags: [Audit findings]
      operationId: listAuditFindings
      summary: The audit findings of a client's year (ملاحظات المراجعة)
      description: |
        Computed every time from what the AI read and the system matched, never typed: each balance a client's document states (a bank
        statement's closing balance, a customer's or supplier's confirmation, a loan statement…) against the account of the year's trial
        balance it is about (found by the reference printed — account number, IBAN — or the counterparty's name, among the accounts of its
        class); a document whose problems the client hasn't fixed; each recalculation against the trial balance's own figure (its accounts
        by classification, config/tb_matching.php) with the adjusting entry the difference calls for; the working papers' unexplained
        differences and open rows. A difference under 2 riyals is rounding, not a finding. The trial balance is the run of the year's
        financial statements, else the client's latest (`trial_balance.latest`). Each finding keeps the accountant's `status` and `comment`
        (PUT). Open findings first, differences first, the largest first.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - { name: year, in: query, schema: { type: integer, minimum: 2000, maximum: 2100 }, description: 'Default: the year of the client''s period.' }
        - { name: status, in: query, schema: { type: string, enum: [open, adjusted, accepted, dismissed] }, description: 'Only the findings with this status.' }
      responses:
        '200':
          description: The findings.
          content: { application/json: { schema: { $ref: '#/components/schemas/AuditFindings' } } }
        '404': { $ref: '#/components/responses/CompanyNotFound' }
        '422':
          description: An invalid year or status.
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }
  /api/v1/clients/{id}/findings/{key}:
    put:
      tags: [Audit findings]
      operationId: decideAuditFinding
      summary: The accountant's word on a finding
      description: '`adjusted` (an adjusting entry was made), `accepted` (explained, nothing to change), `dismissed` (not a finding), or `open` again; with a comment. Returns the year''s findings.'
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - { name: key, in: path, required: true, schema: { type: string }, description: 'The finding''s `key`.' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year, status]
              properties:
                year: { type: integer, minimum: 2000, maximum: 2100 }
                status: { type: string, enum: [open, adjusted, accepted, dismissed] }
                comment: { type: [string, 'null'], maxLength: 2000 }
            example: { year: 2025, status: adjusted, comment: 'سُجل قيد التسوية' }
      responses:
        '200':
          description: The findings.
          content: { application/json: { schema: { $ref: '#/components/schemas/AuditFindings' } } }
        '404':
          description: Unknown company, or no finding with this key for the year.
          content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } }
        '422':
          description: Invalid fields.
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }
  /api/v1/clients/{id}/findings/export:
    get:
      tags: [Audit findings]
      operationId: exportAuditFindings
      summary: The findings as a workbook
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - { name: year, in: query, schema: { type: integer, minimum: 2000, maximum: 2100 } }
      responses:
        '200':
          description: The findings, right to left, with their amounts, suggested entries, recommendations, statuses and comments.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/CompanyNotFound' }
        '422':
          description: An invalid year.
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }
  /api/v1/account/mail:
    get:
      tags: [Mailbox]
      operationId: getMailbox
      summary: The signed-in accountant's mailbox, and the providers to pick from
      responses:
        '200':
          description: The mailbox (null when not set up) and the providers.
          content:
            application/json:
              schema:
                type: object
                required: [mailbox, providers]
                properties:
                  mailbox: { oneOf: [{ $ref: '#/components/schemas/Mailbox' }, { type: 'null' }] }
                  providers: { type: object, additionalProperties: { $ref: '#/components/schemas/MailProvider' } }
    put:
      tags: [Mailbox]
      operationId: saveMailbox
      summary: Save the mailbox and test it at once
      description: |
        The test: a message to the mailbox's own address (SMTP), then, with `imap_enabled`, a sign-in to its inbox (IMAP, read-only). A refusal is said in
        words (`test.message`, `imap.message`). The password: required the first time; left out it stays, except for a new server, port or username
        (then 422). A Gmail app password's spaces are dropped. Stored encrypted, never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, from_address, host, port, security, username]
              properties:
                provider: { type: string, enum: [gmail, outlook, yahoo, zoho, custom] }
                from_address: { type: string, format: email }
                from_name: { type: [string, 'null'], maxLength: 120 }
                host: { type: string, maxLength: 190 }
                port: { type: integer, enum: [25, 465, 587, 2525] }
                security: { type: string, enum: [tls, ssl], description: '`tls`: STARTTLS (587); `ssl`: implicit TLS (465).' }
                username: { type: string, maxLength: 190 }
                password: { type: [string, 'null'], maxLength: 300, description: 'The app password, not the mailbox''s own.' }
                imap_enabled: { type: boolean, default: true, description: 'Read the clients'' replies from the inbox every two minutes.' }
                imap_host: { type: [string, 'null'], maxLength: 190 }
            example: { provider: gmail, from_address: 'sara@example.com', from_name: 'سارة', host: smtp.gmail.com, port: 587, security: tls, username: 'sara@example.com', password: 'abcd efgh ijkl mnop', imap_enabled: true }
      responses:
        '200':
          description: Saved; the tests' results.
          content:
            application/json:
              schema:
                type: object
                required: [mailbox, test, imap]
                properties:
                  mailbox: { $ref: '#/components/schemas/Mailbox' }
                  test: { $ref: '#/components/schemas/MailTest' }
                  imap: { oneOf: [{ $ref: '#/components/schemas/MailTest' }, { type: 'null' }], description: 'Null when the replies are not read or the SMTP test failed.' }
        '422':
          description: Invalid fields; or the password left out for a new server, port or username.
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }
    delete:
      tags: [Mailbox]
      operationId: deleteMailbox
      summary: Delete the mailbox and its saved password
      responses:
        '204': { description: Deleted (or there was none). }
  /api/v1/account/mail/test:
    post:
      tags: [Mailbox]
      operationId: testMailbox
      summary: Send a test message to the mailbox's own address
      responses:
        '200':
          description: Whether it went, in words.
          content: { application/json: { schema: { $ref: '#/components/schemas/MailTest' } } }
        '404':
          description: No mailbox set up.
          content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } }
  /api/v1/account/mail/check:
    post:
      tags: [Mailbox]
      operationId: checkMailboxReplies
      summary: Read the clients' replies now
      description: The scheduler reads them every two minutes (`portal:fetch-replies`). Only replies to our emails from the client's own address are taken.
      responses:
        '200':
          description: How many replies were taken, or why the inbox could not be read.
          content:
            application/json:
              schema:
                type: object
                required: [ok, taken, message]
                properties:
                  ok: { type: boolean }
                  taken: { type: integer }
                  message: { type: [string, 'null'] }
        '404':
          description: No mailbox set up.
          content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } }

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: An API key made on the account page (`/account`); it has its account's permissions.
    session:
      type: apiKey
      in: cookie
      name: laravel_session
      description: The pages' session after signing in at `/login` (changes also need the `X-XSRF-TOKEN` header).
  parameters:
    JobId:
      name: id
      in: path
      required: true
      description: Run id (UUID) returned by `POST /api/v1/classify/jobs`.
      schema: { type: string, format: uuid }
      example: 9d3c7a1e-5b2f-4c8e-a0d1-2f6b8e4c1a90
    ImportId:
      name: id
      in: path
      required: true
      description: Import id returned by `POST /api/v1/classification-cache/import`.
      schema: { type: integer }
      example: 12
    CompanyId:
      name: id
      in: path
      required: true
      description: Company id (UUID) returned by `POST /api/v1/companies`.
      schema: { type: string }
      example: 3f2b8c1d-7a4e-4b9f-9c2d-1e5a6b7c8d90
    ReportId:
      name: id
      in: path
      required: true
      description: Report id (UUID) returned by `POST /api/v1/financial-reports`.
      schema: { type: string }
      example: 5a1c9e2f-3b4d-4e6f-8a7b-9c0d1e2f3a4b
    VersionNumber:
      name: version
      in: path
      required: true
      description: The version's number within the report.
      schema: { type: integer, minimum: 1 }
      example: 2
    ExportSource:
      name: source
      in: query
      schema: { type: string, enum: [ai, manual_correction, imported] }
    ExportFrom:
      name: from
      in: query
      description: Last update on or after this day.
      schema: { type: string, format: date }
    ExportTo:
      name: to
      in: query
      description: Last update on or before this day (≥ `from`).
      schema: { type: string, format: date }

  requestBodies:
    TrialBalanceFile:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
                description: |
                  Trial balance: `xlsx`, `xls` or `csv` (delimiter auto-detected), ≤ 10 MB. Any layout — header anywhere
                  in the first 30 non-empty rows, any language, columns in any order, number and name in one or two cells,
                  signed balances or debit/credit pairs, parent and total rows.
              company_id:
                type: string
                format: uuid
                description: 'Optional: the company the trial balance belongs to. Its code-group marks apply to the run, and a report made from the run starts with it.'
          encoding:
            file:
              contentType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel, text/csv

  responses:
    FileValidationError:
      description: File missing, not a file, wrong type, or larger than 10 MB.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
          example: { message: 'The file field is required.', errors: { file: ['The file field is required.'] } }
    RouteNotFound:
      description: 'No route matches: an unknown path, or a non-numeric id where the path needs a number (e.g. `/imports/abc`). Not the controller''s own 404.'
      content:
        application/json:
          schema:
            type: object
            required: [status, message]
            properties:
              status: { type: string, enum: [error] }
              message: { type: string }
          example: { status: error, message: Route not found }
    JobNotFound:
      description: Unknown run id.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
          example: { message: 'Classification job not found.' }
    ImportNotFound:
      description: Unknown import id.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
          example: { message: 'الاستيراد ده مش موجود.' }
    AiLimitReached:
      description: |
        The signed-in user's monthly AI limit (`users.ai_limit_usd`, set on the users page) is used up: nothing is started. The pages go to `page`
        (the «رصيد الذكاء الاصطناعي» page) on the `X-AI-Limit` header. Renews at the start of the month, or when the administrator raises it.
      headers:
        X-AI-Limit: { schema: { type: string, enum: ['1'] } }
      content:
        application/json:
          schema:
            type: object
            required: [message, code, page]
            properties:
              message: { type: string }
              code: { type: string, enum: [ai_limit_reached] }
              page: { type: string }
          example: { message: 'استُنفد حد الذكاء الاصطناعي الشهري لهذا المستخدم ($1.00؛ المستخدم $1.05). …', code: ai_limit_reached, page: /ai-limit }
    CompanyNotFound:
      description: Unknown company id.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
          example: { message: 'الشركة غير موجودة.' }
    ReportNotFound:
      description: Unknown report id.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
          example: { message: 'القوائم المالية هذه غير موجودة.' }
    ImportNotReviewable:
      description: The import is still reading / mapping, or failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
    ProviderError:
      description: |
        AI provider failure (the configured driver: Anthropic, Gemini or OpenAI). Transient errors (5xx, 408, 409, 429,
        timeouts) are retried first; fatal ones (every other 4xx: credit, key, rejected request; Gemini's used-up daily
        quota; a key not configured, detected before any call) are not. A fatal error gets the driver's own message when it
        has one, else `AI provider rejected the request: <provider error.message or "status N">`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
          examples:
            transient: { value: { message: 'AI provider error, please retry.' } }
            anthropicCredit: { value: { message: 'Anthropic API credit balance is too low. Add credits, then retry.' } }
            anthropicKey: { value: { message: 'Anthropic API key is invalid. Check ANTHROPIC_API_KEY.' } }
            geminiKey: { value: { message: 'Gemini API key is invalid. Check GEMINI_API_KEY.' } }
            missingKey: { value: { message: 'Gemini API key is missing. Set GEMINI_API_KEY in .env, then run php artisan queue:restart.' } }
            geminiDailyQuota: { value: { message: 'Gemini daily quota for gemini-3.8-flash is used up. It resets at midnight Pacific time; retry then, or raise the quota in Google AI Studio.' } }
            openaiKey: { value: { message: 'OpenAI API key is invalid. Check OPENAI_API_KEY.' } }
            openaiQuota: { value: { message: 'OpenAI credit or quota is used up. Add credit in the OpenAI dashboard, then retry.' } }
            geminiCredit: { value: { message: 'Gemini prepaid credit is used up. Add credit in Google AI Studio, then retry.' } }
            rejected: { value: { message: 'AI provider rejected the request: status 400' } }
    ServerError:
      description: Unexpected exception.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ServerError' }
          example: { status: error, message: 'SQLSTATE[HY000] ...' }

  schemas:
    AuditFindings:
      type: object
      required: [year, period_end, trial_balance, findings, counts]
      properties:
        year: { type: integer }
        period_end: { type: string, format: date }
        trial_balance:
          type: [object, 'null']
          description: 'The trial balance matched with: null when the client has none.'
          properties:
            run_id: { type: string }
            latest: { type: boolean, description: 'The client''s latest trial balance (no financial statements for the year).' }
        findings: { type: array, items: { $ref: '#/components/schemas/AuditFinding' } }
        counts:
          type: object
          properties:
            total: { type: integer }
            open: { type: integer }
            differences: { type: integer, description: 'Open differences.' }
    AuditFinding:
      type: object
      required: [key, source, type, severity, title, detail, account, amounts, entry, recommendation, status, comment]
      properties:
        key: { type: string, example: 'recalc-eosb' }
        source:
          type: object
          properties:
            type: { type: string, enum: [document, recalculation, working_paper] }
            id: { type: integer }
            name: { type: string, description: 'The file''s name, or the paper''s title.' }
            request: { type: [string, 'null'], description: 'The requirement the document answers.' }
        type: { type: string, enum: [balance_differs, other_date, account_not_found, no_trial_balance, document_issue, recalc_differs, missing_data, paper_difference] }
        severity: { type: string, enum: [difference, warning, info] }
        title: { type: string }
        detail: { type: string }
        account: { type: [string, 'null'], description: 'The trial balance account matched («number - name»).' }
        amounts:
          type: object
          properties:
            document: { type: [number, 'null'], description: 'Per the document, or recalculated.' }
            book: { type: [number, 'null'], description: 'Per the trial balance (the account''s natural side).' }
            difference: { type: [number, 'null'] }
        entry:
          type: [object, 'null']
          description: 'The adjusting entry the difference calls for, when the recalculation says which.'
          properties:
            debit: { type: string }
            credit: { type: string }
            amount: { type: number }
        recommendation: { type: string }
        status: { type: string, enum: [open, adjusted, accepted, dismissed] }
        comment: { type: [string, 'null'] }
    ZakatCandidates:
      type: object
      description: 'What each choice of `adopt` gives: the calculation, what the books book, the accountant''s own amount (null: none typed).'
      required: [calculated, booked, manual]
      properties:
        calculated: { type: number }
        booked: { type: number }
        manual: { type: [number, 'null'] }
    CacheEntry:
      type: object
      required: [id, original_name, normalized_key, account_code, budget_item, row_type, main_class, sub_class, source, confidence, taxonomy_version, in_use, hit_count, created_at, updated_at]
      properties:
        id: { type: integer }
        original_name: { type: string }
        normalized_key: { type: string }
        account_code: { type: [string, 'null'] }
        budget_item: { type: [string, 'null'] }
        row_type: { type: string, enum: [account, parent, total, section, other] }
        main_class: { type: [string, 'null'], description: 'From the current taxonomy by sub-class.' }
        sub_class: { type: [string, 'null'] }
        source: { type: string, enum: [ai, manual_correction, imported], description: '`imported`: from an applied accountant-labelled file (also reused by code + name when a row''s full key misses — row source `imported_code`). Side-pair classes are stored as the base class unless a manual correction is side-locked.' }
        side_locked: { type: boolean, description: 'A side-pair class chosen against the balance side by a manual correction: kept as it is, not re-decided by each row''s side.' }
        confidence: { type: integer }
        taxonomy_version: { type: string }
        in_use: { type: boolean, description: 'false when kept but ignored by the lookup (old version, low confidence, removed sub-class).' }
        hit_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CompanyInput:
      type: object
      description: 'Company profile fields. Saudi, under IFRS for SMEs, in SAR, only for now: `legal_form` is a company or a sole proprietorship; `country`, `framework`, `currency` take one value each.'
      properties:
        name_ar: { type: string, maxLength: 255 }
        name_en: { type: [string, 'null'], maxLength: 255 }
        legal_form: { type: string, enum: [llc, sole_proprietorship], default: llc, description: 'A company or a sole proprietorship (مؤسسة). Sent by the accountant, it is known from then on (profile.legal_form_source: user).' }
        country: { type: string, enum: [SA], default: SA }
        framework: { type: string, enum: [ifrs_for_smes], default: ifrs_for_smes }
        currency: { type: string, enum: [SAR], default: SAR }
        cr_number: { type: [string, 'null'], maxLength: 50, description: 'Commercial registration number.' }
        cr_date_hijri: { type: [string, 'null'], maxLength: 50, description: 'Stored exactly as entered; never converted.' }
        cr_date: { type: [string, 'null'], format: date, description: 'Gregorian CR date.' }
        unified_number: { type: [string, 'null'], maxLength: 50 }
        city: { type: [string, 'null'], maxLength: 255 }
        head_office: { type: [string, 'null'], maxLength: 255 }
        activity: { type: [string, 'null'], maxLength: 2000 }
        branches: { type: [array, 'null'], maxItems: 100, items: { type: string, maxLength: 255 } }
        fiscal_year_end_month: { type: integer, minimum: 1, maximum: 12, default: 12 }
        fiscal_year_end_day: { type: integer, minimum: 1, maximum: 31, default: 31, description: 'Must exist in the month (29 February allowed).' }

    Company:
      type: object
      required: [id, name_ar, name_en, legal_form, country, framework, cr_number, cr_date_hijri, cr_date, unified_number, city, head_office, activity, branches, fiscal_year_end_month, fiscal_year_end_day, currency, profile, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name_ar: { type: string }
        name_en: { type: [string, 'null'] }
        legal_form: { type: string }
        legal_form_known: { type: boolean, description: 'The legal form was read from the commercial registration or chosen by the accountant.' }
        articles_required: { type: [boolean, 'null'], description: 'A company has articles of association, a sole proprietorship none; null while the legal form is unknown (optional). Never stops the work.' }
        country: { type: string }
        framework: { type: string }
        cr_number: { type: [string, 'null'] }
        cr_date_hijri: { type: [string, 'null'] }
        cr_date: { type: [string, 'null'], format: date }
        unified_number: { type: [string, 'null'] }
        city: { type: [string, 'null'] }
        head_office: { type: [string, 'null'] }
        activity: { type: [string, 'null'] }
        branches: { type: array, items: { type: string } }
        fiscal_year_end_month: { type: integer }
        fiscal_year_end_day: { type: integer }
        period_start: { type: [string, 'null'], format: date, description: "The company's current fiscal period, from (set when the office makes or edits the client): the period its requests and its new reports start from." }
        period_end: { type: [string, 'null'], format: date }
        currency: { type: string }
        profile: { type: object, additionalProperties: true, description: 'Policy choices and useful lives carried between years; filled by later steps of the generator, read-only here.' }
        articles:
          type: [object, 'null']
          additionalProperties: true
          description: 'What was read from the articles of association (null without them): `partners` (name, nationality, group, shares, share_value, percentage, ownership), `capital`, `shares_total`, `share_value`, `zakat_share`, `name`, `read_at`.'
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }

    FinancialReportSummary:
      type: object
      required: [id, status, company_id, classification_run_id, template_version, period_start, period_end, comparative_start, comparative_end, last_computed_at, finalized_at, created_at, updated_at, status_url]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [draft, final] }
        company_id: { type: [string, 'null'], format: uuid }
        classification_run_id: { type: string, format: uuid }
        template_version: { type: string, example: sa-ifrs-smes-3 }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        comparative_start: { type: [string, 'null'], format: date, description: 'Null until the prior-year step; stays null in a first year.' }
        comparative_end: { type: [string, 'null'], format: date }
        last_computed_at: { type: [string, 'null'], format: date-time }
        finalized_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
        status_url: { type: string, example: /api/v1/financial-reports/5a1c9e2f-3b4d-4e6f-8a7b-9c0d1e2f3a4b }

    FinancialReportState:
      description: The summary, the company, what the run gives the statements, the four statements with their checks, the inputs, the movement schedules and suggestions, and the notes.
      allOf:
        - $ref: '#/components/schemas/FinancialReportSummary'
        - type: object
          required: [company, layout, mapping, statements, checks, missing, inputs, required_inputs, account_overrides, adjustments, schedules, suggestions, movement_decisions, notes, note_options, narrative, going_concern, comparative, run_changed, acknowledgements, can_finalize, blocking]
          properties:
            company: { oneOf: [{ $ref: '#/components/schemas/Company' }, { type: 'null' }] }
            layout: { $ref: '#/components/schemas/ReportLayout' }
            mapping: { $ref: '#/components/schemas/ReportMapping' }
            statements:
              type: object
              description: 'The four statements: the current year and, unless a first year, the comparatives.'
              required: [financial_position, comprehensive_income, changes_in_equity, cash_flows]
              properties:
                financial_position: { type: array, items: { $ref: '#/components/schemas/StatementRow' }, description: 'Lines positive on their own side (assets debit, equity and liabilities credit). Retained earnings include the year''s result when the trial balance is pre-closing (origin `derived`).' }
                comprehensive_income: { type: array, items: { $ref: '#/components/schemas/StatementRow' }, description: 'Up to net profit, as displayed: income +, expenses −. Every figure missing when the trial balance is post-closing.' }
                changes_in_equity: { $ref: '#/components/schemas/ChangesInEquity' }
                cash_flows: { type: array, items: { $ref: '#/components/schemas/StatementRow' }, description: 'Indirect method (`cf.*` lines), as displayed: inflows +, outflows −. The changes come from the balance sheet at the start of the year: missing without it (a closing-only trial balance with no prior source). Check 12 compares the closing cash with the balance sheet.' }
            checks: { type: array, items: { $ref: '#/components/schemas/ReportCheck' } }
            missing:
              type: array
              description: 'Figures that cannot be built (never shown as 0): `{key: comprehensive_income, reason: post_closing_tb}`, `{key: is.oci_total, reason: input_required, input_key: oci.has_items}`, a comparative statement `{key: comparative.financial_position | comparative.comprehensive_income, reason: prior_year_source_required | prior_year_incomplete}`, a movement-schedule cell `{key: ppe.additions.vehicles, reason: movement_required | suggestion_rejected}` (also `soce.*`, `cf.*`), the comparative changes in equity or cash flows `{key: comparative.changes_in_equity | comparative.cash_flows}`, the year''s cash flow without the balance sheet at its start `{key: cash_flows, reason: prior_year_source_required}`, or a side of an asset note `{key: ppe.accumulated, reason: category_split_required}`, a shown note with a figure or wording still missing `{key: notes.<note>, reason: note_incomplete}` (its prior-year figures: `prior_year_source_required | prior_year_incomplete`, when the comparative statements aren''t missing already), or the company''s details used by the notes `{key: notes.company, reason: company_required | company_profile_incomplete}`.'
              items:
                type: object
                required: [key, reason, input_key]
                properties:
                  key: { type: string }
                  reason: { type: string, enum: [post_closing_tb, input_required, prior_year_source_required, prior_year_incomplete, movement_required, suggestion_rejected, category_split_required, note_incomplete, company_required, company_profile_incomplete] }
                  input_key: { type: [string, 'null'], description: 'The intake field that fills it.' }
                  fields: { type: array, items: { type: string }, description: '`notes.company`: the company profile''s fields the notes still need (`name_ar`, `cr_number`, `cr_date_hijri`, `unified_number`, `city`, `head_office`, `activity`).' }
            inputs: { type: object, additionalProperties: true, description: 'The values entered (`PATCH …/inputs`), by intake key.' }
            comparative:
              type: object
              description: Where the comparatives come from (`PUT …/prior-year`). The period is the summary's `comparative_start` / `comparative_end`.
              required: [source, prior_report_id, prior_run_id, restated, restatement_note, figures, changes_in_equity, cash_flows, notes, schedules, entry]
              properties:
                source: { type: string, enum: [none, first_year, report, run, manual, statements] }
                prior_report_id: { type: [string, 'null'], format: uuid }
                prior_run_id: { type: [string, 'null'], format: uuid }
                restated: { type: boolean }
                restatement_note: { type: [string, 'null'] }
                opening_balances: { type: string, enum: [present, absent, unknown], description: 'Whether the trial balance shows balances from before the year (`opening_signal` says how it was decided); `unknown`: no signal either way.' }
                opening_signal: { type: [string, 'null'], enum: [opening_column, implied_opening, retained_earnings, accumulated_depreciation, null], description: 'What decided `opening_balances`: the opening column; closing − movements of the balance-sheet accounts (no opening column); retained earnings ≠ 0 in a trial balance before closing; accumulated depreciation and amortisation above this year''s charge. null: no signal either way (`unknown`).' }
                prior_needed: { type: boolean, description: 'Whether last year''s statements are needed: false only when there are no balances from before the year (`absent`; then the report is a first year unless the user gives a prior year).' }
                automatic: { type: boolean, description: 'The report is a first year because the trial balance has no opening balances and no prior year was chosen.' }
                skip_opening: { type: boolean, description: 'A first year chosen although the trial balance has opening balances (the user''s override).' }
                approved_opening:
                  type: object
                  description: 'Step B: this year''s openings from last year''s approved statements (`PUT …/prior-year/approved-opening`). `enabled`: the setting (default true). With last year''s statements in use from a file: `status` `applied` (the openings are the approved closing figures), `equal` (nothing differs), `no_opening` (the trial balance has no opening balances: the method can''t apply, this year''s figures are its closing balances; a warning says so), `off` (the setting off); null otherwise. `lines`: per balance-sheet line, the trial balance''s opening, the approved closing, the difference (trial balance − approved; `kind` equal, rounding or difference), the trial balance''s closing and the closing presented (approved + this year''s movement); `remainder`: what last year''s note doesn''t add up to its line, put on its largest line; `moved`: the accounts on this line this year and on another last year, or the other way (a comparability proposal not accepted): their difference follows them (`from` this year''s line, `to` last year''s, `amount` as last year''s line shows it); `moved_total`: their openings as this line shows them, added (moved here) or taken off (moved away) before comparing, so the closing presented = the trial balance''s − the difference − it − `rounding_kept`; `rounding_kept`: a difference under a riyal not applied to a line tied to an outside source (cash and banks, related parties, zakat payable, capital: its own amount kept), and on retained earnings their total (negative), which takes them. `reclassified`: the accounts the user moved to this line or away from it in the accounts step (`from` the classification''s line, `to` the line chosen, `opening` on the chosen line''s side): last year''s approved closing has them where they were then. A line the differences turn over or bring to nothing is a warning `approved_opening_sign` (with the same `reclassified` list). `totals`: assets, equity and liabilities, the same apart from the lines. `ppe`: per PPE category and side, the trial balance''s opening against the approved closing. `relations`: what the differences mean together (`code` `equation_tb`, `equation_approved` (assets − liabilities − equity of the opening balance sheet in the trial balance, in the approved statements), `differences_net`, `equity_other_than_retained`, `opening_cash`; `difference`, `ok`); `impact`: the lines and totals presented against the trial balance alone (`tb_closing`, `presented`, `effect`); `affects`: the statements and notes the differences reach (`financial_position`, `changes_in_equity`, `cash_flows`, `notes_ppe`). Absent from a version saved before they were added.'
                  required: [enabled, status]
                  properties:
                    enabled: { type: boolean }
                    status: { type: [string, 'null'], enum: [applied, equal, no_opening, 'off', null] }
                    applied: { type: boolean }
                    rows: { type: integer, description: 'The rows of the differences added (never accounts of the trial balance).' }
                    lines: { type: array, items: { type: object, required: [line, label, tb_opening, approved, difference, kind, tb_closing, presented], properties: { line: { type: string }, label: { type: string }, tb_opening: { type: [number, 'null'] }, approved: { type: [number, 'null'] }, difference: { type: [number, 'null'] }, kind: { type: [string, 'null'], enum: [equal, rounding, difference, null] }, tb_closing: { type: [number, 'null'] }, presented: { type: [number, 'null'] }, remainder: { type: [object, 'null'], properties: { amount: { type: number }, item: { type: string } } }, moved_total: { type: number }, rounding_kept: { type: number }, moved: { type: array, items: { type: object, required: [row, name, from, to, amount], properties: { row: { type: integer }, name: { type: string }, from: { type: string }, to: { type: string }, amount: { type: number } } } }, reclassified: { type: array, items: { type: object, required: [row, name, from, to, opening], properties: { row: { type: integer }, name: { type: string }, from: { type: string }, to: { type: string }, opening: { type: [number, 'null'] } } } } } } }
                    totals: { type: array, items: { type: object, required: [part, line, approved, tb_opening, difference, tb_closing, presented], properties: { part: { type: string, enum: [assets, equity, liabilities] }, line: { type: string }, approved: { type: [number, 'null'] }, tb_opening: { type: [number, 'null'] }, difference: { type: number }, tb_closing: { type: [number, 'null'] }, presented: { type: [number, 'null'] } } } }
                    ppe: { type: array, items: { type: object, required: [category, label, side, tb_opening, approved, difference, kind], properties: { category: { type: string }, label: { type: string }, side: { type: string, enum: [cost, accumulated] }, tb_opening: { type: number }, approved: { type: number }, difference: { type: number }, kind: { type: string, enum: [equal, rounding, difference] } } } }
                    relations: { type: array, items: { type: object, required: [code, difference, ok], properties: { code: { type: string, enum: [equation_tb, equation_approved, differences_net, equity_other_than_retained, opening_cash] }, difference: { type: [number, 'null'] }, ok: { type: boolean } } } }
                    impact: { type: array, items: { type: object, required: [line, label, tb_closing, presented, effect], properties: { line: { type: string }, label: { type: string }, tb_closing: { type: number }, presented: { type: number }, effect: { type: number } } } }
                    affects: { type: array, items: { type: string, enum: [financial_position, changes_in_equity, cash_flows, notes_ppe] } }
                figures: { type: object, additionalProperties: { type: number }, description: 'The figures entered for the prior year (manual; OCI items with a prior run), by line key.' }
                changes_in_equity: { type: object, additionalProperties: { type: object, additionalProperties: { type: number } }, description: 'The comparative changes in equity typed from last year''s issued statements (run / manual): row → column → amount.' }
                cash_flows: { type: object, additionalProperties: { type: number }, description: 'The comparative cash flow typed from last year''s issued statements (run / manual): `cf.*` line → amount.' }
                notes: { type: object, additionalProperties: { type: object, additionalProperties: { type: number } }, description: 'The notes'' item tables typed from last year''s notes (manual): note → class → amount.' }
                schedules: { type: object, additionalProperties: { type: number }, description: 'The movement tables typed from last year''s notes (run / manual): cell key → amount.' }
                upload:
                  type: [object, 'null']
                  description: 'A file of last year''s issued statements (PR 17): the one waiting for review (`in_use` false), else the one the `statements` source uses (`in_use` true, with the choices made on it); null when none. Rows are read by PHP (a PDF''s, from the tables the AI copied); nothing in it is used until confirmed with `PUT …/prior-year`. A PDF also has `status`, `pages_total`, `pages`, `found`, `error`, `cost_usd`, `equity`, and on each row `page`, `check` and `kind` (`heading`, `line` or `total`: a total by its arithmetic, R10, needs no line of its own). A row whose amount is nothing needs no line either. Always in the state; absent from a version saved before it was added.'
                  required: [name, uploaded_at, year, in_use, expenses_shown_positive, blocks, choices]
                  properties:
                    name: { type: string }
                    kind: { type: string, enum: [excel, pdf], description: 'Absent from a version saved before it was added.' }
                    status: { type: string, enum: [locating, pages, reading, ready, failed], description: 'A PDF: `locating` its statements'' pages (AI), `pages` found and waiting for the user (`PUT …/statements-file/pages`), `reading` the tables, `ready` to review, `failed` (see `error`).' }
                    pages_total: { type: integer, description: 'A PDF: its number of pages.' }
                    pages: { type: object, additionalProperties: { type: object, required: [from, to], properties: { from: { type: integer }, to: { type: integer } } }, description: 'A PDF: each statement''s pages, as found until the user confirms them, then as confirmed.' }
                    found: { type: object, additionalProperties: { type: object, required: [from, to], properties: { from: { type: integer }, to: { type: integer } } }, description: 'A PDF: the pages the AI found (empty: none found; the user gives them).' }
                    skipped: { type: object, additionalProperties: { type: object, required: [from, to], properties: { from: { type: integer }, to: { type: integer } } }, description: 'A PDF: the parts the AI found that are never read, by part (`auditor_report`: last year''s auditor''s report); a statement''s pages never take them in.' }
                    rejected: { type: [string, 'null'], description: 'A PDF: why it can''t stand as last year''s approved statements: no page of the independent auditor''s report among its pages'' kinds (the accountant''s rule). Its statements are not read (`PUT …/statements-file/pages` answers 422) nor used (`PUT …/prior-year` 422) until a page is marked `auditor_report`. Null otherwise.' }
                    page_kinds: { type: array, description: 'A PDF: what each page is (as the AI said, then as the user corrected it): `page`, `kind` (cover, contents, auditor_report, a statement, notes, other), `printed_page` (as printed, or null), `rotation` (degrees clockwise to read it upright) and `notes` (the notes starting on it: `number` as printed or null, `title`). Empty for a file uploaded before it was added.', items: { type: object } }
                    issues: { type: array, description: 'A PDF read: what the reading could not settle, each with its pages: `code` (check_unread, check_statement_total, check_balance, check_cash_roll, check_movement, check_equity_columns, check_note_tie: a check still failing after the page was read again; year_typo: a note headed with other years than the statements, read as theirs; year_in_text; note_number_slip; aligned_by_arithmetic: a statement''s amounts printed off their lines, placed by its arithmetic (the only placement that holds); alignment_several, alignment_none: not placeable; wording_differs: a term read two ways, one letter apart (both pages); wording_unknown: a term''s words found nowhere: not in the trial balance, the templates, the taxonomy nor the rest of the file; check_cross_equity_sofp, check_cross_profit_equity, check_cross_cash_sofp: the statements against each other; check_ppe_tie: the PPE note''s tables as one, cost − accumulated depreciation ≠ the balance sheet''s line; check_company_cr_date: the registration''s Hijri date not read; check_line_missing: a line the statement''s shape requires (gross profit where revenue and its cost are printed, a cash flow''s closing cash and its net change) not found; check_cf_net_change: the net change ≠ closing cash − opening cash, once the rows are placed (the page read once more first); equity_row_unplaced, equity_column_unplaced; corrected_misprint, corrected_reading_slip: a word corrected, with `correction`; total_misprint: a printed total differing from its columns'' sum, the sum tying to the statement line; total_columns_differ: the printed total tying to it; total_choice: neither or both, for the accountant to choose; each with `total`; total_group_ties, total_group_only, total_group_choose, total_group_unlinked, total_group_none: a year end''s balances chosen together among the combinations that agree, with `total_group`), `severity` (error, warning), `pages`, `message` (the request''s language). `correction`: the word as read (`original`), as output (`corrected`), and whether the accountant kept the original (`kept_original`; `PUT …/statements-file/wording`). `words`: a wording_unknown flag''s words, each to mark as right. `total`: the printed total and the columns'' sum, the one used (`printed` or `sum`) and whether the accountant chose it (`PUT …/statements-file/totals`). `total_group`: a year end''s balances: its options that agree (cost, accumulated, nbv, ties, text), the one used (index, null when none agrees), whether chosen.', items: { type: object, required: [code, severity, pages, message], properties: { code: { type: string }, severity: { type: string, enum: [error, warning] }, pages: { type: array, items: { type: integer } }, message: { type: string }, correction: { type: object, required: [id, original, corrected, kept_original], properties: { id: { type: string }, original: { type: string }, corrected: { type: string }, kept_original: { type: boolean } } }, words: { type: array, items: { type: string } }, total: { type: object, required: [id, printed, sum, used, chosen], properties: { id: { type: string }, printed: { type: number }, sum: { type: number }, used: { type: string, enum: [printed, sum] }, chosen: { type: boolean } } }, total_group: { type: object, required: [id, year, status, options, used, chosen], properties: { id: { type: string }, year: { type: integer }, status: { type: string, enum: [ties, only, choose, unlinked, none] }, options: { type: array, items: { type: object, properties: { cost: { type: number, nullable: true }, accumulated: { type: number, nullable: true }, nbv: { type: number, nullable: true }, ties: { type: boolean }, text: { type: string } } } }, used: { type: integer, nullable: true }, chosen: { type: boolean } } } } } }
                    equity: { type: [object, 'null'], description: 'A PDF read: last year''s changes in equity, for the comparative grid (prefilled in step 2, sent with `PUT …/prior-year` as `changes_in_equity`): `rows` (row → column → amount, as `changes_in_equity`), `closing` (column → amount), `year`, `pages`, and what could not be placed (`unplaced_rows`: label and page; `unplaced_columns`: headers). Null without the statement; absent from a version saved before it was added.' }
                    company: { type: object, description: 'A PDF read: the company as last year''s notes describe it (note 1, the approval note), each fact `{value, page}` by field: `name_ar`, `legal_form`, `cr_number`, `cr_date_hijri`, `city`, `activity`, `framework`, `approval.body`; a fact the text doesn''t state is absent. Step 2 offers them to the company''s empty fields. Absent from a version saved before it was added.', additionalProperties: { type: object, required: [value, page], properties: { value: { type: string }, page: { type: integer } } } }
                    company_identity: { type: object, required: [differs, matches], properties: { differs: { type: array, items: { type: object, required: [field, file, company, page], properties: { field: { type: string, enum: [name_ar, cr_number] }, file: { type: string }, company: { type: string }, page: { type: integer } } } }, matches: { type: array, items: { type: object, required: [id, name_ar, by], properties: { id: { type: string }, name_ar: { type: string }, by: { type: string, enum: [cr_number, name_ar] } } } } }, description: 'A PDF read: whether its company is the report''s. `differs`: the file''s name or commercial registration against the company''s profile (where both are given); `matches`: the app''s other companies with the file''s registration or name. Said only (a warning `company_differs_from_prior` while anything differs); the report''s company changes only by `PATCH /financial-reports/{id}`. Absent from a version saved before it was added.' }
                    comparable:
                      type: object
                      description: 'Accounts this year''s trial balance puts on another line than last year''s statements (by the opening check). `proposals`: per line short of last year''s figure, the accounts that explain it (named as or equal to one of last year''s note lines, `by` name or amount, or a few adding up to what is short, `sum`), each `{row, name, from, from_label, amount, by, item, amount_only}`; only when every line touched comes nearer last year. `amount_only`: matched by its amount alone (`by` amount or sum, the names differ), to be accepted on its own, never with everything; an account whose name or class is of another nature than the line it would go to (deferred revenue and a tax line, a receivable and a payable) is never matched by amount. `strays`: a line over last year''s figure whose accounts include exactly one set equal to it (`kept`): the others weren''t on it last year, with the lines still short (`targets`) to send them to. Accepted with `PUT …/account-overrides`. Absent from a version saved before it was added.'
                      required: [proposals, strays]
                      properties:
                        proposals: { type: array, items: { type: object } }
                        strays: { type: array, items: { type: object } }
                    opening_check: { type: array, description: 'This year''s opening balances (the trial balance''s opening columns) against the file''s closing figures, line by line on the balance sheet (lines placed exactly, or as the user chose when in use); empty without opening columns or a balance sheet in the file. Every difference is listed: `kind` `equal` (no riyal apart), `rounding` (less than `financial_statements.opening_tolerance` apart, 3 riyals by default: accepted, shown as accepted, never a warning nor a page read again) or `difference`. `pages`: a PDF''s pages of the line''s rows. Absent from a version saved before it was added.', items: { type: object, required: [line, label, opening, prior, difference, kind, pages], properties: { line: { type: string }, label: { type: string }, opening: { type: number }, prior: { type: number }, difference: { type: number }, kind: { type: string, enum: [equal, rounding, difference] }, pages: { type: array, items: { type: integer } } } } }
                    error: { type: [string, 'null'], description: 'A PDF that failed: why, in the request''s language.' }
                    cost_usd: { type: [number, 'null'], description: 'A PDF: what the AI calls cost so far (null: price unknown).' }
                    uploaded_at: { type: string, format: date-time }
                    year: { type: integer, description: 'The comparative year the year column was looked for by.' }
                    in_use: { type: boolean }
                    expenses_shown_positive: { type: [boolean, 'null'], description: 'Every expense of the income statement shown positive (true), negative (false), or no sign to go by (null).' }
                    blocks:
                      type: array
                      items:
                        type: object
                        required: [statement, sheet_name, columns, column, column_certain, rows]
                        properties:
                          statement: { type: string, enum: [financial_position, comprehensive_income, cash_flows] }
                          sheet_name: { type: string }
                          columns: { type: array, items: { type: object, required: [column, header, year], properties: { column: { type: string }, header: { type: string }, year: { type: [integer, 'null'] } } } }
                          column: { type: [string, 'null'], description: 'The prior year''s column: the one headed by the year, else the first (proposed).' }
                          column_certain: { type: boolean }
                          rows:
                            type: array
                            items:
                              type: object
                              required: [id, row, label, values, match, certainty]
                              properties:
                                id: { type: string }
                                row: { type: integer, description: 'Row number in the file''s sheet.' }
                                label: { type: string }
                                values: { type: object, additionalProperties: { type: object, required: [amount, raw, status], properties: { amount: { type: [number, 'null'] }, raw: { type: string }, status: { type: string, enum: [ok, unread, empty] } } }, description: 'Column letter → the cell as read.' }
                                match: { type: [string, 'null'], description: 'Proposed line or total key.' }
                                page: { type: [integer, 'null'], description: 'A PDF: the page of the file the row is on.' }
                                check: { type: array, description: 'A PDF: a total that doesn''t equal the rows the AI says it adds up, per amount column (a digit may be misread, or the file misprinted): look at the page.', items: { type: object, required: [column, sum, printed], properties: { column: { type: string }, sum: { type: number }, printed: { type: number } } } }
                                kind: { type: [string, 'null'], enum: [heading, line, total, null], description: 'A PDF: the row by its arithmetic (R10): a `total` is checked, never an item, and needs no line of its own. Absent from a version saved before it was added.' }
                                certainty: { type: string, enum: [exact, synonym, probable, none], description: '`exact`: the wording is the line''s; `synonym`: it is a synonym''s (`/statement-synonyms`); both are placed once the file is confirmed and may be changed. Others wait for the user. A file waiting for review is matched with the synonyms as they are now; one in use keeps its matches.' }
                    choices:
                      type: [object, 'null']
                      description: 'The choices the file is in use with (`PUT …/prior-year` fields); null while it waits.'
                      properties:
                        rows: { type: object, additionalProperties: { type: string } }
                        columns: { type: object, additionalProperties: { type: string } }
                        expenses_shown_positive: { type: [boolean, 'null'] }
                entry:
                  type: object
                  description: 'What `PUT …/prior-year` accepts as typed, as the report stands now (PR 13a; the wizard''s grids). Labels: the statements'' rows, `schedules`, `lang` names.'
                  required: [figures, changes_in_equity, cash_flows, notes, build_up, schedules]
                  properties:
                    figures: { type: array, items: { type: string }, description: 'Statement lines (manual).' }
                    changes_in_equity: { type: object, required: [rows, columns], properties: { rows: { type: array, items: { type: string } }, columns: { type: array, items: { type: string } } } }
                    cash_flows: { type: array, items: { type: string } }
                    notes: { type: object, additionalProperties: { type: array, items: { type: string } }, description: 'Item notes → this year''s classes (Arabic names); another class may be typed too (manual).' }
                    notes_prior: { type: object, additionalProperties: { type: object, required: [read_only, page, values], properties: { read_only: { type: boolean }, page: { type: [integer, 'null'] }, values: { type: object, additionalProperties: { type: number } } } }, description: 'Per note, last year''s figures it uses, by row: `read_only` when read from last year''s PDF (`page` its page; typing them changes nothing), else typed or from the approved statement line (to check or correct). A figure not known is left out.' }
                    build_up: { type: array, items: { type: string }, description: 'Parts of `notes.cost_of_revenue_build_up`.' }
                    schedules: { type: array, items: { type: string }, description: 'Movement-table cells (run / manual).' }
                    schedules_prior: { type: object, additionalProperties: { type: number }, description: 'Movement-table cells (keys of `schedules`) with last year''s figure in use now: typed, or last year''s PPE note read from a PDF. Shown in the grid; a cell shown is sent only when changed. Absent from a version saved before it was added.' }
                    ppe_from_pdf: { type: [object, 'null'], properties: { page: { type: [integer, 'null'] } }, description: 'Last year''s PPE movement read from the PDF by its own categories (`ppe_prior.categories[].last`) and used as the PPE note''s comparative: not typed (the `ppe.*` cells are shown read-only, with the page). Null otherwise, including when its categories can''t be told apart in this year''s (`ppe_columns_own`). Absent from a version saved before it was added.' }
                defaulted:
                  type: object
                  description: 'What the comparatives count as 0 because it was typed by hand (run / manual) and left empty (PR 13c), keyed as `PUT …/prior-year` takes it. A section with nothing typed is missing instead, never listed here. Empty lists for other sources. Always in the state; absent from a version saved before it was added.'
                  required: [figures, changes_in_equity, cash_flows, notes, schedules]
                  properties:
                    figures: { type: array, items: { type: string }, description: 'Statement lines (manual; OCI lines with a prior run).' }
                    changes_in_equity: { type: array, items: { type: object, required: [row, column], properties: { row: { type: string }, column: { type: string } } } }
                    cash_flows: { type: array, items: { type: string } }
                    notes: { type: object, additionalProperties: { type: array, items: { type: string } }, description: 'Note → this year''s classes not typed; `<note>_build_up` → build-up parts.' }
                    schedules: { type: array, items: { type: string }, description: 'Movement-table cells, as `entry.schedules`.' }
            required_inputs: { type: array, items: { type: string }, description: 'Required intake fields still empty.' }
            account_overrides: { type: array, items: { $ref: '#/components/schemas/AccountOverride' } }
            adjustments:
              type: array
              items:
                type: object
                required: [number, reason, lines]
                properties:
                  number: { type: integer }
                  reason: { type: string }
                  lines:
                    type: array
                    items:
                      type: object
                      required: [row, line_key, debit, credit]
                      properties:
                        row: { type: [integer, 'null'] }
                        line_key: { type: [string, 'null'] }
                        debit: { type: number }
                        credit: { type: number }
                        account_number: { type: [string, 'null'], description: 'A line on an account: its number (PR 14). Absent from versions saved before.' }
                        account_name: { type: [string, 'null'], description: 'A line on an account: its name (PR 14). Absent from versions saved before.' }
            schedules: { type: array, items: { $ref: '#/components/schemas/MovementSchedule' }, description: 'The notes'' movement tables with accounts or amounts (PR 9).' }
            suggestions: { type: array, items: { $ref: '#/components/schemas/MovementSuggestion' } }
            movement_decisions: { type: object, additionalProperties: { type: object, required: [action], properties: { action: { type: string, enum: [confirm, edit, reject] }, amount: { type: number } } }, description: 'The decisions on the movements, by cell key.' }
            notes: { type: array, items: { $ref: '#/components/schemas/Note' }, description: 'Every note of the template in order (PR 11): shown ones numbered 1…N, with their wording and tables; hidden ones with no blocks.' }
            note_options:
              type: object
              description: 'The user''s choices on the notes (`PATCH …/notes`).'
              required: [visibility, texts]
              properties:
                visibility: { type: object, additionalProperties: { type: string, enum: [on, off] } }
                texts: { type: object, additionalProperties: { type: object, required: [text, base], properties: { text: { type: string }, base: { type: string, description: 'The template''s wording it replaced.' } } } }
                items: { type: object, additionalProperties: { type: object, additionalProperties: { type: string } }, description: 'Note → account → line key or `new`. Absent from a version saved before it was added.' }
                ppe: { type: object, additionalProperties: { type: string }, description: 'Account row → last year''s PPE category key or `none`. Absent from a version saved before it was added.' }
            ppe_prior:
              type: [object, 'null']
              description: 'With last year''s statements confirmed from a PDF: the PPE note by last year''s categories (R13). `categories`: each `key`, `label` as printed (corrections applied), `rate` (%) and `life` (100 / rate, only when last year''s file says depreciation is straight-line; else null and a warning `useful_life_not_derived`) read from last year''s file, never typed: the policies note''s rates, or its table of useful lives in years (rate = 100 / years), or else implied by last year''s movement (the year''s depreciation over the cost, matched to one usual rate); `rate_source` (`printed`, `movement`, or null) says which, `method` (`straight_line`, `other`, or null: the depreciation method last year''s file states), `last` (last year''s cells by row: cost_opening, additions, disposals, cost_closing, acc_opening, depreciation, acc_disposals, acc_closing, nbv_closing, nbv_opening), `current` (this year''s, from the accounts placed on it; movements null without movement columns), `accounts` (how many), `own` (the note''s own category its accounts are in, or null), `opening_check` (per side: this year''s opening against last year''s closing; `kind` equal, rounding, difference). `accounts`: each PPE account''s `row`, `name`, `side` (cost, accumulated), `category` (key or null), `label`, `by` (choice, name, amount, words, none). `comparative`: last year''s cells by the note''s own categories (cell key → amount), the note''s comparative where nothing is typed. Null otherwise; absent from a version saved before it was added.'
            note_items:
              type: object
              description: 'With last year''s statements confirmed from a PDF: each note whose table is last year''s note (R11, R12, D3), by note key: the PDF note (`note` as printed, `title` corrected, `page`), its `items` (last year''s lines in order: `key`, `label` as printed with corrections, `prior` amount, `page`), and this year''s `accounts` (`ref`: row number or `adjustments`, `label`, `class`, `current`, `opening`, `item`: a line''s key or `new`, `by`: choice, name, amount, words or new). Absent from a version saved before it was added.'
              additionalProperties:
                type: object
                required: [note, title, page, items, accounts]
                properties:
                  note: { type: [string, 'null'] }
                  title: { type: string }
                  page: { type: integer }
                  items: { type: array, items: { type: object, required: [key, label, prior, page], properties: { key: { type: string }, label: { type: string }, prior: { type: number }, page: { type: integer } } } }
                  accounts: { type: array, items: { type: object, required: [ref, label, class, current, opening, item, by], properties: { ref: { type: string }, label: { type: string }, class: { type: string }, current: { type: number }, opening: { type: [number, 'null'] }, item: { type: string }, by: { type: string, enum: [choice, name, amount, words, new] } } } }
            narrative: { $ref: '#/components/schemas/Narrative' }
            going_concern:
              type: array
              description: 'Going-concern indicators hit this year (Q14): `net_loss`, `accumulated_losses` (half the capital or more; `capital`), `current_liabilities` (exceed current assets), `total_liabilities` (exceed total assets); the amount is the loss or the excess.'
              items: { type: object, required: [key, amount], properties: { key: { type: string, enum: [net_loss, accumulated_losses, current_liabilities, total_liabilities] }, amount: { type: number }, capital: { type: number } } }
            zakat_tax:
              type: object
              description: 'The year''s zakat and income tax (`PUT …/zakat-tax`): `inputs` (the answers with their defaults; `defaults`), `period` (`days` counted both ends, `hijri_days` 354), the groups `equity`, `non_current_liabilities`, `current_liabilities`, `non_current_assets` (`deducted` the total of the ones deducted, each row `deducted`), `current_assets` (rows `line`, `label`, `amount`; an equity row may say `before_charge` with `reported`, the figure the statements show, or `related`), `allocation`, `profit` (`before_charges`, `difference`, `adjusted`), `base`, `minimum`, `maximum`, `final_base` and `binding` (`base`, `minimum`, `maximum`, `none`), `zakat` (`rate`, `full`, `saudi_share`, `amount`), `income_tax` (`foreign_share`, `profit`, `loss_offset`, `taxable`, `rate`, `amount`), `charged` (what the statements charge now, and `zakat_source` / `tax_source`: `trial_balance`, `input`, `dialog` or null), `applied` (what the dialog took in), `can_apply` and `warnings`. Every group row also has `edited` (the accountant corrected it: `inputs.overrides`) and `computed` (the statements'' figure); `profit` has `before_charges_edited` and `before_charges_computed`. `adopt` (per charge: `auto`, `calculated`, `booked`, `manual`), `candidates` (per charge: `calculated`, `booked`, `manual` or null) and `in_statements` (per charge: what the statements carry).'
              required: [inputs, period, equity, base, minimum, maximum, final_base, binding, zakat, income_tax, charged, applied, can_apply, warnings]
              properties:
                inputs: { type: object }
                defaults: { type: object }
                period: { type: object }
                equity: { type: object }
                non_current_liabilities: { type: object }
                current_liabilities: { type: object }
                non_current_assets: { type: object }
                current_assets: { type: object }
                allocation: { type: object }
                profit: { type: object }
                base: { type: object }
                minimum: { type: object }
                maximum: { type: object }
                final_base: { type: number }
                binding: { type: string, enum: [base, minimum, maximum, none] }
                zakat: { type: object }
                income_tax: { type: object }
                charged: { type: object }
                saudi_share_from: { type: string, enum: [user, articles, default], description: 'Where the Saudi and Gulf owners'' share comes from: the accountant''s answer, the articles of association, or the default 100.' }
                applied: { type: object }
                can_apply: { type: object, properties: { zakat: { type: boolean }, income_tax: { type: boolean } } }
                warnings: { type: array, items: { type: string } }
                adopt:
                  type: object
                  properties:
                    zakat: { type: string, enum: [auto, calculated, booked, manual] }
                    income_tax: { type: string, enum: [auto, calculated, booked, manual] }
                candidates:
                  type: object
                  properties:
                    zakat: { $ref: '#/components/schemas/ZakatCandidates' }
                    income_tax: { $ref: '#/components/schemas/ZakatCandidates' }
                in_statements:
                  type: object
                  properties:
                    zakat: { type: number }
                    income_tax: { type: number }
            zakat_base:
              type: [object, 'null']
              description: 'With last year''s statements confirmed from a PDF: the zakat base as last year''s zakat note computed it (R11), its `note`, `title`, `page` and `rows` in order: `n`, `label` as printed (corrections applied), `kind` (line, total), last year''s `prior` amount, this year''s `current` figure and where it comes from (`from`: statements, schedules, input: the question `zakat.base.<n>`, total). Null otherwise; absent from a version saved before it was added.'
              properties:
                note: { type: [string, 'null'] }
                title: { type: string }
                page: { type: integer }
                rows: { type: array, items: { type: object, required: [n, label, kind, prior, current, from], properties: { n: { type: integer }, label: { type: string }, kind: { type: string, enum: [line, total] }, prior: { type: number }, current: { $ref: '#/components/schemas/Figure' }, from: { type: string, enum: [statements, schedules, input, derived, total] }, components: { type: array, items: { type: string }, description: 'A `derived` line: the components that explained last year''s figure, taken with this year''s.' }, label_by_sign: { type: boolean, description: 'Profit or loss in the label by the signs (last year''s words said otherwise).' } } } }
            run_changed: { type: boolean, description: "The run's result changed (a row corrected) after the report last took it in; check `run_changed` until acknowledged." }
            acknowledgements: { type: array, items: { $ref: '#/components/schemas/Acknowledgement' }, description: 'The warnings the user acknowledged (PR 12). One whose warning changed or went stays stored but matches nothing.' }
            can_finalize: { type: boolean, description: 'True when `blocking` is empty: a final version can be made (Q20).' }
            blocking: { type: array, items: { $ref: '#/components/schemas/FinalBlock' } }
            versions:
              type: object
              description: "The report's versions (PR 12). Always in the state; not in a version's payload."
              required: [count, latest, final]
              properties:
                count: { type: integer }
                latest: { oneOf: [{ $ref: '#/components/schemas/VersionRef' }, { type: 'null' }] }
                final: { oneOf: [{ $ref: '#/components/schemas/VersionRef' }, { type: 'null' }], description: 'The latest final version: the one in force.' }
            changed_since_final: { type: [boolean, 'null'], description: 'Null without a final version. True when what the statements and notes show (company, periods, statements, schedules, notes, narrative, going concern, comparatives) differs from the latest final: a new final would supersede it. Always in the state; not in a version''s payload.' }

    Note:
      type: object
      description: |
        One note (PR 11). `visibility`: `always` (no condition), `auto` (shown when a line is ≠ 0 in either year, or for its
        own reason), `forced_on` / `forced_off` (the user's). `references`: the statement lines whose «إيضاح» column shows
        `number`. `blocks`: the shown paragraphs (`text`) and tables (`table`) in template order; a missing value shows as
        «[ناقص]» and the note is in `missing`.
      required: [key, number, visible, visibility, title_ar, references, blocks]
      properties:
        key: { type: string, example: ppe }
        number: { type: [integer, 'null'] }
        visible: { type: boolean }
        visibility: { type: string, enum: [always, auto, forced_on, forced_off] }
        title_ar: { type: string }
        references: { type: array, items: { type: string } }
        blocks:
          type: array
          items:
            oneOf:
              - type: object
                required: [type, key, style, text_ar, template_ar, edited, outdated]
                properties:
                  type: { type: string, enum: [text] }
                  key: { type: string, example: incorporation.2, description: 'Paragraph key for `PATCH …/notes` `texts`.' }
                  style: { type: string, enum: [heading, item, text] }
                  number: { type: [string, 'null'], example: 5-1, description: 'A heading numbered under its note (`<note>-<n>`, counting the note''s shown headings); else null.' }
                  text_ar: { type: string, description: 'As shown: the user''s wording when edited.' }
                  template_ar: { type: string, description: 'The template''s wording, filled.' }
                  edited: { type: boolean }
                  outdated: { type: boolean, description: 'Edited, and the template''s wording changed since.' }
              - type: object
                required: [type, rows]
                properties:
                  type: { type: string, enum: [table] }
                  rows:
                    type: array
                    description: 'Cells right to left. A row whose amounts are 0 in both years is left out, and so is a column.'
                    items:
                      type: object
                      required: [cells]
                      properties:
                        cells: { type: array, items: { type: object, properties: { text_ar: { type: string }, amount: { $ref: '#/components/schemas/Figure' } } } }

    Narrative:
      type: object
      description: 'What fills the notes template (`notes.docx`) for the export (PR 15): blocks kept or dropped, every placeholder''s value, the item rows of the tables, the notes'' numbers.'
      required: [blocks, values, items, note_numbers, last_note_number]
      properties:
        blocks: { type: object, additionalProperties: { type: boolean } }
        values: { type: object, additionalProperties: true, description: 'Placeholder → text, a figure, null (missing) or false (its paragraph or table row is dropped).' }
        items: { type: object, additionalProperties: { type: array, items: { type: object, additionalProperties: true } }, description: 'The label placeholder of a repeated table row → one set of values per row.' }
        columns: { type: object, additionalProperties: { type: array, items: { type: object, additionalProperties: true } }, description: 'Phase 9. The header placeholder of a repeated table column (`ppe_category`: the PPE tables, one column per category, last year''s as printed or the note''s own) → one set of values per column. Each set''s values are also in `values`, numbered `<placeholder>__<n>` (from 1).' }
        note_numbers: { type: object, additionalProperties: { type: [integer, 'null'] } }
        last_note_number: { type: integer }

    Figure:
      type: object
      description: 'One figure and where it came from. A missing figure has `amount: null`, never 0.'
      required: [amount, origin, status, refs]
      properties:
        amount: { type: [number, 'null'] }
        origin: { type: string, enum: [trial_balance, trial_balance_opening, derived_from_movement, suggested_from_movement, derived, user_input, user_adjustment, prior_year_report, prior_year_trial_balance, prior_year_manual, prior_year_statements, missing] }
        status: { type: string, enum: [ok, pending_confirmation, missing, check_failed], description: '`pending_confirmation`: a row on the line waits for the user (a doubt, a confirm rule, a periodic-stock proposal).' }
        refs:
          type: array
          description: 'Rows of the run (`{type: row, row, share?}`), other lines (`{type: line, key}`), adjusting entries (`{type: adjustment, entry}`), inputs (`{type: input, key}`), the prior-year source (`{type: prior_report | prior_run, id}`; a file of issued statements: `{type: prior_file, sheet, row}`, PR 17), or a movement the user entered (`{type: decision, key}`).'
          items:
            type: object
            required: [type]
            properties:
              type: { type: string, enum: [row, line, adjustment, input, prior_report, prior_run, prior_file, decision] }
              id: { type: string, format: uuid }
              row: { type: integer }
              sheet: { type: string, description: '`prior_file`: the sheet''s name.' }
              share: { type: number }
              key: { type: string }
              entry: { type: integer }

    StatementSynonym:
      type: object
      required: [id, statement, line_key, line_label_ar, label, updated_at]
      properties:
        id: { type: integer }
        statement: { type: string, enum: [financial_position, comprehensive_income, cash_flows] }
        line_key: { type: string }
        line_label_ar: { type: string, description: 'The line''s or total''s name.' }
        label: { type: string, description: 'The wording, as the user typed it (spaces collapsed).' }
        updated_at: { type: [string, 'null'], format: date-time }

    StatementSynonymInput:
      type: object
      required: [line_key, label]
      properties:
        line_key: { type: string, description: 'A line or total of the financial position, comprehensive income or cash flows.' }
        label: { type: string, minLength: 2, maxLength: 255, description: 'The item as issued statements show it, in Arabic.' }

    StatementRow:
      type: object
      description: 'One row of a statement in template order: a heading, a line, or a total of the keys in `sum`.'
      required: [type, label_ar]
      properties:
        type: { type: string, enum: [heading, line, total] }
        label_ar: { type: string }
        input: { type: boolean, description: 'Lines: entered by the user (OCI), not mapped from accounts.' }
        key: { type: string, description: 'Line or total key (`sofp.*`, `is.*`); not on a heading.' }
        current: { $ref: '#/components/schemas/Figure' }
        comparative: { $ref: '#/components/schemas/Figure', description: 'The prior year, as displayed; absent in a first year (one column).' }
        rows: { type: array, items: { type: integer }, description: 'Lines: rows of the run on the line.' }
        check_codes: { type: array, items: { type: string }, description: 'Lines: codes of the checks about this line.' }
        label_by_sign: { type: boolean, description: 'The label says profit or loss by the figures'' sign (the template''s or last year''s words, `label_printed`, said otherwise). Absent when unchanged.' }
        label_printed: { type: string, description: 'With `label_by_sign`: the label before.' }
        label_set: { type: boolean, description: 'The row has a label of its own, not the template''s (an unexplained retained earnings movement). Absent otherwise.' }
        note: { type: [integer, 'null'], description: 'Balance sheet and income statement lines of a report: the number of the note about the line («إيضاح»), when shown (PR 11).' }
        sum: { type: array, items: { type: string }, description: 'Totals: the keys added up.' }
        shown:
          type: object
          description: 'Balance sheet and income statement lines and totals: the whole riyals shown (Q27), per year (`current`, and `comparative` unless a first year); null when missing. Each total is the sum of its parts shown; its rounding difference is put on one line under it (check `rounding_difference`, input `rounding.<total key>`).'
          properties:
            current: { type: [integer, 'null'] }
            comparative: { type: [integer, 'null'] }

    ReportCheck:
      type: object
      description: |
        A check of the report (plan §4.3). `error` blocks a final version, `warning` needs an acknowledgement, `info` is shown only.
        Codes so far: `tb_unbalanced` (per column group; `group`), `tb_partial`, `unclassified_rows`, `rows_need_review`,
        `unmapped_accounts`, `row_reconciliation`, `wrong_side_balance`, `post_closing_tb`, `pl_from_movements` (info), `sofp_unbalanced`, `net_income_mismatch`,
        `periodic_inventory_pair`, `empty_group` (`group`), `rounding_difference` (info, whole riyals: a total's rounding difference, put on the line `plugged_into` under it; the user may pick another with input `rounding.<total key>`),
        `rounding_over_limit` (error: a total's rounding difference above `financial_statements.rounding_limit`, put nowhere),
        `zakat_charge_missing` (profit and no zakat charge: enter it or confirm zero with a reason; `input_key`),
        `empty_required_input` (`input_key`; nothing suggested), `input_to_confirm` (warning: a required field showing a suggested answer not yet saved; `input_key`; never acknowledged: `PUT …/acknowledgements` refuses it, saving the answer clears it), `adjustment_unmapped_row` (an entry on an account with no line; `entry`),
        `opening_vs_prior_closing` (scope `comparative`: a line's opening ≠ the prior closing by 3 riyals or more (`financial_statements.opening_tolerance`; less is accepted and raises nothing); an error, a warning once restated).
        `prior_file_total` (scope `comparative`, error, PR 17): a total of an uploaded file of last year's statements ≠ the same total built from the
        file's lines; `file_row` {sheet, row} names it.
        `period_invalid` (check 22, `kind`: `length`, a period ≠ 12 months, a warning, in months; `comparative_gap`, the comparative
        period doesn't end the day before this one starts, an error; `approval_date`, the approval date (input `approval.date`) isn't
        after the period end, an error).
        `sofp_unbalanced`, `rounding_difference` and `rounding_over_limit` also run on the comparatives (scope `comparative`).
        `comparative_by_opening` (info): the trial balance has opening balances, so a `first_year` source is not applied (`comparative.source` is `none`).
        Movement schedules (PR 9; `schedule`): `asset_rollforward` (15: per category and side, `kind`; or the note's net book
        value vs the line, `kind: statement_line`), `depreciation_mismatch` (16, warning), `provision_rollforward` (17),
        `disposal_without_proceeds` (18: error until proceeds are entered, `input_key`; warning with `kind: gain_loss`),
        `split_total_mismatch` (19: the roll-forward when its movements are the user's split of a net change, with opening
        and closing columns only; or the loans' current portion above the long-term loans), `zakat_used_no_charge` (23,
        warning), `provision_without_pl_counterpart` (26b, warning), `reversal_as_payment` (26c, info).
        Changes in equity and cash flows (PR 10): `soce_closing_mismatch` (9, per column; `column`), `soce_opening_mismatch`
        (10: opening columns vs the prior closing; a warning once restated), `re_roll` (11), `cash_flow_closing_mismatch` (12),
        `cash_flow_opening_mismatch` (13; a warning once restated), `re_cleared_no_dividend` (24, warning),
        `retained_unexplained` (warning: retained earnings lost more than the result and the transfers with no dividend's other
        side; `amount`, `rows`, `input_key: soce.retained_movement`; gone once the user names it).
        Notes (PR 11; `note`): `note_total_mismatch` (14: a note table's total vs its line(s), both years; the related parties
        too), `capital_note_mismatch` (20: the partners' shares × share value vs the capital line), `going_concern_indicator`
        (25, warning, one per indicator; `indicator`), `same_party_multiple_accounts` (26e, info: a related party's or
        partner's name in more than one account; `name`, `rows`), `note_reference_missing` (27, warning: a line ≠ 0 whose note is
        hidden, or shown wording that refers to a hidden note; `paragraph`), `edited_text_outdated` (warning: an edited
        paragraph whose template wording changed since; `paragraph`); `provision_rollforward` also with scope `comparative`
        for the prior year's typed movements.
        Versions (PR 12): `run_changed` (warning: the run was corrected after the report last took it in; the statements are
        already built from the corrected run; acknowledging it takes the run as it is now; `run_result_hash`).
      required: [key, code, title_ar, severity, scope, line_key, rows, expected, actual, difference, message_ar, acknowledged]
      properties:
        key: { type: string, example: 'wrong_side_balance:3f9a0c1b2d4e5f60', description: 'The check''s identity (PR 12): its code and a hash of every field but the wording, amounts included. Acknowledge a warning by this key; when its amounts change, so does the key, and the warning needs a new acknowledgement.' }
        acknowledged: { type: boolean, description: 'Warnings: acknowledged by the user (`PUT …/acknowledgements`). Always false for errors and info.' }
        code: { type: string }
        title_ar: { type: string, description: 'The check''s Arabic name (lang/ar/statements.php). Show it, never the code.' }
        title: { type: string, description: 'The check''s name in the request''s language (`Accept-Language`); `title_ar` stays Arabic. Absent from a version saved before it was added.' }
        severity: { type: string, enum: [error, warning, info] }
        scope: { type: string, enum: [current, comparative] }
        line_key: { type: [string, 'null'] }
        rows: { type: array, items: { type: integer } }
        expected: { type: [number, 'null'] }
        actual: { type: [number, 'null'] }
        difference: { type: [number, 'null'] }
        message_ar: { type: string }
        message: { type: string, description: 'The message in the request''s language (`Accept-Language`; lang/{ar,en}/report_messages.php); `message_ar` stays Arabic. Statement content quoted in it (line labels, note titles, account names) stays Arabic. Absent from a version saved before it was added.' }
        group: { type: string, enum: [opening, period, adjustment, closing] }
        amount: { type: number, description: 'Unclassified or unmapped rows: the sum of their absolute closing balances.' }
        input_key: { type: string }
        suggested: { type: boolean, description: '`input_to_confirm`: true (a suggested answer shown, not yet saved); `empty_required_input`: false.' }
        method: { type: [string, 'null'], enum: [straight_line, other, null], description: '`useful_life_not_derived`: the depreciation method last year''s file states (null: none).' }
        differs: { type: array, description: '`company_differs_from_prior`: as `comparative.upload.company_identity.differs`.', items: { type: object } }
        matches: { type: array, description: '`company_differs_from_prior`: as `comparative.upload.company_identity.matches`.', items: { type: object } }
        reclassified: { type: array, description: '`approved_opening_sign`: the accounts moved to or from the line in the accounts step, as in `comparative.approved_opening.lines[].reclassified`.', items: { type: object } }
        entry: { type: integer }
        kind: { type: string, enum: [length, comparative_gap, approval_date, cost, accumulated, statement_line, gain_loss, revaluation], description: '`period_invalid`: which period check. `asset_rollforward` / `split_total_mismatch`: the side of the asset note (`cost`, `accumulated`) or its net book value vs the line (`statement_line`); `split_total_mismatch` `revaluation`: the categories'' revaluation ≠ the OCI surplus. `disposal_without_proceeds`: `gain_loss` when proceeds − net book value disposed ≠ the gains and losses on disposal.' }
        schedule: { type: string, description: 'Movement-schedule checks: the schedule key.' }
        column: { type: string, description: 'Asset notes: the category (or `total`). Changes in equity: the column.' }
        note: { type: string, description: 'Notes checks: the note key.' }
        indicator: { type: string, enum: [net_loss, accumulated_losses, current_liabilities, total_liabilities] }
        paragraph: { type: string, description: 'A paragraph key of the notes.' }
        name: { type: string, description: '`same_party_multiple_accounts`: the name found.' }
        run_result_hash: { type: [string, 'null'], description: '`run_changed`: the hash of the run''s result now.' }
        plugged_into: { type: string, description: '`rounding_difference`: the line that took the difference.' }
        file_row: { type: object, required: [type, sheet, row], properties: { type: { type: string, enum: [prior_file] }, sheet: { type: string }, row: { type: integer } }, description: '`prior_file_total`: the total''s row in the uploaded file of last year''s statements.' }

    Acknowledgement:
      type: object
      required: [key, note, acknowledged_at]
      properties:
        key: { type: string, description: 'A warning''s `key`.' }
        note: { type: [string, 'null'], maxLength: 500 }
        acknowledged_at: { type: string, format: date-time }

    FinalBlock:
      type: object
      description: |
        What stops a final version (Q20): `errors` (error checks), `warnings_unacknowledged`, `missing` (every item of
        `missing`: a final never shows «[ناقص]»), `pending_suggestions` (movement suggestions not decided),
        `pending_mappings` (rows whose mapping waits for the user, e.g. a periodic-inventory proposal). Only reasons with a
        count above 0 are listed.
      required: [reason, label_ar, count]
      properties:
        reason: { type: string, enum: [errors, warnings_unacknowledged, missing, pending_suggestions, pending_mappings] }
        label_ar: { type: string }
        count: { type: integer, minimum: 1 }
        label: { type: string, description: 'The reason''s name in the request''s language (`Accept-Language`); `label_ar` stays Arabic. Absent from a version saved before it was added.' }

    VersionRef:
      type: object
      required: [version, kind, created_at]
      properties:
        version: { type: integer }
        kind: { type: string, enum: [draft, final] }
        created_at: { type: [string, 'null'], format: date-time }

    ReportVersionSummary:
      type: object
      required: [report_id, version, kind, superseded_by, created_at, inputs_hash, run_result_hash, content_hash]
      properties:
        report_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1, description: 'Numbered 1, 2, … per report, drafts and finals together.' }
        kind: { type: string, enum: [draft, final] }
        superseded_by: { type: [integer, 'null'], description: 'Finals: the later final that superseded this one (Q19). Null for the final in force and for drafts.' }
        created_at: { type: [string, 'null'], format: date-time }
        inputs_hash: { type: string, description: 'sha1 of the report''s own data (inputs, overrides, entries, decisions, notes choices, acknowledgements, prior year, periods, company).' }
        run_result_hash: { type: string, description: 'sha1 of the run''s result the version was built from.' }
        content_hash: { type: string, description: 'sha1 of what the statements and notes show; `changed_since_final` compares it.' }

    ReportVersion:
      description: A version with its payload. Never changes once made.
      allOf:
        - $ref: '#/components/schemas/ReportVersionSummary'
        - type: object
          required: [payload]
          properties:
            payload:
              description: 'The report''s state when the version was made (plan §4.4), with `report_id`, `version` and `kind`. A final''s `status` is `final`. Exports (PR 14–16) are made from it.'
              allOf:
                - $ref: '#/components/schemas/FinancialReportState'
                - type: object
                  required: [report_id, version, kind]
                  properties:
                    report_id: { type: string, format: uuid }
                    version: { type: integer }
                    kind: { type: string, enum: [draft, final] }

    FinalBlocked:
      type: object
      required: [message, checks, blocking]
      properties:
        message: { type: string, example: 'مينفعش تتعمل نسخة نهائية: أخطاء لازم تتصلح (2)، أرقام ناقصة (3).' }
        checks: { type: array, items: { $ref: '#/components/schemas/ReportCheck' }, description: 'The errors and the warnings not acknowledged.' }
        blocking: { type: array, items: { $ref: '#/components/schemas/FinalBlock' }, minItems: 1 }

    AccountOverride:
      type: object
      description: |
        At least one of: a line (`line_key`, or `shares`: two or more lines, each share between 0 and 1, adding up to 1; not
        both), a note `category` (asset notes: a category of the note of the line the row is on, e.g. `vehicles`; Q8), and
        `tags`: `deferred_finance_cost` nets the row against the loans (on the long-term loans line unless a line is given;
        Q36), `provision_charge` makes it the P&L counterpart of the other provisions, `not_disposal` keeps a gain or loss on
        disposal as other income or expenses, out of the cash flow's disposal adjustment (check `disposal_pending` until confirmed).
        Or `exclude: true` with a `reason` (3–500 characters, required) and nothing else: the row is left out of the statements and of
        the trial balance's check (a parent counted twice, …); `mapping.excluded` lists it with `reason: user`.
      required: [row]
      properties:
        row: { type: integer, minimum: 1 }
        line_key: { type: string, example: is.cost_of_revenue }
        shares: { type: object, additionalProperties: { type: number }, example: { is.cost_of_revenue: 0.6, is.general_admin: 0.4 } }
        category: { type: string, example: vehicles }
        tags: { type: array, items: { type: string, enum: [deferred_finance_cost, provision_charge, not_disposal] } }
        exclude: { type: boolean, enum: [true], description: 'Leave the row out of the statements.' }
        reason: { type: string, minLength: 3, maxLength: 500, description: 'Why it is left out (required with `exclude`).', example: 'حساب تجميعي رصيده بيساوي الحساب اللي تحته' }

    ChangesInEquity:
      type: object
      description: |
        Statement of changes in equity (PR 10). Columns: `share_capital`, `unpaid_capital` (0: the share capital line is net),
        `statutory_reserve`, `other_reserves` (takes OCI), `retained_earnings`, `partners_current` (only when presented in
        equity, Q23), then `total` (unpaid capital subtracted). Rows: `opening`, `net_profit`, `oci`,
        `total_comprehensive_income`, `capital_increase`, `transfer_to_reserve`, `dividends`, `prior_year_adjustments`,
        `other_retained_movements`, `transfer_to_partners_current`, `partners_current_movements`, `closing` (opening + the rest;
        checks 9 and 11 compare it with the balance sheet).
        The movements are suggestions with keys `soce.<row>` (`POST …/suggestions`). What retained earnings lose besides the
        result and the transfers (suggestion `soce.dividends`) goes on the row the input `soce.retained_movement` names
        (`dividends` | `prior_year_adjustment` | `other`); unnamed, it is a dividend only when dividends payable or the
        partners' current accounts were credited as much, else `other_retained_movements` with `label_set: true` and the
        label «حركة غير مفسرة في الأرباح المبقاة» (check `retained_unexplained`). In the cash flow a dividend is
        `cf.dividends_paid` (financing); the others are the non-cash `cf.prior_year_adjustments` / `cf.other_retained_movements` (operating).
      required: [columns, current, comparative]
      properties:
        columns: { type: array, items: { type: object, required: [key, label_ar, line_key], properties: { key: { type: string }, label_ar: { type: string }, line_key: { type: [string, 'null'] } } } }
        current: { type: array, items: { $ref: '#/components/schemas/EquityRow' } }
        comparative: { type: [array, 'null'], items: { $ref: '#/components/schemas/EquityRow' }, description: 'The prior year: from a prior report, or typed from last year''s issued statements (`PUT …/prior-year`); every cell missing otherwise; null in a first year.' }

    EquityRow:
      type: object
      required: [key, label_ar, cells]
      properties:
        key: { type: string }
        label_ar: { type: string }
        cells: { type: object, additionalProperties: { $ref: '#/components/schemas/Figure' }, description: 'Column key → figure, as displayed (an increase of the column +).' }
        label_by_sign: { type: boolean, description: 'The label says profit or loss by the figures'' sign (the template''s or last year''s words, `label_printed`, said otherwise). Absent when unchanged.' }
        label_printed: { type: string, description: 'With `label_by_sign`: the label before.' }
        label_set: { type: boolean, description: 'The row has a label of its own, not the template''s (an unexplained retained earnings movement). Absent otherwise.' }
        shown: { type: object, additionalProperties: { type: [integer, 'null'] }, description: 'Column key → whole riyals as printed (Q27): the closing row the balance sheet''s lines as shown, the opening last year''s, the profit the income statement''s; a column''s riyal left over on its largest other movement; `total` adds up the others. Null where the figure is missing. Absent from a version saved before it was added.' }

    MovementSchedule:
      type: object
      description: |
        A note's movement table (PR 9). `asset` (PPE, intangible assets, investment property): columns are the categories
        with accounts, then `total`; rows `cost_opening`, `additions`, `transfers` (PPE: CWIP out, negative; in, positive), `revaluation` (PPE, when OCI has a revaluation surplus; non-cash),
        `disposals`, `cost_closing`, `acc_opening`, `depreciation`, `acc_disposals`, `acc_closing`, `nbv_closing`,
        `nbv_opening` (the comparative); amounts positive, disposals subtracted. A side whose accounts are not all in a
        category (`split` false) has its category cells missing, only the total. `provision` (`employee_benefits`, `zakat`,
        `other_provisions`, `receivables_impairment`, `dividends_payable`): one column `amount`; rows `opening`, the increase
        (`charge` / `declared`), `prior_year_adjustments` (zakat), the decrease (`paid` / `used` / `written_off`), `reversal`,
        `closing`. `loans` (Q36): columns `current`, `comparative` (none in a first year); rows `gross`,
        `deferred_finance_cost`, `net`, `non_current`, `current`.
      required: [key, kind, title_ar, line_key, columns, rows]
      properties:
        key: { type: string, enum: [ppe, intangible_assets, investment_property, employee_benefits, zakat, other_provisions, receivables_impairment, dividends_payable, loans] }
        kind: { type: string, enum: [asset, provision, loans] }
        title_ar: { type: string }
        line_key: { type: [string, 'null'], description: 'The statement line (null for the loans note and the impairment of receivables, which sits in trade receivables).' }
        columns: { type: array, items: { type: object, required: [key, label_ar], properties: { key: { type: string }, label_ar: { type: string } } } }
        rows:
          type: array
          items:
            type: object
            required: [key, label_ar, cells]
            properties:
              key: { type: string }
              label_ar: { type: string }
              cells: { type: object, additionalProperties: { $ref: '#/components/schemas/Figure' }, description: 'Column key → figure.' }
        split: { type: object, properties: { cost: { type: boolean }, accumulated: { type: boolean } }, description: '`asset` only.' }
        category_options:
          type: array
          description: '`asset` only: every category of the note, for giving an account one (`columns` holds only the categories in use).'
          items: { type: object, properties: { key: { type: string }, label_ar: { type: string } } }
        increase: { type: string, description: '`provision` only: the row key of the increase.' }
        decrease: { type: string, description: '`provision` only: the row key of the decrease.' }

    MovementSuggestion:
      type: object
      description: 'A movement read from the movement columns, to confirm, edit or reject (`POST …/suggestions`). Nothing moved (0) is not a suggestion.'
      required: [key, schedule, row, column, label_ar, amount, basis_ar, rows, status, value]
      properties:
        key: { type: string, example: ppe.additions.vehicles }
        schedule: { type: string }
        row: { type: string }
        column: { type: string }
        label_ar: { type: string }
        amount: { type: number, description: 'Suggested.' }
        basis_ar: { type: string }
        basis: { type: string, description: 'Where the amount comes from, in the request''s language (`Accept-Language`); `basis_ar` stays Arabic. Account names quoted in it stay as in the file. Absent from a version saved before it was added.' }
        rows: { type: array, items: { type: integer } }
        status: { type: string, enum: [pending, confirmed, edited, rejected] }
        value: { type: [number, 'null'], description: 'The amount the user entered when `edited`.' }

    IntakeField:
      type: object
      required: [key, type, required, label_ar, help_ar, options, option_labels, default, check, source, value]
      properties:
        key: { type: string, example: zakat.charge }
        type: { type: string, enum: [choice, choices, number, boolean, text, date, table], description: '`date`: Gregorian, `YYYY-MM-DD`. Number fields `<schedule>.disposal_proceeds`, `loans.current_portion` and `supplier_finance.*` amounts are 0 or more. `text`: 3–500 characters (narrative answers `events.*`, `first_application.*`, `going_concern.*`, `other_provisions.*`, `supplier_finance.terms`: up to 2000; `useful_life.*`: 1–20). `choices`: a list of one or more options. `table`: a list of rows (objects) with the `columns`.' }
        required: { type: boolean }
        label_ar: { type: string }
        help_ar: { type: string }
        label: { type: string, description: 'The question in the request''s language (`Accept-Language`); `label_ar` stays Arabic. A statement line''s name in it stays Arabic.' }
        help: { type: string, description: 'The help in the request''s language (`Accept-Language`); `help_ar` stays Arabic.' }
        options: { type: [array, 'null'], items: { type: string }, description: '`choice` / `choices` only.' }
        option_labels: { type: [object, 'null'], additionalProperties: { type: string }, description: '`choice` / `choices` only: option → its Arabic name.' }
        default: { type: [string, boolean, number, array, 'null'], description: 'Used while an optional field is empty (`choice`; `cash_flow.overdraft_in_cash`: false), or offered for a required one (the prior report''s answer; `related_parties`: the proposed parties, one per related-party account). A required field needs a value.' }
        columns:
          type: array
          description: '`table` only: its columns. `rows`: row numbers of the run.'
          items: { type: object, required: [key, type, required, label_ar], properties: { key: { type: string }, type: { type: string, enum: [text, number, rows] }, required: { type: boolean }, label_ar: { type: string }, label: { type: string, description: 'In the request''s language (`Accept-Language`); `label_ar` stays Arabic.' } } }
        check: { type: [string, 'null'], description: 'The check that reports this field empty, when it has its own (e.g. `zakat_charge_missing`); otherwise `empty_required_input`.' }
        source: { type: string, enum: [user_input] }
        value: { description: 'The current value, or null.' }

    ReportLayout:
      type: object
      description: What the trial balance can give the statements. Only the column groups the file really has count.
      required: [groups, layout, closing_derived, empty_groups, families, partial_tb, unclassified, needs_review, post_closing]
      properties:
        groups: { type: array, items: { type: string, enum: [opening, period, adjustment, closing] }, description: 'The real column groups.' }
        layout: { type: string, enum: [C, OC, OMC], description: 'C = closing only; OC = opening + closing; OMC = opening + movement (+ adjustments) + closing.' }
        closing_derived: { type: boolean, description: 'No closing columns: closing is opening + movement (+ adjustments).' }
        empty_groups: { type: array, items: { type: string }, description: 'Real groups whose amounts are all zero.' }
        families: { type: array, items: { type: string }, description: 'Statement families present (أصول، التزامات، حقوق الملكية، إيرادات، مصروفات).' }
        partial_tb: { type: boolean, description: 'Fewer than the five families: a partial trial balance.' }
        unclassified: { type: integer }
        needs_review: { type: integer }
        post_closing: { type: boolean, description: 'Every income-statement account is zero: the trial balance looks post-closing, and its movements don''t give the P&L (error `post_closing_tb`).' }
        pl_from_movements: { type: boolean, description: 'Post-closing, but the P&L is the accounts'' net movement: their closing balances are zero while their movements aren''t, and retained earnings'' credit movement (a profit) or debit movement (a loss), or their closing gap (closing − opening − movements) on that side, in all their accounts or the current-year profit account alone, equals that net exactly (Q22, info `pl_from_movements`). Absent from a version saved before it was added.' }

    ReportMapping:
      type: object
      description: How the run's rows map to statement lines (rules in `config/financial_statements.php`).
      required: [mapped, unmapped, excluded, proposals]
      properties:
        mapped: { type: integer, description: 'Rows mapped to a line.' }
        unmapped:
          type: array
          description: 'Rows with no line: unclassified, no rule, or a choice for the user (`candidates`). One with a balance blocks a final version.'
          items:
            type: object
            required: [row, reason, candidates, account_number, account_name]
            properties:
              row: { type: integer, description: 'Excel row.' }
              reason: { type: string, enum: [unclassified, no_rule, choose] }
              candidates: { type: array, items: { type: string }, description: 'Line keys to choose from (`choose`).' }
              message: { type: string, description: 'Why a choice is needed (Arabic; `choose` only).' }
              message_text: { type: string, description: "`message` in the request's language (`choose` only)." }
              account_number: { type: [string, 'null'] }
              account_name: { type: [string, 'null'] }
        excluded:
          type: array
          description: 'Rows left out of every line: a parent whose accounts are already counted (`possible_parent`: its number and balance; `parent_level`: the file''s levels), or the user''s exclusion (`user`, with its `note` and the line the classification gives it, `original`).'
          items:
            type: object
            required: [row, reason, account_number, account_name]
            properties:
              row: { type: integer }
              reason: { type: string, enum: [possible_parent, parent_level, user] }
              note: { type: string, description: '`user`: the reason given.' }
              original:
                type: object
                required: [lines, reason]
                properties:
                  lines: { oneOf: [{ type: object, additionalProperties: { type: number } }, { type: 'null' }] }
                  reason: { type: [string, 'null'] }
              account_number: { type: [string, 'null'] }
              account_name: { type: [string, 'null'] }
        proposals:
          type: array
          description: 'Re-mappings the checks propose and never apply: periodic opening or closing stock labelled as inventory (check 26a). The row stays on its line, pending.'
          items:
            type: object
            required: [code, kind, row, matches, amount, current_line, proposed_line, basis, status, message]
            properties:
              code: { type: string, enum: [periodic_inventory_pair] }
              kind: { type: string, enum: [opening_stock, closing_stock] }
              row: { type: integer }
              matches: { type: array, items: { type: integer }, description: 'Rows of the stock account(s) it matches.' }
              amount: { type: number }
              current_line: { type: string }
              proposed_line: { type: string }
              basis: { type: string, description: 'What matched (a balance, a movement, or the total of several accounts).' }
              status: { type: string, enum: [pending] }
              message: { type: string, description: 'Arabic.' }
        line_totals:
          type: object
          description: 'Each statement line''s accounts from the trial balance, before the report''s adjusting entries, signed as the statement shows the line (D1: the accounts step shows them adding up to the line). Absent from a version saved before it was added.'
          additionalProperties:
            type: object
            required: [amount, accounts]
            properties:
              amount: { type: number }
              accounts: { type: integer, description: 'How many accounts are on the line.' }
              approved_opening: { type: number, description: 'With approved openings applied (`comparative.approved_opening`): the part of the line that is last year''s approved closing less the trial balance''s opening (presented − trial balance). Absent when none.' }
        parent_proposals:
          type: array
          description: 'Probable parents (data flag `probable_parent`): rows whose balances are the sum of the rows right below them and that explain why the file doesn''t add up. Each stays counted on `current_line`, pending (it blocks a final), until the user excludes it (`exclude` override) or keeps it (a line override). Always in the state; absent from a version saved before it was added.'
          items:
            type: object
            required: [row, rows, current_line, message, account_number, account_name]
            properties:
              row: { type: integer }
              rows: { type: array, items: { type: integer }, description: 'The Excel rows its balances add up.' }
              current_line: { type: string }
              message: { type: string, description: 'Arabic.' }
              message_text: { type: string, description: "`message` in the request's language; a run classified before this field: the Arabic." }
              account_number: { type: [string, 'null'] }
              account_name: { type: [string, 'null'] }
        overridden:
          type: array
          description: 'Rows the user moved (PR 13c): a line or shares (`PUT …/account-overrides`), or the loans'' contra tag. `lines` is where the row is now, `original` where the classification alone puts it (`lines` null with the `reason` it has no line). Always in the state; absent from a version saved before it was added.'
          items:
            type: object
            required: [row, lines, original, account_number, account_name]
            properties:
              row: { type: integer }
              lines: { type: object, additionalProperties: { type: number }, description: 'Line key → share (1 for one line).' }
              original:
                type: object
                required: [lines, reason]
                properties:
                  lines: { oneOf: [{ type: object, additionalProperties: { type: number } }, { type: 'null' }] }
                  reason: { type: [string, 'null'], enum: [unclassified, no_rule, choose, possible_parent, null] }
              account_number: { type: [string, 'null'] }
              account_name: { type: [string, 'null'] }

    Paginated:
      type: object
      description: Laravel's length-aware paginator envelope (`data` is set per endpoint).
      required: [current_page, from, to, per_page, total, last_page, first_page_url, last_page_url, next_page_url, prev_page_url, path, links]
      properties:
        current_page: { type: integer }
        from: { type: [integer, 'null'] }
        to: { type: [integer, 'null'] }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }
        first_page_url: { type: string }
        last_page_url: { type: string }
        next_page_url: { type: [string, 'null'] }
        prev_page_url: { type: [string, 'null'] }
        path: { type: string }
        links:
          type: array
          items:
            type: object
            required: [url, label, active]
            properties:
              url: { type: [string, 'null'] }
              label: { type: string }
              page: { type: [integer, 'null'] }
              active: { type: boolean }
    ImportSummary:
      type: object
      required: [id, file_name, status, stage, progress, error, error_text, rows, provider, model, created_at, applied_at, status_url, review_url]
      properties:
        id: { type: integer }
        file_name: { type: string }
        status:
          type: string
          enum: [queued, running, pending_review, applied, failed]
          description: '`queued` / `running` without progress for 15 min shows as `failed` (worker died).'
        stage: { type: [string, 'null'], enum: [reading, budget, notes, null], description: 'Step while `running`.' }
        progress:
          type: object
          description: AI batches during `notes`; `0/0` before. The last counts stay after it (`pending_review`, `applied`, `failed`).
          required: [done, total]
          properties:
            done: { type: integer }
            total: { type: integer }
        error: { type: [string, 'null'], description: Arabic failure message. }
        error_text: { type: [string, 'null'], description: "`error` in the request's language; an import that failed before this field: the stored text." }
        rows: { oneOf: [{ $ref: '#/components/schemas/ImportRowCounts' }, { type: 'null' }], description: '`report.rows`; null until mapped.' }
        provider:
          type: [string, 'null']
          description: AI provider the mapping asked (`anthropic` | `gemini` | `openai`); `null` when no value needed the AI (or not mapped yet).
          example: anthropic
        model: { type: [string, 'null'], description: AI model the mapping asked; `null` like `provider`., example: claude-haiku-4-5 }
        created_at: { type: [string, 'null'], format: date-time }
        applied_at: { type: [string, 'null'], format: date-time }
        status_url: { type: string, example: /api/v1/classification-cache/imports/12 }
        review_url: { type: string, example: /classification-cache/imports/12/review, description: Web review page. }

    ImportReport:
      type: object
      description: Rebuilt after every review change and apply. Labels and messages are Arabic; each `*_text` beside one is the same in the request's language.
      required: [import_id, status, file_name, rows, skipped]
      properties:
        import_id: { type: integer }
        status: { type: string }
        file_name: { type: string }
        rows: { $ref: '#/components/schemas/ImportRowCounts' }
        skipped:
          type: object
          description: 'Skip reason (`header_row`, `empty_name`, `empty_budget`, `budget_not_arabic`, `budget_skipped`, `budget_unmapped`, `note_unmapped`, `no_side`, `key_conflict`, `cache_has_entry`) → rows.'
          additionalProperties:
            type: object
            properties:
              label: { type: string }
              label_text: { type: string, description: "`label` in the request's language." }
              rows: { type: integer }
              examples: { type: array, maxItems: 5, items: { type: object, properties: { row: { type: integer }, company: { type: [string, 'null'] }, account_name: { type: [string, 'null'] }, budget_value: { type: [string, 'null'] }, note_value: { type: [string, 'null'] } } } }
        budget_mapping:
          type: object
          properties:
            distinct_values: { type: integer }
            distinct_normalized: { type: integer }
            by_method: { type: object, additionalProperties: { type: integer } }
            by_decision: { type: object, additionalProperties: { type: integer } }
            values:
              type: array
              description: Every distinct الميزانية value as written, most rows first.
              items: { type: object, properties: { value: { type: string }, rows: { type: integer }, mapping_id: { type: integer }, decision: { type: string }, main_class: { type: [string, 'null'] }, sub_class: { type: [string, 'null'] }, method: { type: string }, confidence: { type: integer }, flag: { type: [string, 'null'] }, flag_text: { type: [string, 'null'], description: "`flag` in the request's language." }, reviewed: { type: boolean } } }
        note_mapping:
          type: object
          properties:
            distinct_pairs: { type: integer }
            by_method: { type: object, additionalProperties: { type: integer } }
            unmapped: { type: integer }
            unmapped_rows: { type: integer }
        review:
          type: object
          properties:
            mappings: { type: integer }
            reviewed: { type: integer }
            flagged_unreviewed: { type: integer }
            flagged_rows: { type: integer }
            flagged_top: { type: array, maxItems: 20, items: { type: object, properties: { mapping_id: { type: integer }, kind: { type: string }, value: { type: string }, sub_class: { type: [string, 'null'] }, flag: { type: string }, flag_text: { type: [string, 'null'], description: "`flag` in the request's language." }, rows: { type: integer } } } }
            pending_below_cutoff: { type: integer }
            cutoff: { type: integer }
        open_decisions:
          type: array
          description: 'Per policy (config `classification.import.policies`): mode, rows, and rows that would change if switched (key `rows_changing_if_switched_to_function|nature`).'
          items:
            type: object
            additionalProperties: true
            properties:
              policy: { type: string }
              label: { type: string }
              decision: { type: string }
              mode: { type: string, enum: [function, nature] }
              rows: { type: integer }
              switch: { type: string, description: 'How to switch (env var, then apply again).' }
              switch_text: { type: string, description: "`switch` in the request's language." }
              by_function: { type: object, additionalProperties: { type: integer } }
              by_nature: { type: object, additionalProperties: { type: integer } }
        name_layer:
          type: object
          description: Preview with this import's rows, by name only vs by name + balance side.
          properties:
            min_share: { type: integer }
            min_companies: { type: integer }
            names: { type: integer }
            usable_by_name: { type: integer }
            usable_by_name_side: { type: integer }
            conflicts_before: { type: integer }
            conflicts_after: { type: integer }
            conflicts: { type: array, maxItems: 100, items: { type: object, properties: { name: { type: string }, side: { type: [string, 'null'], enum: [debit, credit, null] }, companies: { type: integer }, share: { type: integer }, votes: { type: object, additionalProperties: { type: integer } } } } }

    ImportMappingFields:
      type: object
      description: 'One distinct value of an import: kind `budget` = a الميزانية value → main class (or route / skip); `note` = a (main class or `route`, الإيضاحات) pair → sub-class.'
      required: [id, import_id, kind, value, normalized, parent, decision, main_class, sub_class, function_sub_class, policy, method, confidence, reason, flag, reviewed, rows, created_at, updated_at, reason_text, flag_text]
      properties:
        id: { type: integer }
        import_id: { type: integer }
        kind: { type: string, enum: [budget, note] }
        value: { type: string }
        normalized: { type: string }
        parent: { type: [string, 'null'], description: "Note only: the budget mapping's main class, or `route`." }
        decision: { type: string, enum: [map, route, skip] }
        main_class: { type: [string, 'null'] }
        sub_class: { type: [string, 'null'], description: 'Note: the target by nature.' }
        function_sub_class: { type: [string, 'null'], description: 'Note under a policy: the target by function.' }
        policy: { type: [string, 'null'] }
        method: { type: string, enum: [taxonomy, override, side_rule, llm, reused, manual] }
        confidence: { type: integer }
        reason: { type: [string, 'null'] }
        flag: { type: [string, 'null'], description: Why the accountant must look at it before apply. }
        reason_text: { type: [string, 'null'], description: "`reason` in the request's language when the system worded it; the AI's or the config's reason as it is." }
        flag_text: { type: [string, 'null'], description: "`flag` in the request's language when the system worded it; a config flag as it is." }
        reviewed: { type: boolean }
        rows: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ImportMapping:
      allOf:
        - $ref: '#/components/schemas/ImportMappingFields'
        - type: object
          required: [samples, active_sub, active_main, policy_mode]
          properties:
            samples: { type: array, maxItems: 3, items: { type: object, required: [name, company], properties: { name: { type: string }, company: { type: [string, 'null'] } } } }
            active_sub: { type: [string, 'null'], description: "The sub-class its rows get today (a note's policy mode decides)." }
            active_main: { type: [string, 'null'] }
            policy_mode: { type: [string, 'null'], enum: [function, nature, null] }

    ExportImportReport:
      type: object
      description: Stored report of an import created from a JSON export (`kind = export`).
      required: [kind, budget_mappings, note_mappings]
      properties:
        kind: { type: string, enum: [export] }
        budget_mappings: { $ref: '#/components/schemas/TransferMappingsReport' }
        note_mappings: { $ref: '#/components/schemas/TransferMappingsReport' }
    TransferMappingsReport:
      type: object
      required: [stored, skipped_unknown_class]
      properties:
        stored: { type: integer }
        skipped_unknown_class: { type: array, items: { type: string }, description: Values whose class is unknown here. }

    CacheExport:
      type: object
      required: [format, format_version, exported_at, taxonomy_version, taxonomy_subclasses, filters, cache_entries, budget_mappings, note_mappings, name_layer]
      properties:
        format: { type: string, const: classification-cache-export }
        format_version: { type: integer, const: 1 }
        exported_at: { type: string, format: date-time }
        taxonomy_version: { type: string }
        taxonomy_subclasses: { type: array, items: { type: string } }
        filters: { type: object, description: 'The non-empty `source` / `from` / `to`.' }
        cache_entries:
          type: array
          items:
            type: object
            description: 'Stored fields: `key_hash`, `name_hash`, `normalized_key`, `original_name`, `account_code`, `budget_item`, `row_type`, `main_class`, `sub_class`, `source`, `confidence`, `reason`, `taxonomy_version`, `hit_count`, `side` (`debit` / `credit` / null), `side_locked` (boolean), `created_at`, `updated_at`. `base_hash` is not exported (recomputed on import).'
        budget_mappings:
          type: array
          items:
            type: object
            description: '`kind`, `value`, `normalized`, `parent`, `decision`, `main_class`, `sub_class`, `function_sub_class`, `policy`, `method`, `confidence`, `reason`, `flag`, `reviewed`, `updated_at`.'
        note_mappings: { type: array, items: { type: object }, description: Same fields as `budget_mappings`. }
        name_layer:
          type: array
          items: { type: object, required: [side, normalized_name, original_name, sub_class, companies, share], properties: { side: { type: string, enum: [debit, credit] }, normalized_name: { type: string }, original_name: { type: string }, sub_class: { type: string }, companies: { type: integer }, share: { type: integer } } }

    ImportRowCounts:
      type: object
      properties:
        total: { type: integer }
        companies: { type: integer }
        mapped: { type: integer, description: 'Rows with a sub-class (key conflicts and cache-held keys excluded).' }
        approved: { type: integer, description: 'Mapped rows approved (cumulative: does not drop after apply).' }
        pending_review: { type: integer }
        applied: { type: integer, description: 'Every row the last apply went through, kept ones (key_conflict, cache_has_entry) included.' }
        ready: { type: integer, description: 'Approved rows not written yet: what the next apply adds. A row whose class or approval changed since the last apply counts again.' }
        written: { type: integer, description: 'Approved rows written by apply.' }
        kept_existing: { type: integer, description: 'Rows apply went through but kept out of the cache (a manual correction or AI answer holds the key, or the key got two sub-classes).' }
        cache_entries: { type: integer, description: 'Cache entries this import wrote (rows sharing a key share one entry).' }
        skipped: { type: integer }

